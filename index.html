function KpiCard({ label, value, tone }) {
  const toneColor = tone === "danger" ? "#B4231D" : tone === "warning" ? "#A15C00" : "#172033";
  return (
    <div style={{ background: "#F5F6F4", borderRadius: 10, padding: "14px 16px" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#8A8D86", fontFamily: "Inter" }}>{label}</div>
      <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 24, color: toneColor, marginTop: 4 }}>{value}</div>
    </div>
  );
}

function DashboardTab({ orders, deliveries, catalog, restocks, spins, dupCount }) {
  const paidOrders = orders.filter((o) => o.paymentStatus === "Paid");
  const unpaidOrders = orders.filter((o) => o.paymentStatus !== "Paid");
  const totalOrders = paidOrders.length;
  const totalRevenue = paidOrders.reduce((s, o) => s + o.total, 0);
  const outstandingValue = unpaidOrders.reduce((s, o) => s + o.total, 0);
  const avgOrder = paidOrders.length ? totalRevenue / paidOrders.length : 0;
  const delivered = paidOrders.filter((o) => deliveries[o.id]).length;
  const pending = paidOrders.length - delivered;
  const stockRows = useMemo(() => computeStock(catalog, paidOrders, restocks), [catalog, paidOrders, restocks]);
  const outOfStock = stockRows.filter((r) => r.status === "OUT OF STOCK").length;
  const lowStock = stockRows.filter((r) => r.status === "LOW STOCK").length;
  const totalUnits = paidOrders.reduce((s, o) => s + expandOrderItems(o.items, catalog).reduce((s2, it) => s2 + it.qty, 0), 0);
  const uniqueCustomers = useMemo(() => {
    const set = new Set(orders.map((o) => (o.customer || "").trim().toLowerCase()).filter(Boolean));
    return set.size;
  }, [orders]);

  const paymentBreakdown = useMemo(() => {
    const methods = ["Cash", "Card", "InstaPay"];
    return methods.map((m) => {
      const os = paidOrders.filter((o) => o.payment === m);
      const rev = os.reduce((s, o) => s + o.total, 0);
      return { method: m, count: os.length, revenue: rev, pct: totalRevenue ? rev / totalRevenue : 0 };
    });
  }, [paidOrders, totalRevenue]);

  const topSellers = useMemo(() => {
    const agg = {};
    paidOrders.forEach((o) => expandOrderItems(o.items, catalog).forEach((it) => { agg[it.name] = (agg[it.name] || 0) + it.qty; }));
    return Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 5);
  }, [paidOrders, catalog]);

  const lowestStock = useMemo(() => [...stockRows].sort((a, b) => a.remaining - b.remaining).slice(0, 5), [stockRows]);
  const recentOrders = orders.slice().sort((a, b) => b.seq - a.seq).slice(0, 5);

  const spinBreakdown = useMemo(() => {
    const all = Object.values(spins);
    const orderSpins = all.filter((s) => s.source !== "subscription"); // missing/legacy source treated as order
    const subSpins = all.filter((s) => s.source === "subscription");
    const uniqueOf = (list) => new Set(list.map((s) => (s.userId || "").trim().toLowerCase()).filter(Boolean)).size;
    return {
      total: all.length,
      fromOrder: orderSpins.length,
      fromSubscription: subSpins.length,
      uniqueOrder: uniqueOf(orderSpins),
      uniqueSubscription: uniqueOf(subSpins),
      uniqueTotal: uniqueOf(all),
    };
  }, [spins]);

  const attendeeBreakdown = useMemo(() => {
    const byUser = {};
    paidOrders.forEach((o) => {
      byUser[o.userId] = { userType: o.userType || "Other", attendeeStatus: o.attendeeStatus || "New" };
    });
    const people = Object.values(byUser);
    const types = ["Doctor", "Student", "Other"];
    return types.map((t) => {
      const ofType = people.filter((p) => p.userType === t);
      const newCount = ofType.filter((p) => p.attendeeStatus === "New").length;
      const oldCount = ofType.filter((p) => p.attendeeStatus === "Old").length;
      return { type: t, newCount, oldCount, total: ofType.length };
    });
  }, [paidOrders]);
  const totalAttendees = attendeeBreakdown.reduce((s, r) => s + r.total, 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card>
        <SectionTitle icon={LayoutDashboard}>Overview</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }} className="responsive-grid-4">
          <KpiCard label="TOTAL ORDERS (PAID)" value={totalOrders} />
          <KpiCard label="ORDERS NOT PAID" value={unpaidOrders.length} tone={unpaidOrders.length > 0 ? "warning" : undefined} />
          <KpiCard label="REVENUE COLLECTED" value={fmtMoney(totalRevenue)} />
          <KpiCard label="OUTSTANDING (UNPAID)" value={fmtMoney(outstandingValue)} tone={outstandingValue > 0 ? "warning" : undefined} />
          <KpiCard label="AVG PAID ORDER VALUE" value={fmtMoney(avgOrder)} />
          <KpiCard label="TOTAL UNITS SOLD" value={totalUnits} />
          <KpiCard label="UNIQUE CUSTOMERS" value={uniqueCustomers} />
          <KpiCard label="DELIVERED" value={delivered} />
          <KpiCard label="PAID, AWAITING DELIVERY" value={pending} tone={pending > 0 ? "warning" : undefined} />
          <KpiCard label="OUT OF STOCK" value={outOfStock} tone={outOfStock > 0 ? "danger" : undefined} />
        </div>
      </Card>

      <div style={{ background: dupCount > 0 ? "#FBE7E5" : "#E4F5EC", borderRadius: 10, padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, fontFamily: "Inter", fontWeight: 600, fontSize: 13, color: dupCount > 0 ? "#B4231D" : "#1F7A4D" }}>
        {dupCount > 0 ? <AlertTriangle size={16} /> : <CheckCircle2 size={16} />}
        {dupCount > 0 ? `${dupCount} duplicate delivery attempt(s) detected — check the Delivery tab.` : "No duplicate delivery attempts detected."}
      </div>

      <Card>
        <SectionTitle icon={Users}>Attendees by type ({totalAttendees} unique, by User ID)</SectionTitle>
        <table style={{ width: "100%", fontFamily: "Inter", fontSize: 13, borderCollapse: "collapse" }}>
          <thead><tr style={{ color: "#8A8D86", fontSize: 11, fontWeight: 700, textAlign: "left" }}><th style={{ padding: "4px 6px" }}>TYPE</th><th>NEW</th><th>OLD</th><th>TOTAL</th></tr></thead>
          <tbody>
            {attendeeBreakdown.map((r) => (
              <tr key={r.type} style={{ borderTop: "1px solid #EEF0EE" }}>
                <td style={{ padding: "6px" }}>{r.type}</td>
                <td>{r.newCount}</td>
                <td>{r.oldCount}</td>
                <td style={{ fontWeight: 700 }}>{r.total}</td>
              </tr>
            ))}
            <tr style={{ borderTop: "1px solid #172033", fontWeight: 700 }}>
              <td style={{ padding: "6px" }}>Total</td>
              <td>{attendeeBreakdown.reduce((s, r) => s + r.newCount, 0)}</td>
              <td>{attendeeBreakdown.reduce((s, r) => s + r.oldCount, 0)}</td>
              <td>{totalAttendees}</td>
            </tr>
          </tbody>
        </table>
      </Card>

      <Card>
        <SectionTitle icon={Gift}>Spin the Wheel — spins given ({spinBreakdown.total})</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8D86", marginBottom: 8 }}>
          A doctor who spun once from an order and once from a subscription counts once in each source's "Unique" column.
        </div>
        <table style={{ width: "100%", fontFamily: "Inter", fontSize: 13, borderCollapse: "collapse" }}>
          <thead><tr style={{ color: "#8A8D86", fontSize: 11, fontWeight: 700, textAlign: "left" }}><th style={{ padding: "4px 6px" }}>SOURCE</th><th>SPINS</th><th>UNIQUE SPINNERS</th></tr></thead>
          <tbody>
            <tr style={{ borderTop: "1px solid #EEF0EE" }}>
              <td style={{ padding: "6px" }}>From orders (purchase above threshold)</td>
              <td style={{ fontWeight: 700 }}>{spinBreakdown.fromOrder}</td>
              <td style={{ fontWeight: 700 }}>{spinBreakdown.uniqueOrder}</td>
            </tr>
            <tr style={{ borderTop: "1px solid #EEF0EE" }}>
              <td style={{ padding: "6px" }}>From subscriptions (no purchase)</td>
              <td style={{ fontWeight: 700 }}>{spinBreakdown.fromSubscription}</td>
              <td style={{ fontWeight: 700 }}>{spinBreakdown.uniqueSubscription}</td>
            </tr>
            <tr style={{ borderTop: "1px solid #172033", fontWeight: 700 }}>
              <td style={{ padding: "6px" }}>Total</td>
              <td>{spinBreakdown.total}</td>
              <td>{spinBreakdown.uniqueTotal}</td>
            </tr>
          </tbody>
        </table>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }} className="responsive-grid">
        <Card>
          <SectionTitle icon={Users}>Revenue by payment method</SectionTitle>
          <table style={{ width: "100%", fontFamily: "Inter", fontSize: 13, borderCollapse: "collapse" }}>
            <thead><tr style={{ color: "#8A8D86", fontSize: 11, fontWeight: 700, textAlign: "left" }}><th style={{ padding: "4px 6px" }}>METHOD</th><th>ORDERS</th><th>REVENUE</th><th>%</th></tr></thead>
            <tbody>
              {paymentBreakdown.map((p) => (
                <tr key={p.method} style={{ borderTop: "1px solid #EEF0EE" }}>
                  <td style={{ padding: "6px" }}>{p.method}</td><td>{p.count}</td><td>{fmtMoney(p.revenue)}</td><td>{Math.round(p.pct * 100)}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
        <Card>
          <SectionTitle icon={TrendingUp}>Top 5 best-selling products</SectionTitle>
          <table style={{ width: "100%", fontFamily: "Inter", fontSize: 13, borderCollapse: "collapse" }}>
            <thead><tr style={{ color: "#8A8D86", fontSize: 11, fontWeight: 700, textAlign: "left" }}><th style={{ padding: "4px 6px" }}>#</th><th>PRODUCT</th><th>UNITS SOLD</th></tr></thead>
            <tbody>
              {topSellers.length === 0 && <tr><td colSpan={3} style={{ padding: 8, color: "#8A8D86" }}>No sales yet.</td></tr>}
              {topSellers.map(([name, qty], i) => (
                <tr key={name} style={{ borderTop: "1px solid #EEF0EE" }}><td style={{ padding: "6px" }}>{i + 1}</td><td>{name}</td><td style={{ fontWeight: 700 }}>{qty}</td></tr>
              ))}
            </tbody>
          </table>
        </Card>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.3fr", gap: 16 }} className="responsive-grid">
        <Card>
          <SectionTitle icon={AlertTriangle}>Items running low</SectionTitle>
          <table style={{ width: "100%", fontFamily: "Inter", fontSize: 13, borderCollapse: "collapse" }}>
            <thead><tr style={{ color: "#8A8D86", fontSize: 11, fontWeight: 700, textAlign: "left" }}><th style={{ padding: "4px 6px" }}>PRODUCT</th><th>REMAINING</th></tr></thead>
            <tbody>
              {lowestStock.map((r) => (
                <tr key={r.name} style={{ borderTop: "1px solid #EEF0EE" }}>
                  <td style={{ padding: "6px" }}>{r.name}</td>
                  <td style={{ fontWeight: 700, color: r.remaining <= 0 ? "#B4231D" : "#172033" }}>{r.remaining}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
        <Card>
          <SectionTitle icon={ClipboardList}>Recent orders</SectionTitle>
          <table style={{ width: "100%", fontFamily: "Inter", fontSize: 13, borderCollapse: "collapse" }}>
            <thead><tr style={{ color: "#8A8D86", fontSize: 11, fontWeight: 700, textAlign: "left" }}><th style={{ padding: "4px 6px" }}>ORDER</th><th>CUSTOMER</th><th>TOTAL</th><th>PAYMENT</th><th>DELIVERY</th></tr></thead>
            <tbody>
              {recentOrders.map((o) => (
                <tr key={o.id} style={{ borderTop: "1px solid #EEF0EE" }}>
                  <td style={{ padding: "6px", fontFamily: "JetBrains Mono", fontWeight: 700, fontSize: 12 }}>{o.id}</td>
                  <td>{o.customer}</td><td>{fmtMoney(o.total)}</td>
                  <td><Badge tone={o.paymentStatus === "Paid" ? "success" : "warning"}>{o.paymentStatus}</Badge></td>
                  <td><Badge tone={deliveries[o.id] ? "success" : "neutral"}>{deliveries[o.id] ? "Delivered" : "Pending"}</Badge></td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      </div>
    </div>
  );
}

function AuthGate({ usersExist, onLoggedIn, onUsersReset }) {
  const [mode, setMode] = useState(usersExist ? "login" : "setup");
  useEffect(() => setMode(usersExist ? "login" : "setup"), [usersExist]);

  const [username, setUsername] = useState(usersExist ? "" : "essam");
  const [name, setName] = useState("Essam Galal");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [showRecovery, setShowRecovery] = useState(false);
  const [recoveryConfirmText, setRecoveryConfirmText] = useState("");
  const [resetting, setResetting] = useState(false);

  const handleSetup = async () => {
    setError("");
    if (!username.trim() || !name.trim()) { setError("Enter a username and name."); return; }
    if (password.length < 4) { setError("Password must be at least 4 characters."); return; }
    if (password !== confirmPassword) { setError("Passwords don't match."); return; }
    setBusy(true);
    try {
      const salt = genSalt();
      const passwordHash = await hashPassword(password, salt);
      const user = {
        username: username.trim().toLowerCase(),
        name: name.trim(),
        role: "admin",
        permissions: ALL_TABS.map((t) => t.id),
        salt, passwordHash,
        createdAt: Date.now(),
      };
      const ok = await setShared(userKey(user.username), user);
      if (!ok) { setError("Couldn't save the account — check your connection and try again."); return; }
      onLoggedIn(user);
    } catch (e) {
      console.error("Account setup failed", e);
      setError(`Something went wrong setting up the account: ${e && e.message ? e.message : e}`);
    } finally {
      setBusy(false);
    }
  };

  const handleLogin = async () => {
    setError("");
    if (!username.trim() || !password) { setError("Enter your username and password."); return; }
    setBusy(true);
    try {
      const user = await getShared(userKey(username), null);
      if (!user) { setError("Incorrect username or password."); return; }
      const hash = await hashPassword(password, user.salt);
      if (hash !== user.passwordHash) { setError("Incorrect username or password."); return; }
      onLoggedIn(user);
    } catch (e) {
      console.error("Login failed", e);
      setError(`Something went wrong signing in: ${e && e.message ? e.message : e}`);
    } finally {
      setBusy(false);
    }
  };

  const handleResetAccounts = async () => {
    setResetting(true);
    const keys = await listShared("user:");
    await Promise.all(keys.map((k) => deleteShared(k)));
    setResetting(false);
    setShowRecovery(false);
    setRecoveryConfirmText("");
    onUsersReset();
  };

  return (
    <div style={{ minHeight: 420, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter" }}>
      <style>{FONT_IMPORT}</style>
      <div style={{ background: "#fff", border: "1px solid #E1E4E2", borderRadius: 14, padding: "28px 26px", width: 360 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
          <img src={LOGO_DAF} alt="DAF for Digital Solutions" style={{ height: 42, width: "auto" }} />
          <img src={LOGO_EDS} alt="EDS Marketplace, powered by DAF" style={{ height: 36, width: "auto" }} />
        </div>

        {showRecovery ? (
          <div>
            <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 16, color: "#172033", marginBottom: 8, textAlign: "center" }}>
              Reset all accounts?
            </div>
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#5B5E56", lineHeight: 1.6, marginBottom: 14 }}>
              This permanently deletes <strong>every user account</strong> (admin and staff), so no old password can get you locked out again — you'll set up a brand-new admin account right after.
              <br /><br />
              <strong style={{ color: "#1F7A4D" }}>It does NOT touch</strong> your orders, products, stock, or Spin the Wheel data — none of that is affected.
            </div>
            <input value={recoveryConfirmText} onChange={(e) => setRecoveryConfirmText(e.target.value)} placeholder='Type RESET to confirm' style={{ ...inputStyle, marginBottom: 10 }} />
            <button onClick={handleResetAccounts} disabled={recoveryConfirmText !== "RESET" || resetting}
              style={{ ...btnPrimary, width: "100%", background: "#B4231D", opacity: recoveryConfirmText !== "RESET" || resetting ? 0.4 : 1 }}>
              {resetting ? "Resetting…" : "Reset all accounts"}
            </button>
            <button onClick={() => { setShowRecovery(false); setRecoveryConfirmText(""); }} style={{ ...btnSecondary, width: "100%", marginTop: 8 }}>
              Cancel
            </button>
          </div>
        ) : (
          <>
            <div style={{ textAlign: "center", marginBottom: 18 }}>
              <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 17, color: "#172033" }}>
                {mode === "setup" ? "Set up the admin account" : "Sign in"}
              </div>
              {mode === "setup" && (
                <div style={{ fontSize: 12.5, color: "#8A8D86", marginTop: 4 }}>
                  No accounts exist yet — create the first admin account to get started.
                </div>
              )}
            </div>

            {mode === "setup" && (
              <div style={{ marginBottom: 10 }}>
                <label style={labelStyle}>Full name</label>
                <input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} />
              </div>
            )}
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Username</label>
              <input value={username} onChange={(e) => setUsername(e.target.value)} style={inputStyle} autoCapitalize="none" />
            </div>
            <div style={{ marginBottom: 10 }}>
              <label style={labelStyle}>Password</label>
              <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter" && mode === "login") handleLogin(); }}
                style={inputStyle} />
            </div>
            {mode === "setup" && (
              <div style={{ marginBottom: 10 }}>
                <label style={labelStyle}>Confirm password</label>
                <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} style={inputStyle} />
              </div>
            )}
            {error && <div style={{ color: "#B4231D", fontSize: 13, marginBottom: 10 }}>{error}</div>}
            <button onClick={mode === "setup" ? handleSetup : handleLogin} disabled={busy} style={{ ...btnPrimary, width: "100%", opacity: busy ? 0.6 : 1 }}>
              {busy ? "Please wait…" : mode === "setup" ? "Create admin account" : "Sign in"}
            </button>
            {mode === "login" && (
              <button onClick={() => setShowRecovery(true)} style={{ background: "transparent", border: "none", color: "#8A8D86", fontSize: 12, textDecoration: "underline", cursor: "pointer", display: "block", margin: "10px auto 0" }}>
                Forgot password? Reset all accounts
              </button>
            )}
            <div style={{ fontSize: 11, color: "#8A8D86", textAlign: "center", marginTop: 14, lineHeight: 1.5 }}>
              You'll need to sign in again each time you reopen this app on a device.
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function UsersTab({ currentUser, onUsersChanged, onClearOrderData }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [name, setName] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [role, setRole] = useState("staff");
  const [permissions, setPermissions] = useState(ALL_TABS.map((t) => t.id));
  const [formError, setFormError] = useState("");
  const [saving, setSaving] = useState(false);
  const [confirmDeleteUsername, setConfirmDeleteUsername] = useState(null);
  const [resetPasswordFor, setResetPasswordFor] = useState(null);
  const [resetPasswordValue, setResetPasswordValue] = useState("");
  const [clearConfirmText, setClearConfirmText] = useState("");
  const [clearing, setClearing] = useState(false);
  const [clearDone, setClearDone] = useState(false);
  const [overridePasscode, setOverridePasscode] = useState("");
  const [passcodeLoaded, setPasscodeLoaded] = useState(false);
  const [savingPasscode, setSavingPasscode] = useState(false);
  const [passcodeSavedMessage, setPasscodeSavedMessage] = useState("");

  useEffect(() => {
    getShared("limitOverridePasscode", "").then((v) => { setOverridePasscode(v || ""); setPasscodeLoaded(true); });
  }, []);

  const handleSavePasscode = async () => {
    setSavingPasscode(true);
    setPasscodeSavedMessage("");
    const ok = await setShared("limitOverridePasscode", overridePasscode.trim());
    setSavingPasscode(false);
    setPasscodeSavedMessage(ok ? "Saved." : "Couldn't save — check your connection and try again.");
  };

  const refresh = async () => {
    setLoading(true);
    setUsers(await loadAllUsers());
    setLoading(false);
  };
  useEffect(() => { refresh(); }, []);

  const togglePermission = (id) => {
    setPermissions((prev) => (prev.includes(id) ? prev.filter((p) => p !== id) : [...prev, id]));
  };

  const handleAddUser = async () => {
    setFormError("");
    if (!name.trim() || !username.trim()) { setFormError("Enter a name and username."); return; }
    if (password.length < 4) { setFormError("Password must be at least 4 characters."); return; }
    const key = userKey(username);
    const existing = await getShared(key, null);
    if (existing) { setFormError("That username is already taken."); return; }
    setSaving(true);
    const salt = genSalt();
    const passwordHash = await hashPassword(password, salt);
    const user = {
      username: username.trim().toLowerCase(), name: name.trim(), role,
      permissions: role === "admin" ? ALL_TABS.map((t) => t.id) : permissions,
      salt, passwordHash, createdAt: Date.now(),
    };
    const ok = await setShared(key, user);
    setSaving(false);
    if (!ok) { setFormError("Couldn't save — check your connection and try again."); return; }
    setName(""); setUsername(""); setPassword(""); setRole("staff"); setPermissions(ALL_TABS.map((t) => t.id));
    await refresh();
    onUsersChanged();
  };

  const updateUserPermissions = async (user, newPermissions) => {
    const updated = { ...user, permissions: newPermissions };
    setUsers((prev) => prev.map((u) => (u.username === user.username ? updated : u)));
    await setShared(userKey(user.username), updated);
    onUsersChanged();
  };
  const updateUserRole = async (user, newRole) => {
    const updated = { ...user, role: newRole, permissions: newRole === "admin" ? ALL_TABS.map((t) => t.id) : (user.permissions || []) };
    setUsers((prev) => prev.map((u) => (u.username === user.username ? updated : u)));
    await setShared(userKey(user.username), updated);
    onUsersChanged();
  };
  const deleteUser = async (user) => {
    if (user.username === currentUser.username) { setConfirmDeleteUsername(null); return; }
    await deleteShared(userKey(user.username));
    setUsers((prev) => prev.filter((u) => u.username !== user.username));
    setConfirmDeleteUsername(null);
    onUsersChanged();
  };
  const handleResetPassword = async (user) => {
    if (resetPasswordValue.length < 4) return;
    const salt = genSalt();
    const passwordHash = await hashPassword(resetPasswordValue, salt);
    const updated = { ...user, salt, passwordHash };
    await setShared(userKey(user.username), updated);
    setUsers((prev) => prev.map((u) => (u.username === user.username ? updated : u)));
    setResetPasswordFor(null);
    setResetPasswordValue("");
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card>
        <SectionTitle icon={UserCog}>Add a user</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10 }} className="responsive-grid-4">
          <div><label style={labelStyle}>Full name</label><input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} /></div>
          <div><label style={labelStyle}>Username</label><input value={username} onChange={(e) => setUsername(e.target.value)} style={inputStyle} /></div>
          <div><label style={labelStyle}>Temporary password</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={inputStyle} /></div>
          <div><label style={labelStyle}>Role</label>
            <select value={role} onChange={(e) => setRole(e.target.value)} style={inputStyle}>
              <option value="staff">Staff (choose access below)</option>
              <option value="admin">Admin (full access)</option>
            </select>
          </div>
        </div>
        {role === "staff" && (
          <div style={{ marginTop: 12 }}>
            <label style={labelStyle}>Pages this user can access</label>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {ALL_TABS.map((t) => (
                <label key={t.id} style={{ display: "flex", alignItems: "center", gap: 6, background: permissions.includes(t.id) ? "#FBEAC8" : "#F5F6F4", border: "1px solid #E1E4E2", borderRadius: 8, padding: "6px 10px", fontSize: 12.5, fontFamily: "Inter", cursor: "pointer" }}>
                  <input type="checkbox" checked={permissions.includes(t.id)} onChange={() => togglePermission(t.id)} />
                  {t.label}
                </label>
              ))}
            </div>
          </div>
        )}
        <button onClick={handleAddUser} disabled={saving} style={{ ...btnPrimary, marginTop: 14 }}>{saving ? "Saving…" : "Add user"}</button>
        {formError && <div style={{ color: "#B4231D", fontSize: 13, marginTop: 8 }}>{formError}</div>}
      </Card>

      <Card>
        <SectionTitle icon={Users}>Users ({users.length})</SectionTitle>
        {loading ? <div style={{ color: "#8A8D86", fontSize: 13 }}>Loading…</div> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {users.map((u) => (
              <div key={u.username} style={{ border: "1px solid #E1E4E2", borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <div>
                    <span style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 14, color: "#172033" }}>{u.name}</span>
                    <span style={{ fontFamily: "Inter", fontSize: 12.5, color: "#8A8D86", marginLeft: 8 }}>@{u.username}</span>
                    {u.username === currentUser.username && <Badge tone="accent">You</Badge>}
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <select value={u.role} onChange={(e) => updateUserRole(u, e.target.value)} style={{ ...inputStyle, width: 140, padding: "5px 8px" }}>
                      <option value="staff">Staff</option>
                      <option value="admin">Admin</option>
                    </select>
                    {resetPasswordFor === u.username ? (
                      <>
                        <input type="password" placeholder="New password" value={resetPasswordValue} onChange={(e) => setResetPasswordValue(e.target.value)} style={{ ...inputStyle, width: 140, padding: "5px 8px" }} />
                        <button onClick={() => handleResetPassword(u)} style={{ ...btnSecondary, padding: "5px 8px" }}>Save</button>
                        <button onClick={() => { setResetPasswordFor(null); setResetPasswordValue(""); }} style={{ ...btnSecondary, padding: "5px 8px" }}>Cancel</button>
                      </>
                    ) : (
                      <button onClick={() => setResetPasswordFor(u.username)} style={{ ...btnSecondary, padding: "5px 8px", display: "flex", alignItems: "center", gap: 4 }}><KeyRound size={13} /> Reset password</button>
                    )}
                    {confirmDeleteUsername === u.username ? (
                      <>
                        <button onClick={() => deleteUser(u)} disabled={u.username === currentUser.username} style={{ ...btnSecondary, padding: "5px 8px", background: "#B4231D", color: "#fff", border: "1px solid #B4231D", opacity: u.username === currentUser.username ? 0.4 : 1 }}>Yes</button>
                        <button onClick={() => setConfirmDeleteUsername(null)} style={{ ...btnSecondary, padding: "5px 8px" }}>Cancel</button>
                      </>
                    ) : (
                      <button onClick={() => setConfirmDeleteUsername(u.username)} disabled={u.username === currentUser.username} style={{ ...btnSecondary, padding: "5px 8px", opacity: u.username === currentUser.username ? 0.4 : 1 }}><Trash2 size={13} /></button>
                    )}
                  </div>
                </div>
                {u.role === "staff" && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 10 }}>
                    {ALL_TABS.map((t) => {
                      const has = (u.permissions || []).includes(t.id);
                      return (
                        <label key={t.id} style={{ display: "flex", alignItems: "center", gap: 5, background: has ? "#FBEAC8" : "#F5F6F4", border: "1px solid #E1E4E2", borderRadius: 8, padding: "4px 8px", fontSize: 11.5, fontFamily: "Inter", cursor: "pointer" }}>
                          <input type="checkbox" checked={has} onChange={() => updateUserPermissions(u, has ? (u.permissions || []).filter((p) => p !== t.id) : [...(u.permissions || []), t.id])} />
                          {t.label}
                        </label>
                      );
                    })}
                  </div>
                )}
                {u.role === "admin" && <div style={{ fontSize: 11.5, color: "#8A8D86", marginTop: 6 }}>Full access to every page.</div>}
              </div>
            ))}
          </div>
        )}
      </Card>

      <Card>
        <SectionTitle icon={KeyRound}>Purchase limit override passcode</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", marginBottom: 10 }}>
          When a customer's order would exceed a product's per-customer limit, staff can enter this passcode to override it and continue anyway. Share it only with staff who should be able to approve exceptions.
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <input value={overridePasscode} disabled={!passcodeLoaded} onChange={(e) => setOverridePasscode(e.target.value)} placeholder="e.g. 4477" style={{ ...inputStyle, width: 180 }} />
          <button onClick={handleSavePasscode} disabled={savingPasscode} style={{ ...btnPrimary, opacity: savingPasscode ? 0.6 : 1 }}>
            {savingPasscode ? "Saving…" : "Save passcode"}
          </button>
          {passcodeSavedMessage && <span style={{ fontSize: 13, color: "#1F7A4D", fontFamily: "Inter", fontWeight: 600 }}>{passcodeSavedMessage}</span>}
        </div>
      </Card>

      <Card style={{ border: "1px solid #F3B7B2" }}>
        <SectionTitle icon={AlertTriangle}>Danger zone — clear order data</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", lineHeight: 1.7, marginBottom: 12 }}>
          This permanently deletes <strong>all orders</strong> (and their payment status), <strong>deliveries</strong>, <strong>Spin the Wheel</strong> records, and the duplicate-delivery log — then restarts order numbering back at ORD-00001.
          <br />
          <strong style={{ color: "#1F7A4D" }}>It does NOT touch</strong>: your product/bundle catalog, your saved starter product list, stock and restock history, or user accounts — those stay exactly as they are.
          <br />
          This cannot be undone. Export your data first if you want a backup.
        </div>
        {clearDone ? (
          <div style={{ background: "#E4F5EC", border: "1px solid #B9E3CB", borderRadius: 8, padding: "10px 14px", fontSize: 13, color: "#1F7A4D", fontWeight: 600 }}>
            Order data cleared. Products, stock, and user accounts were left untouched.
          </div>
        ) : (
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <input value={clearConfirmText} onChange={(e) => setClearConfirmText(e.target.value)} placeholder='Type RESET to enable' style={{ ...inputStyle, width: 200 }} />
            <button
              onClick={async () => { setClearing(true); await onClearOrderData(); setClearing(false); setClearDone(true); setClearConfirmText(""); }}
              disabled={clearConfirmText !== "RESET" || clearing}
              style={{ ...btnPrimary, background: "#B4231D", opacity: clearConfirmText !== "RESET" || clearing ? 0.4 : 1 }}
            >
              {clearing ? "Clearing…" : "Clear all order data"}
            </button>
          </div>
        )}
      </Card>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("order");
  const [catalog, setCatalog] = useState(DEFAULT_CATALOG);
  const [orders, setOrders] = useState([]);
  const [deliveries, setDeliveries] = useState({});
  const [dupCount, setDupCount] = useState(0);
  const [restocks, setRestocks] = useState([]);
  const [spins, setSpins] = useState({});
  const [subscriptions, setSubscriptions] = useState([]);
  const [eventName, setEventName] = useState("IDEX Cairo Egypt 2026");
  const [eventLogo, setEventLogo] = useState(null);
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [usersExist, setUsersExist] = useState(null); // null = still checking
  const initialized = useRef(false);
  const catalogDirtyUntil = useRef(0);
  const eventNameDirtyUntil = useRef(0);
  const eventLogoDirtyUntil = useRef(0);

  useEffect(() => {
    let cancelled = false;
    const check = async () => {
      let keys = await listShared("user:");
      if (keys.length === 0) {
        // Retry once — an empty result could be a transient fetch failure,
        // and we don't want that to wrongly show "set up admin account"
        // to someone whose account already exists.
        await new Promise((r) => setTimeout(r, 800));
        keys = await listShared("user:");
      }
      if (!cancelled) setUsersExist(keys.length > 0);
    };
    check();
    return () => { cancelled = true; };
  }, []);

  const handleLoggedIn = (user) => {
    setCurrentUser({ username: user.username, name: user.name, role: user.role, permissions: user.permissions || [] });
    setUsersExist(true);
    setTab(user.role === "admin" || (user.permissions || []).includes("order") ? "order" : (user.permissions || [])[0] || "dashboard");
  };
  const handleLogout = () => setCurrentUser(null);
  const handleUsersChanged = () => {
    if (currentUser) {
      getShared(userKey(currentUser.username), null).then((fresh) => {
        if (fresh) setCurrentUser({ username: fresh.username, name: fresh.name, role: fresh.role, permissions: fresh.permissions || [] });
      });
    }
  };

  useEffect(() => { window.__eventNameCache = eventName; }, [eventName]);
  useEffect(() => { window.__eventLogoCache = eventLogo; }, [eventLogo]);

  const loadOrders = async () => {
    const keys = await listShared("order:");
    const results = await Promise.all(keys.map((k) => getShared(k, null)));
    return results.filter(Boolean).sort((a, b) => b.createdAt - a.createdAt);
  };
  const loadDeliveries = async () => {
    const keys = await listShared("delivery:");
    const results = await Promise.all(keys.map((k) => getShared(k, null)));
    const map = {};
    results.filter(Boolean).forEach((d) => { map[d.orderId] = d; });
    return map;
  };

  const refreshAll = useCallback(async () => {
    setSyncing(true);
    const [cat, ords, dels, dupKeys, evName, evLogo, rst, spn, subs] = await Promise.all([
      getShared("catalog", null),
      loadOrders(),
      loadDeliveries(),
      listShared("dupattempt:"),
      getShared("eventName", null),
      getShared("eventLogo", null),
      loadAllRestocks(),
      loadAllSpins(),
      loadAllSubscriptions(),
    ]);
    if (cat && cat.length && Date.now() > catalogDirtyUntil.current) {
      setCatalog(cat);
    } else if (!cat && !initialized.current) {
      initialized.current = true;
      await setShared("catalog", DEFAULT_CATALOG);
      setCatalog(DEFAULT_CATALOG);
    }
    setOrders(ords);
    setDeliveries(dels);
    setDupCount(dupKeys.length);
    setRestocks(rst);
    setSpins(spn);
    setSubscriptions(subs);
    if (evName && Date.now() > eventNameDirtyUntil.current) setEventName(evName);
    if (evLogo && Date.now() > eventLogoDirtyUntil.current) setEventLogo(evLogo);
    setLastSync(Date.now());
    setSyncing(false);
    setLoading(false);
  }, []);

  const handleRestockAdded = (restock) => setRestocks((prev) => [restock, ...prev]);
  const handleSpinConfirmed = (spin) => setSpins((prev) => ({ ...prev, [spin.sourceId]: spin }));
  const handleSubscriptionAdded = (sub) => setSubscriptions((prev) => [sub, ...prev]);

  const handleClearOrderData = async () => {
    await Promise.all([
      deleteAllWithPrefix("order:"),
      deleteAllWithPrefix("delivery:"),
      deleteAllWithPrefix("spin:"),
      deleteAllWithPrefix("dupattempt:"),
    ]);
    await deleteShared("orderCounter");
    // Verify against the server rather than just assuming — if anything is
    // somehow still there, this reflects the true state instead of a stale one.
    const [ords, dels, spn, dupKeys] = await Promise.all([
      loadOrders(), loadDeliveries(), loadAllSpins(), listShared("dupattempt:"),
    ]);
    setOrders(ords);
    setDeliveries(dels);
    setSpins(spn);
    setDupCount(dupKeys.length);
  };

  useEffect(() => {
    refreshAll();
    const iv = setInterval(refreshAll, 7000);
    return () => clearInterval(iv);
  }, [refreshAll]);

  const handleOrderCreated = (order) => setOrders((prev) => [order, ...prev]);
  const handlePaid = (updatedOrder) => setOrders((prev) => prev.map((o) => (o.id === updatedOrder.id ? updatedOrder : o)));
  const handleDelivered = (delivery) => setDeliveries((prev) => ({ ...prev, [delivery.orderId]: delivery }));
  const handleCatalogChange = (next) => {
    catalogDirtyUntil.current = Date.now() + 15000;
    setCatalog(next);
  };
  const handleEventNameChange = (name) => {
    eventNameDirtyUntil.current = Date.now() + 15000;
    setEventName(name);
    setShared("eventName", name);
  };
  const handleEventLogoChange = (dataUrl) => {
    eventLogoDirtyUntil.current = Date.now() + 15000;
    setEventLogo(dataUrl);
    setShared("eventLogo", dataUrl);
  };
  const handleDupAttempt = (orderId) => {
    setShared(`dupattempt:${genId("DUP")}`, { orderId, at: Date.now() });
    setDupCount((c) => c + 1);
  };

  if (usersExist === null) {
    return <Card style={{ textAlign: "center", color: "#8A8D86" }}>Loading…</Card>;
  }
  if (!currentUser) {
    return (
      <div style={{ fontFamily: "Inter", background: "#F5F6F4", padding: 16, borderRadius: 16 }}>
        <style>{FONT_IMPORT}</style>
        <AuthGate usersExist={usersExist} onLoggedIn={handleLoggedIn} onUsersReset={() => setUsersExist(false)} />
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "Inter", background: "#F5F6F4", padding: 16, borderRadius: 16 }}>
      <style>{`
        ${FONT_IMPORT}
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .ticket-perf { height: 1px; background: repeating-linear-gradient(90deg, #D6D9D3 0 6px, transparent 6px 12px); margin-top: 10px; }
        select, input, button { font-family: Inter; }
        @media (max-width: 760px) {
          .responsive-grid { grid-template-columns: 1fr !important; }
          .responsive-grid-4 { grid-template-columns: 1fr 1fr !important; }
        }
      `}</style>

      <Nav tab={tab} setTab={setTab} eventName={eventName} eventLogo={eventLogo} onEventNameChange={handleEventNameChange} onEventLogoChange={handleEventLogoChange} syncing={syncing} lastSync={lastSync} onRefresh={refreshAll} currentUser={currentUser} onLogout={handleLogout} />

      {loading ? (
        <Card style={{ textAlign: "center", color: "#8A8D86" }}>Loading shared data…</Card>
      ) : (
        <>
          {tab === "order" && canAccess(currentUser, "order") && <OrderEntryTab catalog={catalog} orders={orders} onOrderCreated={handleOrderCreated} currentUser={currentUser} />}
          {tab === "payment" && canAccess(currentUser, "payment") && <PaymentTab orders={orders} catalog={catalog} onPaid={handlePaid} currentUser={currentUser} />}
          {tab === "delivery" && canAccess(currentUser, "delivery") && <DeliveryTab orders={orders} deliveries={deliveries} catalog={catalog} onDelivered={handleDelivered} onDupAttempt={handleDupAttempt} currentUser={currentUser} />}
          {tab === "allorders" && canAccess(currentUser, "allorders") && <AllOrdersTab orders={orders} deliveries={deliveries} catalog={catalog} currentUser={currentUser} onClearOrderData={handleClearOrderData} />}
          {tab === "subscriptions" && canAccess(currentUser, "subscriptions") && <SubscriptionsTab subscriptions={subscriptions} onSubscriptionAdded={handleSubscriptionAdded} currentUser={currentUser} />}
          {tab === "spinwheel" && canAccess(currentUser, "spinwheel") && <SpinWheelTab orders={orders} subscriptions={subscriptions} spins={spins} onSpinConfirmed={handleSpinConfirmed} currentUser={currentUser} />}
          {tab === "export" && canAccess(currentUser, "export") && <ExportDataTab orders={orders} deliveries={deliveries} catalog={catalog} restocks={restocks} spins={spins} subscriptions={subscriptions} eventName={eventName} />}
          {tab === "products" && canAccess(currentUser, "products") && <ProductsTab catalog={catalog} orders={orders} restocks={restocks} onCatalogChange={handleCatalogChange} onRestockAdded={handleRestockAdded} currentUser={currentUser} />}
          {tab === "dashboard" && canAccess(currentUser, "dashboard") && <DashboardTab orders={orders} deliveries={deliveries} catalog={catalog} restocks={restocks} spins={spins} dupCount={dupCount} />}
          {tab === "users" && currentUser.role === "admin" && <UsersTab currentUser={currentUser} onUsersChanged={handleUsersChanged} onClearOrderData={handleClearOrderData} />}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

</script>
</body>
</html>
