// Parses pasted "Name<TAB>Price" lines (one product per line), tolerating the
// messiness of real copy-pasted lists: stray quotes, extra tabs/spaces,
// leading/trailing whitespace, and blank lines.
function parseBulkProductList(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const parsed = [];
  const failed = [];
  lines.forEach((line) => {
    const cleaned = line.replace(/^"+|"+$/g, "").trim();
    const parts = cleaned.split("\t").map((p) => p.trim()).filter((p) => p !== "");
    let name, priceStr;
    if (parts.length >= 2) {
      priceStr = parts[parts.length - 1];
      name = parts.slice(0, -1).join(" ").trim();
    } else {
      const match = cleaned.match(/^(.*\S)\s+([\d,]+(?:\.\d+)?)$/);
      if (match) { name = match[1].trim(); priceStr = match[2]; }
    }
    name = (name || "").replace(/^"+|"+$/g, "").replace(/\s+/g, " ").trim();
    const price = priceStr ? parseFloat(priceStr.replace(/,/g, "")) : NaN;
    if (name && !isNaN(price)) {
      parsed.push({ name, price });
    } else {
      failed.push(line);
    }
  });
  return { parsed, failed };
}

async function getShared(key, fallback) {
  try {
    const { data, error } = await sb.from("kv_store").select("value").eq("key", key).maybeSingle();
    if (error || !data) return fallback;
    return data.value;
  } catch (e) {
    return fallback;
  }
}
async function setShared(key, value) {
  let lastError = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const { error } = await sb.from("kv_store").upsert({ key, value, updated_at: new Date().toISOString() });
      if (error) throw error;
      return true;
    } catch (e) {
      lastError = e;
      console.error(`storage set failed (attempt ${attempt + 1}/3)`, key, e);
      if (attempt < 2) await new Promise((r) => setTimeout(r, 500 * (attempt + 1)));
    }
  }
  window.__lastStorageError = lastError && lastError.message ? lastError.message : String(lastError);
  return false;
}
async function listShared(prefix) {
  try {
    const { data, error } = await sb.from("kv_store").select("key").like("key", `${prefix}%`);
    if (error || !data) return [];
    return data.map((r) => r.key);
  } catch (e) {
    return [];
  }
}
async function deleteShared(key) {
  try {
    await sb.from("kv_store").delete().eq("key", key);
    return true;
  } catch (e) {
    return false;
  }
}

// Deletes every key under a prefix, re-listing after each pass and repeating
// until the list actually comes back empty. A single list()+delete() pass can
// leave keys behind if the storage API paginates results, which would make
// deleted data appear to "come back" on the next normal refresh — this loop
// guards against that.
async function deleteAllWithPrefix(prefix) {
  let totalDeleted = 0;
  for (let pass = 0; pass < 25; pass++) {
    const keys = await listShared(prefix);
    if (keys.length === 0) break;
    await Promise.all(keys.map((k) => deleteShared(k)));
    totalDeleted += keys.length;
  }
  return totalDeleted;
}

async function hashPassword(password, salt) {
  const input = `${salt}:${password}`;
  try {
    if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest) {
      const enc = new TextEncoder();
      const data = enc.encode(input);
      const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) {
    console.error("SubtleCrypto unavailable, using fallback hash", e);
  }
  // Fallback (used only if Web Crypto is blocked in this environment): a simple
  // deterministic non-cryptographic hash, so login still works everywhere.
  let h1 = 0xdeadbeef ^ input.length, h2 = 0x41c6ce57 ^ input.length;
  for (let i = 0; i < input.length; i++) {
    const ch = input.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return "fb" + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

async function allocateOrderNumber() {
  for (let attempt = 0; attempt < 10; attempt++) {
    const current = await getShared("orderCounter", { value: 0, owner: "" });
    const next = (current.value || 0) + 1;
    const claim = Math.random().toString(36).slice(2, 8);
    const candidate = { value: next, owner: `${CLIENT_TOKEN}:${claim}` };
    await setShared("orderCounter", candidate);
    await new Promise((r) => setTimeout(r, 180 + Math.random() * 220));
    const verify = await getShared("orderCounter", null);
    if (verify && verify.owner === candidate.owner) return next;
  }
  const fallback = await getShared("orderCounter", { value: 0 });
  return (fallback.value || 0) + 1;
}

// "bundle" and "spinwin" (Spin & Win) both consume component stock the same
// way — they're just labeled differently in the UI for staff clarity.
function isBundleLike(type) {
  return type === "bundle" || type === "spinwin";
}

function expandOrderItems(items, catalog) {
  const map = {};
  items.forEach((it) => {
    const prod = catalog.find((p) => p.name === it.name);
    if (prod && isBundleLike(prod.type) && prod.components) {
      prod.components.forEach((c) => {
        map[c.name] = (map[c.name] || 0) + c.qty * it.qty;
      });
    } else {
      map[it.name] = (map[it.name] || 0) + it.qty;
    }
  });
  return Object.entries(map).map(([name, qty]) => ({ name, qty }));
}

function computeTotal(items, catalog) {
  return items.reduce((sum, it) => {
    const prod = catalog.find((p) => p.name === it.name);
    return sum + (prod ? prod.price * it.qty : 0);
  }, 0);
}

function computeStock(catalog, orders, restocks = []) {
  const individuals = catalog.filter((p) => p.type === "individual");
  return individuals.map((prod) => {
    let direct = 0;
    let bundleUsed = 0;
    orders.forEach((o) => {
      o.items.forEach((it) => {
        if (it.name === prod.name) direct += it.qty;
        const bundleProd = catalog.find((p) => p.name === it.name);
        if (bundleProd && isBundleLike(bundleProd.type) && bundleProd.components) {
          bundleProd.components.forEach((c) => {
            if (c.name === prod.name) bundleUsed += c.qty * it.qty;
          });
        }
      });
    });
    const restockedQty = restocks.filter((r) => r.productName === prod.name).reduce((s, r) => s + r.qty, 0);
    const startingStock = prod.stock || 0;
    const totalStock = startingStock + restockedQty;
    const consumed = direct + bundleUsed;
    const remaining = totalStock - consumed;
    let status = "OK";
    if (remaining <= 0) status = "OUT OF STOCK";
    else if (totalStock > 0 && remaining <= totalStock * 0.1) status = "LOW STOCK";
    return { name: prod.name, stock: startingStock, restocked: restockedQty, totalStock, direct, bundleUsed, consumed, remaining, status };
  });
}

function fmtMoney(n) {

function fmtTime(ts) {

  const d = new Date(ts);

function resizeImageFile(file, maxHeight = 120) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxHeight / img.height);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = () => reject(new Error("Couldn't read that image file."));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

}

function imageDimsFromDataUrl(dataUrl) {

async function downloadReceiptPDF(order, catalog, eventName, delivery, eventLogo) {

    y += logoH + 4;

    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(23, 32, 51);
    doc.text(eventName || "Your Event", PAGE_W / 2, y, { align: "center", maxWidth: CONTENT_W });
    y += 3.5;
    doc.setFont("helvetica", "normal"); doc.setFontSize(5.5); doc.setTextColor(138, 141, 134);
    doc.text("SALES RECEIPT", PAGE_W / 2, y, { align: "center" });
    y += 3.5;
    doc.setDrawColor(214, 217, 211);
    doc.line(MARGIN, y, PAGE_W - MARGIN, y);
    y += 4;

    doc.setFontSize(5.5); doc.setTextColor(138, 141, 134); doc.setFont("helvetica", "bold");
    doc.text("ORDER ID", MARGIN, y);
    doc.setFontSize(8); doc.setTextColor(23, 32, 51);
    doc.text(order.id, PAGE_W - MARGIN, y, { align: "right" });
    y += 5;

    const infoRow = (label, value) => {
      doc.setFont("helvetica", "normal"); doc.setFontSize(6); doc.setTextColor(91, 94, 86);
      doc.text(label, MARGIN, y);
      doc.setTextColor(23, 32, 51);
      doc.text(String(value || ""), PAGE_W - MARGIN, y, { align: "right" });
      y += 4;
    };
    infoRow("Date", order.date);
    infoRow("Customer", order.customer);
    infoRow("User ID", order.userId);
    if (order.university) infoRow("University", order.university);
    infoRow("Payment", order.paymentStatus === "Paid" ? order.payment : "Not paid yet");
    y += 1.5;

    doc.setFont("helvetica", "bold"); doc.setFontSize(5.5); doc.setTextColor(138, 141, 134);
    doc.text("ITEM", MARGIN, y);
    doc.text("QTY", PAGE_W / 2 + 4, y, { align: "center" });
    doc.text("PRICE", PAGE_W - MARGIN, y, { align: "right" });
    y += 3.5;
    doc.setFont("helvetica", "normal"); doc.setFontSize(6); doc.setTextColor(23, 32, 51);
    order.items.forEach((it) => {
      const prod = catalog.find((p) => p.name === it.name);
      const lineTotal = (prod ? prod.price : 0) * it.qty;
      const name = it.name.length > 16 ? it.name.slice(0, 15) + "…" : it.name;
      doc.text(name, MARGIN, y);
      doc.text(String(it.qty), PAGE_W / 2 + 4, y, { align: "center" });
      doc.text(fmtMoney(lineTotal), PAGE_W - MARGIN, y, { align: "right" });
      y += 4;
    });

    if (order.discountPercent > 0) {
      doc.setFontSize(6); doc.setTextColor(91, 94, 86);
      doc.text("Subtotal", MARGIN, y);
      doc.text(fmtMoney(order.subtotal), PAGE_W - MARGIN, y, { align: "right" });
      y += 4;
      doc.setTextColor(161, 92, 0);
      doc.text(`Discount (${order.discountPercent}%)`, MARGIN, y);
      doc.text(`-${fmtMoney(order.discountAmount)}`, PAGE_W - MARGIN, y, { align: "right" });
      y += 4;
    }

    doc.setDrawColor(23, 32, 51);
    doc.line(MARGIN, y, PAGE_W - MARGIN, y);
    y += 4;
    doc.setFont("helvetica", "bold"); doc.setFontSize(6.5); doc.setTextColor(23, 32, 51);
    doc.text("TOTAL", MARGIN, y);
    doc.setFontSize(9.5);
    doc.text(fmtMoney(order.total), PAGE_W - MARGIN, y, { align: "right" });
    y += 6;

    const wrappedText = (text, size, color) => {
      doc.setFont("helvetica", "normal"); doc.setFontSize(size); doc.setTextColor(...color);
      const lines = doc.splitTextToSize(text, CONTENT_W);
      doc.text(lines, MARGIN, y);
      y += lines.length * (size * 0.42) + 1.5;
    };

    if (order.paymentStatus === "Paid") {
      wrappedText(`Paid (${order.payment}) — confirmed by ${order.paidBy} at ${fmtTime(order.paidAt)}`, 5.5, [31, 122, 77]);
    }
    if (delivery) {
      wrappedText(`Delivered by ${delivery.deliveredBy} — ${fmtTime(delivery.deliveredAt)}`, 5.5, [31, 122, 77]);
    }

    y += 2;
    doc.setFont("helvetica", "italic"); doc.setFontSize(5.5); doc.setTextColor(138, 141, 134);
    const footerLines = doc.splitTextToSize("Keep this receipt. Show the Order ID above at the delivery station.", CONTENT_W);
    doc.text(footerLines, PAGE_W / 2, y, { align: "center" });

    doc.save(`Receipt_${order.id}.pdf`);
  } catch (e) {
    console.error("PDF generation failed, falling back to HTML download", e);
    const html = buildReceiptHTMLDocument(order, catalog, eventName, delivery, eventLogo);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Receipt_${order.id}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    console.warn("Downloaded an HTML receipt instead of a PDF — open it and use your browser's Print > Save as PDF if you need a PDF file.");
  }
}

function downloadReceiptExcel(order, catalog, eventName, delivery) {
  const wb = XLSX.utils.book_new();

  const headerRows = [
    ["Event", eventName || "Your Event"],
    ["Order ID", order.id],
    ["Date", order.date],
    ["Customer", order.customer],
    ["User ID", order.userId],
    ["User Type", order.userType],
    ...(order.university ? [["University", order.university]] : []),
    ["Payment Status", order.paymentStatus],
    ["Payment Method", order.paymentStatus === "Paid" ? order.payment : ""],
    ["Paid By", order.paidBy || ""],
    ["Paid At", order.paidAt ? new Date(order.paidAt).toLocaleString() : ""],
    ["Delivery Status", delivery ? "Delivered" : "Pending"],
    ["Delivered By", delivery ? delivery.deliveredBy : ""],
    ["Delivered At", delivery ? new Date(delivery.deliveredAt).toLocaleString() : ""],
    [],
    ["Item", "Qty", "Unit Price", "Line Total"],
  ];

  order.items.forEach((it) => {
    const prod = catalog.find((p) => p.name === it.name);
    const unitPrice = prod ? prod.price : 0;
    headerRows.push([it.name, it.qty, unitPrice, unitPrice * it.qty]);
  });

  headerRows.push([]);
  if (order.discountPercent > 0) {
    headerRows.push(["Subtotal", "", "", order.subtotal]);
    headerRows.push([`Discount (${order.discountPercent}%)`, "", "", -order.discountAmount]);
  }
  headerRows.push(["TOTAL", "", "", order.total]);

  const ws = XLSX.utils.aoa_to_sheet(headerRows);
  ws["!cols"] = [{ wch: 32 }, { wch: 10 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws, "Receipt");
  XLSX.writeFile(wb, `Receipt_${order.id}.xlsx`);
}

function OrderEntryTab({ catalog, orders, onOrderCreated, currentUser }) {
  const today = new Date().toISOString().slice(0, 10);

  const [submitting, setSubmitting] = useState(false);
  const [createdOrder, setCreatedOrder] = useState(null);
  const [error, setError] = useState("");
  const [violations, setViolations] = useState(null);
  const [passcodeInput, setPasscodeInput] = useState("");
  const [passcodeError, setPasscodeError] = useState("");
  const [checkingPasscode, setCheckingPasscode] = useState(false);

  const subtotal = useMemo(() => computeTotal(items.filter((it) => it.name), catalog), [items, catalog]);
  const discountPct = Math.min(100, Math.max(0, parseFloat(discountPercent) || 0));
  const discountAmount = subtotal * (discountPct / 100);
  const total = subtotal - discountAmount;

  const updateItem = (idx, field, value) => {
    setItems((prev) => prev.map((it, i) => (i === idx ? { ...it, [field]: value } : it)));
  };
  const addItem = () => setItems((prev) => [...prev, { name: "", qty: 1 }]);
  const removeItem = (idx) => setItems((prev) => prev.filter((_, i) => i !== idx));

  // Event-wide per-customer limit check: how much of each product has this
  // User ID already ordered across every previous order, plus what's in the
  // cart right now — regardless of payment status, since the limit is about
  // ordering, not paying.
  const getViolations = (valid) => {
    const cartTotals = {};
    valid.forEach((it) => { cartTotals[it.name] = (cartTotals[it.name] || 0) + it.qty; });
    const uid = userId.trim().toLowerCase();
    const viol = [];
    Object.entries(cartTotals).forEach(([prodName, addingQty]) => {
      const prod = catalog.find((p) => p.name === prodName);
      if (!prod || prod.maxPerCustomer == null) return;
      const already = orders
        .filter((o) => (o.userId || "").trim().toLowerCase() === uid)
        .reduce((sum, o) => sum + o.items.filter((it) => it.name === prodName).reduce((s, it) => s + it.qty, 0), 0);
      if (already + addingQty > prod.maxPerCustomer) {
        viol.push({ product: prodName, already, adding: addingQty, limit: prod.maxPerCustomer });
      }
    });
    return viol;
  };

  const createOrder = async (valid) => {
    setSubmitting(true);
    const seq = await allocateOrderNumber();
    const finalSubtotal = computeTotal(valid, catalog);
    const finalDiscountPct = Math.min(100, Math.max(0, parseFloat(discountPercent) || 0));
    const finalDiscountAmount = finalSubtotal * (finalDiscountPct / 100);
    const order = {
      id: formatOrderId(seq),
      seq,
      createdAt: Date.now(),
      date: date || today,
      userId: userId.trim(),
      userType,
      attendeeStatus,
      university: userType === "Student" ? university.trim() : "",
      customer: customer.trim() || "Walk-in Guest",
      items: valid,
      subtotal: finalSubtotal,
      discountPercent: finalDiscountPct,
      discountAmount: finalDiscountAmount,
      total: finalSubtotal - finalDiscountAmount,
      paymentStatus: "Unpaid",
      payment: null,
      paidAt: null,
      paidBy: null,
      createdBy: currentUser.name,
    };
    const ok = await setShared(`order:${order.id}`, order);
    setSubmitting(false);
    if (!ok) { setError("Could not save the order — check your connection and try again."); return; }
    setCreatedOrder(order);
    onOrderCreated(order);
    setCustomer("");
    setUniversity("");
    setAttendeeStatus("");
    setItems([{ name: "", qty: 1 }]);
    setDiscountPercent("");
    setViolations(null);
    setPasscodeInput("");
    setPasscodeError("");
  };

  const handleSubmit = async () => {
    setError("");
    const valid = items.filter((it) => it.name && it.qty > 0);
    if (valid.length === 0) { setError("Add at least one item."); return; }
    if (!userId.trim()) { setError("Enter a User ID."); return; }
    if (!attendeeStatus) { setError("Select whether the user is New or Old."); return; }
    if (userType === "Student" && !university.trim()) { setError("Enter the university name for a student."); return; }

    const viol = getViolations(valid);
    if (viol.length > 0) { setViolations(viol); return; }
    await createOrder(valid);
  };

  const handlePasscodeOverride = async () => {
    setPasscodeError("");
    if (!passcodeInput.trim()) { setPasscodeError("Enter the passcode."); return; }
    setCheckingPasscode(true);
    const stored = await getShared("limitOverridePasscode", "");
    setCheckingPasscode(false);
    if (!stored || passcodeInput !== stored) { setPasscodeError("Incorrect passcode."); return; }
    const valid = items.filter((it) => it.name && it.qty > 0);
    await createOrder(valid);
  };

  const catalogOptions = catalog.filter((p) => p.name);

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 16 }} className="responsive-grid">
      <Card>
        <SectionTitle icon={ShoppingBag}>New order</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
          <div><label style={labelStyle}>Date</label><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} /></div>
          <div><label style={labelStyle}>User ID</label><input value={userId} onChange={(e) => setUserId(e.target.value)} placeholder="U-101" style={inputStyle} /></div>
          <div><label style={labelStyle}>User type</label>
            <select value={userType} onChange={(e) => setUserType(e.target.value)} style={inputStyle}>
              <option>Doctor</option><option>Student</option><option>Other</option>
            </select>
          </div>
          <div><label style={labelStyle}>New or old user</label>
            <select value={attendeeStatus} onChange={(e) => setAttendeeStatus(e.target.value)} style={inputStyle}>
              <option value="">Select…</option>
              <option>New</option><option>Old</option>
            </select>
          </div>
          {userType === "Student" && (
            <div><label style={labelStyle}>University name</label>
              <input value={university} onChange={(e) => setUniversity(e.target.value)} placeholder="Cairo University" style={inputStyle} />
            </div>
          )}
          <div style={{ gridColumn: userType === "Student" ? "auto" : "1 / -1" }}><label style={labelStyle}>Customer / reference name</label>
            <input value={customer} onChange={(e) => setCustomer(e.target.value)} placeholder="Walk-in Guest" style={inputStyle} />
          </div>
        </div>

        <label style={labelStyle}>Items</label>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {items.map((it, idx) => (
            <div key={idx} style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <select value={it.name} onChange={(e) => updateItem(idx, "name", e.target.value)} style={{ ...inputStyle, flex: 1 }}>
                <option value="">Select a product…</option>
                <optgroup label="Individual items">
                  {catalogOptions.filter((p) => p.type === "individual").map((p) => (
                    <option key={p.id} value={p.name}>{p.name} — {fmtMoney(p.price)}</option>
                  ))}
                </optgroup>
                <optgroup label="Bundles">
                  {catalogOptions.filter((p) => p.type === "bundle").map((p) => (
                    <option key={p.id} value={p.name}>{p.name} — {fmtMoney(p.price)}</option>
                  ))}
                </optgroup>
                <optgroup label="Spin & Win">
                  {catalogOptions.filter((p) => p.type === "spinwin").map((p) => (
                    <option key={p.id} value={p.name}>{p.name} — {fmtMoney(p.price)}</option>
                  ))}
                </optgroup>
              </select>
              <input type="number" min="1" value={it.qty} onChange={(e) => updateItem(idx, "qty", parseInt(e.target.value) || 1)} style={{ ...inputStyle, width: 70 }} />
              <button onClick={() => removeItem(idx)} disabled={items.length === 1} style={{ ...btnSecondary, padding: "8px 9px", opacity: items.length === 1 ? 0.4 : 1 }}>
                <Trash2 size={14} />
              </button>
            </div>
          ))}
        </div>
        <button onClick={addItem} style={{ ...btnSecondary, marginTop: 8, display: "flex", alignItems: "center", gap: 6 }}>
          <Plus size={14} /> Add item
        </button>

        <div style={{ marginTop: 14 }}>
          <label style={labelStyle}>Discount %  (leave blank for no discount)</label>
          <input type="number" min="0" max="100" value={discountPercent} onChange={(e) => setDiscountPercent(e.target.value)} placeholder="0" style={{ ...inputStyle, width: 120 }} />
        </div>

        <div style={{ borderTop: "1px solid #E1E4E2", marginTop: 16, paddingTop: 14 }}>
          {discountPct > 0 && (
            <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}><span>Subtotal</span><span>{fmtMoney(subtotal)}</span></div>
              <div style={{ display: "flex", justifyContent: "space-between", color: "#A15C00" }}><span>Discount ({discountPct}%)</span><span>-{fmtMoney(discountAmount)}</span></div>
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 11, color: "#8A8D86", fontWeight: 600 }}>TOTAL</div>
              <div style={{ fontFamily: "Manrope", fontWeight: 800, fontSize: 22, color: "#172033" }}>{fmtMoney(total)}</div>
            </div>
            <button onClick={handleSubmit} disabled={submitting} style={{ ...btnPrimary, opacity: submitting ? 0.6 : 1 }}>
              {submitting ? "Saving…" : "Create order"}
            </button>
          </div>
        </div>
        {error && <div style={{ color: "#B4231D", fontSize: 13, marginTop: 8, fontFamily: "Inter" }}>{error}</div>}
        {violations && (
          <div style={{ marginTop: 12, background: "#FBE7E5", border: "1px solid #F3B7B2", borderRadius: 10, padding: "12px 14px" }}>
            <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
              <AlertTriangle size={16} color="#B4231D" style={{ flexShrink: 0, marginTop: 1 }} />
              <div style={{ fontFamily: "Inter", fontSize: 13, color: "#7C1712" }}>
                <strong>This exceeds the event purchase limit for this customer:</strong>
                <ul style={{ margin: "6px 0 0", paddingLeft: 18 }}>
                  {violations.map((v, i) => (
                    <li key={i}>{v.product}: already ordered {v.already}, adding {v.adding} more would total {v.already + v.adding}, but the limit is {v.limit} per customer.</li>
                  ))}
                </ul>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
              <input type="password" value={passcodeInput} onChange={(e) => setPasscodeInput(e.target.value)} placeholder="Override passcode" style={{ ...inputStyle, width: 160 }} />
              <button onClick={handlePasscodeOverride} disabled={checkingPasscode} style={{ ...btnPrimary, background: "#B4231D", opacity: checkingPasscode ? 0.6 : 1 }}>
                {checkingPasscode ? "Checking…" : "Override & continue"}
              </button>
              <button onClick={() => { setViolations(null); setPasscodeInput(""); setPasscodeError(""); }} style={btnSecondary}>Cancel</button>
            </div>
            {passcodeError && <div style={{ color: "#B4231D", fontSize: 12.5, marginTop: 6, fontFamily: "Inter" }}>{passcodeError}</div>}
          </div>
        )}
      </Card>

      <div>
        {createdOrder ? (
          <Card style={{ textAlign: "center" }}>
            <CheckCircle2 size={28} color="#1F7A4D" style={{ marginBottom: 8 }} />
            <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56" }}>Order created</div>
            <div style={{ fontFamily: "JetBrains Mono", fontWeight: 700, fontSize: 24, color: "#172033", margin: "6px 0" }}>{createdOrder.id}</div>
            <div style={{ fontFamily: "Manrope", fontWeight: 700, fontSize: 16, color: "#172033" }}>{fmtMoney(createdOrder.total)}</div>
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#8A8D86", marginTop: 10 }}>
              Send the customer to the <strong>Payment</strong> tab with this Order ID to pay and get their receipt.
            </div>
          </Card>
        ) : (
          <Card style={{ textAlign: "center", color: "#8A8D86", fontFamily: "Inter", fontSize: 13 }}>
            Create an order to see the confirmation here.
          </Card>
        )}
      </div>
    </div>
  );
}

function PaymentTab({ orders, catalog, onPaid, currentUser }) {
  const [selected, setSelected] = useState(null);
  const [payment, setPayment] = useState("Card");
  const [confirming, setConfirming] = useState(false);
  const [justPaid, setJustPaid] = useState(null);
  const [downloading, setDownloading] = useState(false);

  const handleDownload = async (order) => {
    setDownloading(true);
    await downloadReceiptPDF(order, catalog, window.__eventNameCache, null, window.__eventLogoCache);
    setDownloading(false);
  };
  const handleDownloadExcel = (order) => downloadReceiptExcel(order, catalog, window.__eventNameCache, null);

  const unpaid = useMemo(
    () => orders.filter((o) => o.paymentStatus !== "Paid").sort((a, b) => a.seq - b.seq),
    [orders]
  );

  const handleConfirm = async () => {
    if (!selected) return;
    setConfirming(true);
    const updated = { ...selected, paymentStatus: "Paid", payment, paidAt: Date.now(), paidBy: currentUser.name };
    const ok = await setShared(`order:${updated.id}`, updated);
    setConfirming(false);
    if (ok) {
      onPaid(updated);
      setJustPaid(updated);
      setSelected(null);
    }
  };

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }} className="responsive-grid">
      <Card>
        <SectionTitle icon={CreditCard}>Orders awaiting payment ({unpaid.length})</SectionTitle>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 520, overflowY: "auto" }}>
          {unpaid.length === 0 && <div style={{ color: "#8A8D86", fontSize: 13, fontFamily: "Inter" }}>Nothing waiting on payment.</div>}
          {unpaid.map((o) => (
            <button key={o.id} onClick={() => { setSelected(o); setJustPaid(null); }} style={{
              textAlign: "left", background: selected && selected.id === o.id ? "#FBEAC8" : "#FAFAF8",
              border: selected && selected.id === o.id ? "1px solid #EFB93A" : "1px solid #EEF0EE",
              borderRadius: 8, padding: "9px 12px", cursor: "pointer", fontFamily: "Inter",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontFamily: "JetBrains Mono", fontWeight: 700, fontSize: 12.5, color: "#172033" }}>{o.id}</span>
                <span style={{ fontSize: 12.5, color: "#8A8D86" }}>{fmtTime(o.createdAt)}</span>
              </div>
              <div style={{ fontSize: 12.5, color: "#5B5E56", marginTop: 2 }}>{o.customer} — {fmtMoney(o.total)}</div>
            </button>
          ))}
        </div>
      </Card>

      <Card>
        <SectionTitle icon={CheckCircle2}>Confirm payment</SectionTitle>
        {!selected && !justPaid && <div style={{ color: "#8A8D86", fontSize: 13, fontFamily: "Inter" }}>Select an order on the left.</div>}
        {selected && (
          <div>
            <ReceiptCard order={selected} catalog={catalog} eventName={window.__eventNameCache} eventLogo={window.__eventLogoCache} />
            <div style={{ display: "flex", gap: 8, marginTop: 14, alignItems: "center" }}>
              <select value={payment} onChange={(e) => setPayment(e.target.value)} style={inputStyle}>
                <option>Cash</option><option>Card</option><option>InstaPay</option>
              </select>
              <div style={{ fontSize: 12.5, color: "#8A8D86", fontFamily: "Inter", whiteSpace: "nowrap" }}>Received by <strong style={{ color: "#172033" }}>{currentUser.name}</strong></div>
            </div>
            <button onClick={handleConfirm} disabled={confirming} style={{ ...btnPrimary, width: "100%", marginTop: 10, opacity: confirming ? 0.5 : 1 }}>
              {confirming ? "Saving…" : "Confirm payment"}
            </button>
          </div>
        )}
        {justPaid && (
          <div>
            <div style={{ background: "#E4F5EC", border: "1px solid #B9E3CB", borderRadius: 10, padding: "10px 14px", marginBottom: 12, display: "flex", gap: 10 }}>
              <CheckCircle2 size={18} color="#1F7A4D" style={{ flexShrink: 0 }} />
              <div style={{ fontFamily: "Inter", fontSize: 13, color: "#175C3B", fontWeight: 600 }}>Payment confirmed.</div>
            </div>
            <ReceiptCard order={justPaid} catalog={catalog} eventName={window.__eventNameCache} eventLogo={window.__eventLogoCache} />
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <button onClick={() => handleDownload(justPaid)} disabled={downloading} style={{ ...btnPrimary, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, opacity: downloading ? 0.6 : 1 }}>
                <Download size={14} /> {downloading ? "Generating…" : "PDF"}
              </button>
              <button onClick={() => handleDownloadExcel(justPaid)} style={{ ...btnSecondary, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                <FileSpreadsheet size={14} /> Excel
              </button>
            </div>
          </div>
        )}
      </Card>
    </div>
  );
}

function DeliveryTab({ orders, deliveries, catalog, onDelivered, onDupAttempt, currentUser }) {
  const [searchId, setSearchId] = useState("");
  const [found, setFound] = useState(null);
  const [notFound, setNotFound] = useState(false);
  const [notPaid, setNotPaid] = useState(false);
  const [marking, setMarking] = useState(false);
  const [justDelivered, setJustDelivered] = useState(false);
  const alreadyDelivered = found ? deliveries[found.id] : null;

  const doSearch = (id) => {
    const targetId = (id || searchId).trim();
    if (!targetId) return;
    setJustDelivered(false);
    setNotPaid(false);
    const order = orders.find((o) => o.id.toLowerCase() === targetId.toLowerCase());
    if (!order) { setFound(null); setNotFound(true); return; }
    setNotFound(false);
    if (order.paymentStatus !== "Paid") { setFound(null); setNotPaid(true); setSearchId(order.id); return; }
    setFound(order);
    setSearchId(order.id);
    if (deliveries[order.id]) onDupAttempt(order.id);
  };

  const handleMark = async () => {
    setMarking(true);
    const delivery = { orderId: found.id, deliveredBy: currentUser.name, deliveredAt: Date.now() };
    const ok = await setShared(`delivery:${found.id}`, delivery);
    setMarking(false);
    if (ok) { onDelivered(delivery); setJustDelivered(true); }
  };

  const pending = useMemo(
    () => orders.filter((o) => o.paymentStatus === "Paid" && !deliveries[o.id]).sort((a, b) => b.createdAt - a.createdAt).slice(0, 15),
    [orders, deliveries]
  );

  const expandedItems = found ? expandOrderItems(found.items, catalog) : [];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 16 }} className="responsive-grid">
      <Card>
        <SectionTitle icon={PackageCheck}>Deliver an order</SectionTitle>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={searchId} onChange={(e) => setSearchId(e.target.value)} onKeyDown={(e) => e.key === "Enter" && doSearch()} placeholder="Type the Order ID from the receipt" style={inputStyle} />
          <button onClick={() => doSearch()} style={{ ...btnPrimary, display: "flex", alignItems: "center", gap: 6 }}><Search size={14} /> Find</button>
        </div>

        {notFound && <div style={{ marginTop: 14, color: "#B4231D", fontFamily: "Inter", fontSize: 13 }}>No order found with that ID. Double-check the receipt.</div>}
        {notPaid && (
          <div style={{ marginTop: 14, background: "#FCEEDA", border: "1px solid #F3D9A6", borderRadius: 10, padding: "12px 14px", display: "flex", gap: 10 }}>
            <AlertTriangle size={18} color="#A15C00" style={{ flexShrink: 0 }} />
            <div style={{ fontFamily: "Inter", fontSize: 13, color: "#6B4200" }}>
              <strong>{searchId}</strong> hasn't been paid yet. Send the customer to the <strong>Payment</strong> tab first.
            </div>
          </div>
        )}

        {found && (
          <div style={{ marginTop: 16 }}>
            {alreadyDelivered && !justDelivered && (
              <div style={{ background: "#FBE7E5", border: "1px solid #F3B7B2", borderRadius: 10, padding: "12px 14px", marginBottom: 14, display: "flex", gap: 10 }}>
                <AlertTriangle size={18} color="#B4231D" style={{ flexShrink: 0 }} />
                <div style={{ fontFamily: "Inter", fontSize: 13, color: "#7C1712" }}>
                  <strong>Already delivered.</strong> By {alreadyDelivered.deliveredBy} on {fmtTime(alreadyDelivered.deliveredAt)}. Do not hand out product again — flag this to the event lead.
                </div>
              </div>
            )}
            {justDelivered && (
              <div style={{ background: "#E4F5EC", border: "1px solid #B9E3CB", borderRadius: 10, padding: "12px 14px", marginBottom: 14, display: "flex", gap: 10 }}>
                <CheckCircle2 size={18} color="#1F7A4D" style={{ flexShrink: 0 }} />
                <div style={{ fontFamily: "Inter", fontSize: 13, color: "#175C3B", fontWeight: 600 }}>Marked as delivered.</div>
              </div>
            )}

            <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0" }}><span>Customer</span><strong style={{ color: "#172033" }}>{found.customer}</strong></div>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0" }}><span>Payment</span><strong style={{ color: "#172033" }}>{found.payment}</strong></div>
              <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0" }}><span>Total</span><strong style={{ color: "#172033" }}>{fmtMoney(found.total)}</strong></div>
            </div>

            <label style={labelStyle}>Items to hand over (products, bundles expanded)</label>
            <div style={{ border: "1px solid #E1E4E2", borderRadius: 8, overflow: "hidden", marginBottom: 14 }}>
              {expandedItems.map((it, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 12px", fontSize: 13.5, fontFamily: "Inter", borderTop: i ? "1px solid #EEF0EE" : "none" }}>
                  <span style={{ color: "#172033" }}>{it.name}</span>
                  <span style={{ fontWeight: 700, color: "#172033" }}>x{it.qty}</span>
                </div>
              ))}
            </div>

            {!alreadyDelivered && !justDelivered && (
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <div style={{ fontSize: 12.5, color: "#8A8D86", fontFamily: "Inter", flex: 1 }}>Delivering as <strong style={{ color: "#172033" }}>{currentUser.name}</strong></div>
                <button onClick={handleMark} disabled={marking} style={{ ...btnPrimary, opacity: marking ? 0.5 : 1, whiteSpace: "nowrap" }}>
                  {marking ? "Saving…" : "Mark delivered"}
                </button>
              </div>
            )}
          </div>
        )}
      </Card>

      <Card>
        <SectionTitle icon={ClipboardList}>Paid, awaiting delivery ({pending.length})</SectionTitle>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 480, overflowY: "auto" }}>
          {pending.length === 0 && <div style={{ color: "#8A8D86", fontSize: 13, fontFamily: "Inter" }}>Nothing pending — all caught up.</div>}
          {pending.map((o) => (
            <button key={o.id} onClick={() => doSearch(o.id)} style={{
              textAlign: "left", background: "#FAFAF8", border: "1px solid #EEF0EE", borderRadius: 8,
              padding: "9px 12px", cursor: "pointer", fontFamily: "Inter",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span style={{ fontFamily: "JetBrains Mono", fontWeight: 700, fontSize: 12.5, color: "#172033" }}>{o.id}</span>
                <span style={{ fontSize: 12.5, color: "#8A8D86" }}>{fmtTime(o.createdAt)}</span>
              </div>
              <div style={{ fontSize: 12.5, color: "#5B5E56", marginTop: 2 }}>{o.customer} — {fmtMoney(o.total)}</div>
            </button>
          ))}
        </div>
      </Card>
    </div>
  );
}

function AllOrdersTab({ orders, deliveries, catalog, currentUser, onClearOrderData }) {
  const [filter, setFilter] = useState("");
  const [viewing, setViewing] = useState(null);
  const [downloading, setDownloading] = useState(false);
  const [showClearConfirm, setShowClearConfirm] = useState(false);
  const [clearConfirmText, setClearConfirmText] = useState("");
  const [clearing, setClearing] = useState(false);

  const handleDownload = async (order) => {
    setDownloading(true);
    await downloadReceiptPDF(order, catalog, window.__eventNameCache, deliveries[order.id], window.__eventLogoCache);
    setDownloading(false);
  };
  const handleDownloadExcel = (order) => downloadReceiptExcel(order, catalog, window.__eventNameCache, deliveries[order.id]);

  const handleClearAll = async () => {
    setClearing(true);
    await onClearOrderData();
    setClearing(false);
    setShowClearConfirm(false);
    setClearConfirmText("");
    setViewing(null);
  };

  const rows = useMemo(() => {
    const f = filter.trim().toLowerCase();
    return orders
      .filter((o) => !f || o.id.toLowerCase().includes(f) || o.customer.toLowerCase().includes(f) || o.userId.toLowerCase().includes(f))
      .sort((a, b) => b.seq - a.seq);
  }, [orders, filter]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {currentUser.role === "admin" && (
        <Card style={{ border: "1px solid #F3B7B2" }}>
          {showClearConfirm ? (
            <div>
              <SectionTitle icon={AlertTriangle}>Remove all orders?</SectionTitle>
              <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", lineHeight: 1.7, marginBottom: 12 }}>
                This permanently deletes <strong>every order</strong> — including their payment status, deliveries, and Spin the Wheel records — and restarts order numbering at ORD-00001.
                <br />
                <strong style={{ color: "#1F7A4D" }}>Products, stock, your saved starter product list, and user accounts are not affected.</strong> This can't be undone.
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <input value={clearConfirmText} onChange={(e) => setClearConfirmText(e.target.value)} placeholder="Type RESET to confirm" style={{ ...inputStyle, width: 200 }} />
                <button onClick={handleClearAll} disabled={clearConfirmText !== "RESET" || clearing}
                  style={{ ...btnPrimary, background: "#B4231D", opacity: clearConfirmText !== "RESET" || clearing ? 0.4 : 1 }}>
                  {clearing ? "Clearing…" : "Remove all orders"}
                </button>
                <button onClick={() => { setShowClearConfirm(false); setClearConfirmText(""); }} style={btnSecondary}>Cancel</button>
              </div>
            </div>
          ) : (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>

function SubscriptionsTab({ subscriptions, onSubscriptionAdded, currentUser }) {
  const [name, setName] = useState("");
  const [userId, setUserId] = useState("");
  const [userType, setUserType] = useState("Doctor");
  const [attendeeStatus, setAttendeeStatus] = useState("");
  const [phone, setPhone] = useState("");
  const [university, setUniversity] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [justAdded, setJustAdded] = useState(null);
  const [filter, setFilter] = useState("");

  const handleSubmit = async () => {
    setError("");
    if (!name.trim()) { setError("Enter a name."); return; }
    if (!userId.trim()) { setError("Enter a User ID."); return; }
    if (!attendeeStatus) { setError("Select whether the user is New or Old."); return; }
    if (!phone.trim()) { setError("Enter a phone number."); return; }
    if (userType === "Student" && !university.trim()) { setError("Enter the university name for a student."); return; }
    setSubmitting(true);
    const sub = {
      id: genId("SUB"),
      name: name.trim(),
      userId: userId.trim(),
      userType,
      attendeeStatus,
      phone: phone.trim(),
      university: userType === "Student" ? university.trim() : "",
      subscribedAt: Date.now(),
      subscribedBy: currentUser.name,
    };
    const ok = await setShared(`subscription:${sub.id}`, sub);
    setSubmitting(false);
    if (!ok) {
      setError(`Couldn't save${window.__lastStorageError ? ` — ${window.__lastStorageError}` : ""}. Check your connection and try again.`);
      return;
    }
    onSubscriptionAdded(sub);
    setJustAdded(sub);
    setName(""); setUserId(""); setAttendeeStatus(""); setPhone(""); setUniversity("");
  };

  const filtered = useMemo(() => {
    const f = filter.trim().toLowerCase();
    return subscriptions.filter((s) => !f
      || s.name.toLowerCase().includes(f)
      || s.userId.toLowerCase().includes(f)
      || (s.phone || "").toLowerCase().includes(f));

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1.1fr 1fr", gap: 16 }} className="responsive-grid">
      <Card>
        <SectionTitle icon={UserPlus}>New subscriber</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", marginBottom: 12 }}>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <div><label style={labelStyle}>Name</label><input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} /></div>
          <div><label style={labelStyle}>User ID</label><input value={userId} onChange={(e) => setUserId(e.target.value)} placeholder="U-101" style={inputStyle} /></div>
          <div><label style={labelStyle}>User type</label>
            <select value={userType} onChange={(e) => setUserType(e.target.value)} style={inputStyle}>

          </div>
          <div><label style={labelStyle}>New or old user</label>
            <select value={attendeeStatus} onChange={(e) => setAttendeeStatus(e.target.value)} style={inputStyle}>
              <option value="">Select…</option>
              <option>New</option><option>Old</option>
            </select>
          </div>
          <div><label style={labelStyle}>Phone number</label><input value={phone} onChange={(e) => setPhone(e.target.value)} style={inputStyle} /></div>
          {userType === "Student" && (
            <div><label style={labelStyle}>University name</label>
              <input value={university} onChange={(e) => setUniversity(e.target.value)} placeholder="Cairo University" style={inputStyle} />
            </div>
          )}
        </div>
        <button onClick={handleSubmit} disabled={submitting} style={{ ...btnPrimary, marginTop: 14, opacity: submitting ? 0.6 : 1 }}>
          {submitting ? "Saving…" : "Add subscriber"}

        {error && <div style={{ color: "#B4231D", fontSize: 13, marginTop: 8, fontFamily: "Inter" }}>{error}</div>}
        {justAdded && (
          <div style={{ marginTop: 12, background: "#E4F5EC", border: "1px solid #B9E3CB", borderRadius: 8, padding: "10px 14px", fontSize: 13, fontFamily: "Inter", color: "#1F7A4D", fontWeight: 600 }}>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>

          <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "Inter", fontSize: 13 }}>

                <th style={{ padding: "6px 8px" }}>USER ID</th><th>NAME</th><th>TYPE</th><th>NEW/OLD</th><th>PHONE</th><th>UNIVERSITY</th><th>DATE</th>
