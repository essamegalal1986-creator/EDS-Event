<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EDS Event Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f5;
    --surface:#ffffff;
    --surface-2:#f2f6f8;
    --ink:#142430;
    --ink-soft:#51606b;
    --line:#d7dee3;
    --primary:#167d9e;
    --primary-dark:#0e5870;
    --primary-tint:#e2eef2;
    --accent:#c07a2b;
    --accent-tint:#f6e8d4;
    --danger:#a83a2c;
    --danger-tint:#f4ded9;
    --warn:#b8811f;
    --warn-tint:#f6ecd4;
    --ok:#3c7a4c;
    --ok-tint:#dfeee2;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,36,48,.06), 0 4px 14px rgba(20,36,48,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans',-apple-system,sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app-shell{display:flex;align-items:flex-start;min-height:100vh;}
  #app{max-width:1100px;margin:0 auto;padding:24px 24px 60px;width:100%;}
  #app.no-pad{padding:0;max-width:none;margin:0;}
  .main-content{flex:1;min-width:0;}

  header.top{
    background:linear-gradient(135deg, var(--primary-dark), #0a4a41 55%, #082f2a);
    color:#fff;
    width:232px;flex:none;
    padding:20px 14px;
    box-shadow:0 4px 18px rgba(8,25,22,.18);
    position:sticky;top:0;height:100vh;overflow-y:auto;
    z-index:5;
  }
  header.top .inner{display:flex;flex-direction:column;min-height:100%;}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .brand img.brand-logo{height:36px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;box-shadow:0 2px 6px rgba(0,0,0,.15);flex:none;}
  .brand .brand-text h1{font-size:16.5px;margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.2;}
  .brand .brand-text .sub{color:#bcd3cd;font-size:10.5px;margin-top:2px;line-height:1.3;}
  .header-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);}
  .notif-bell{
    display:flex;align-items:center;gap:8px;margin-top:16px;padding:9px 12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:8px;
    cursor:pointer;color:#dfeaea;font-size:12.5px;font-weight:600;
    transition:background-color .15s ease;
  }
  .notif-bell:hover{background:rgba(255,255,255,.12);}
  .notif-bell.has-alerts{border-color:rgba(192,122,43,.5);}
  .notif-bell .notif-count{
    margin-left:auto;background:var(--accent);color:#2a1a05;font-family:'IBM Plex Mono',monospace;
    font-weight:700;font-size:11px;padding:2px 7px;border-radius:99px;
  }
  nav.tabs{display:flex;flex-direction:column;gap:2px;margin-top:22px;overflow-y:auto;flex:1;}
  nav.tabs button{
    background:transparent;border:none;color:#bcd3cd;
    padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;
    border-left:3px solid transparent;white-space:nowrap;text-align:left;
    font-family:inherit;border-radius:0 7px 7px 0;
    transition:color .15s ease, background-color .15s ease, border-color .15s ease;
  }
  nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06);}
  nav.tabs button.active{color:#fff;border-left-color:var(--accent);background:rgba(255,255,255,.08);}

  @media (max-width:860px){
    .app-shell{flex-direction:column;}
    header.top{width:100%;height:auto;position:relative;top:auto;overflow-y:visible;padding:16px 16px 0;}
    header.top .inner{min-height:0;}
    nav.tabs{flex-direction:row;overflow-x:auto;overflow-y:visible;margin-top:14px;flex:none;}
    nav.tabs button{border-left:none;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;}
    nav.tabs button.active{border-left-color:transparent;border-bottom-color:var(--accent);}
    .sidebar-footer{margin-top:12px;border-top:none;padding-top:0;padding-bottom:12px;}
    .header-actions{flex-direction:row;align-items:center;}
    #app{padding:20px 16px 60px;}
  }

  /* ---- Login screen ---- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(circle at 30% 20%, #f3f8fa 0%, var(--bg) 55%);
  }
  .login-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 8px 24px rgba(20,36,48,.1), 0 2px 8px rgba(20,36,48,.06);
    padding:36px 32px;width:100%;max-width:360px;text-align:center;
    animation:login-in .35s ease;
  }
  @keyframes login-in{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .login-card img.login-logo{height:64px;width:auto;margin-bottom:14px;filter:drop-shadow(0 3px 8px rgba(20,36,48,.15));}
  .login-card h2{margin:0 0 4px;font-size:19px;color:var(--primary-dark);font-weight:800;letter-spacing:-.01em;}
  .login-card p.login-sub{margin:0 0 22px;color:var(--ink-soft);font-size:12.5px;}
  .login-card .field{text-align:left;}
  .login-card .login-error{
    background:var(--danger-tint);color:var(--danger);border-radius:7px;
    padding:8px 10px;font-size:12.5px;margin-bottom:14px;
  }

  /* ---- In-page prompt modal (used instead of window.prompt/alert, which
     many mobile browsers and embedded webviews silently block) ---- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,20,25,.5);z-index:10000;
    display:flex;align-items:center;justify-content:center;padding:20px;
    animation:modal-fade .15s ease;
  }
  @keyframes modal-fade{ from{opacity:0;} to{opacity:1;} }
  .modal-box{
    background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);
    padding:22px 24px;width:100%;max-width:380px;
    animation:modal-in .18s ease;
  }
  @keyframes modal-in{ from{opacity:0;transform:scale(.97) translateY(4px);} to{opacity:1;transform:scale(1) translateY(0);} }
  .modal-box h3{margin:0 0 10px;font-size:15px;color:var(--primary-dark);}
  .modal-box p.modal-msg{margin:0 0 14px;font-size:13px;color:var(--ink);white-space:pre-line;}
  .modal-box .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}

  #app{animation:app-fade .18s ease;}
  @keyframes app-fade{ from{opacity:0;} to{opacity:1;} }

  h2.section-title{
    font-size:17px;font-weight:800;margin:0 0 4px;color:var(--primary-dark);
  }
  p.section-desc{color:var(--ink-soft);margin:0 0 18px;font-size:13px;}

  .grid{display:grid;gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
    transition:box-shadow .18s ease, border-color .18s ease;
  }
  .card.stat{position:relative;overflow:hidden;padding-left:20px;}
  .card.stat::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--primary);opacity:.55;
  }
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-top:6px;color:var(--primary-dark);letter-spacing:-.01em;}
  .stat .value.danger{color:var(--danger);}
  .stat .value.warn{color:var(--warn);}
  .stat .note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  table{border-collapse:collapse;width:100%;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-soft);padding:9px 10px;border-bottom:2px solid var(--line);font-weight:700;
    background:var(--surface-2);
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr{transition:background-color .12s ease;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);}
  .table-wrap table{border:none;}
  .table-wrap thead th{border-top:none;}

  .badge{
    display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;
    letter-spacing:.02em;border:1px solid transparent;
  }
  .badge.ok{background:var(--ok-tint);color:var(--ok);border-color:rgba(60,122,76,.25);}
  .badge.warn{background:var(--warn-tint);color:var(--warn);border-color:rgba(184,129,31,.25);}
  .badge.danger{background:var(--danger-tint);color:var(--danger);border-color:rgba(168,58,44,.25);}
  .badge.tint{background:var(--primary-tint);color:var(--primary-dark);border-color:rgba(22,125,158,.2);}
  .badge.accent{background:var(--accent-tint);color:#7a4c17;border-color:rgba(192,122,43,.25);}
  .badge.muted{background:var(--surface-2);color:var(--ink-soft);border-color:var(--line);}

  button.btn{
    font-family:inherit;font-weight:700;font-size:12.5px;border-radius:7px;
    padding:9px 14px;border:1px solid transparent;cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .05s ease;
  }
  button.btn:active{transform:translateY(1px);}
  button.btn.primary{background:var(--primary);color:#fff;box-shadow:0 1px 3px rgba(22,125,158,.3);}
  button.btn.primary:hover{background:var(--primary-dark);box-shadow:0 2px 6px rgba(22,125,158,.35);}
  button.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  button.btn.ghost:hover{background:var(--surface-2);border-color:#c3ccd2;}
  button.btn.danger-ghost{background:transparent;border-color:var(--danger-tint);color:var(--danger);}
  button.btn.danger-ghost:hover{background:var(--danger-tint);}
  button.btn.sm{padding:5px 10px;font-size:11.5px;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

  label.field-label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  input,select,textarea{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--ink);width:100%;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:hover,select:hover,textarea:hover{border-color:#c3ccd2;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,125,158,.15);}
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:12px;}

  .lineitem-row{display:grid;grid-template-columns:2.4fr .7fr .8fr .9fr .9fr .9fr 32px;gap:8px;align-items:end;margin-bottom:8px;}
  .lineitem-row .li-label{font-size:10px;color:var(--ink-soft);margin-bottom:3px;font-weight:700;text-transform:uppercase;}
  @media (max-width:820px){.lineitem-row{grid-template-columns:1fr 1fr;} }

  .remove-x{
    background:var(--danger-tint);color:var(--danger);border:none;border-radius:6px;
    width:32px;height:34px;cursor:pointer;font-weight:800;
  }

  .news-hero{
    background:linear-gradient(135deg, var(--primary-dark), #0a4a41 45%, #082f2a);
    border-radius:20px;padding:32px 36px;position:relative;overflow:hidden;
    display:flex;align-items:center;gap:28px;flex-wrap:wrap;
    box-shadow:0 10px 34px rgba(8,25,22,.28);
  }
  .news-hero::before{
    content:"";position:absolute;top:-60px;right:-60px;width:220px;height:220px;
    background:radial-gradient(circle, rgba(192,122,43,.25), transparent 70%);
    pointer-events:none;
  }
  .news-hero::after{
    content:"";position:absolute;bottom:-80px;left:20%;width:260px;height:260px;
    background:radial-gradient(circle, rgba(22,125,158,.35), transparent 70%);
    pointer-events:none;
  }
  .hero-avatar-wrap{flex:none;position:relative;z-index:1;animation:hero-float 3.2s ease-in-out infinite;}
  @keyframes hero-float{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-7px) rotate(-2deg);} }
  .hamdy-eyes{transform-box:fill-box;transform-origin:center;animation:hamdy-blink 5s ease-in-out infinite;}
  @keyframes hamdy-blink{ 0%,92%,100%{transform:scaleY(1);} 95%{transform:scaleY(.12);} }
  .hero-avatar{
    width:104px;height:104px;border-radius:50%;
    background:linear-gradient(135deg, #fff, #dfeee2);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,.25), inset 0 0 0 4px rgba(255,255,255,.5);
  }
  .hero-avatar svg{width:70px;height:70px;}
  .hero-slide-wrap{flex:1;min-width:260px;position:relative;z-index:1;}
  .hero-slide-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#9fd6c9;font-weight:700;margin-bottom:6px;}
  .hero-slide{
    animation:hero-slide-in .4s ease;
  }
  @keyframes hero-slide-in{ from{opacity:0;transform:translateX(10px);} to{opacity:1;transform:translateX(0);} }
  .hero-slide .hs-icon{font-size:24px;margin-bottom:6px;}
  .hero-slide .hs-text{font-size:19px;font-weight:700;color:#fff;letter-spacing:-.005em;line-height:1.4;max-width:52ch;}
  .hero-dots{display:flex;gap:6px;margin-top:18px;position:relative;z-index:1;}
  .hero-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:background-color .15s ease, transform .15s ease;}
  .hero-dots span.active{background:var(--accent);transform:scale(1.3);}

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:28px;margin-bottom:8px;opacity:.6;}

  .invoice-doc{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:32px;max-width:760px;margin:0 auto;box-shadow:var(--shadow);
  }
  .invoice-doc .idoc-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--primary-dark);padding-bottom:16px;margin-bottom:20px;
  }
  .invoice-doc .idoc-head h3{margin:0;font-size:20px;color:var(--primary-dark);letter-spacing:-.01em;}
  .invoice-doc .idoc-head .num{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--accent);font-weight:700;}
  .idoc-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
  .idoc-meta div div.k{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.06em;font-weight:700;}
  .idoc-meta div div.v{font-size:14px;margin-top:2px;}
  .idoc-totals{margin-top:14px;width:280px;margin-left:auto;}
  .idoc-totals div.trow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;}
  .idoc-totals div.trow.grand{border-top:2px solid var(--primary-dark);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px;color:var(--primary-dark);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px;}
  .toolbar .field{margin-bottom:0;min-width:160px;}

  .pill-toggle{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface);}
  .pill-toggle button{border:none;background:transparent;padding:6px 13px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink-soft);transition:background-color .15s ease, color .15s ease;}
  .pill-toggle button:hover{background:var(--surface-2);color:var(--ink);}
  .pill-toggle button.active{background:var(--primary);color:#fff;}

  .catalog-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .18s ease, border-color .18s ease;}
  .catalog-card:hover{border-color:#c3ccd2;box-shadow:0 2px 8px rgba(20,36,48,.09), 0 6px 18px rgba(20,36,48,.07);}
  .catalog-card h4{margin:0 0 4px;font-size:13.5px;}
  .catalog-card .price{font-family:'IBM Plex Mono',monospace;color:var(--primary-dark);font-weight:700;font-size:14px;}
  .catalog-card .comp{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#c3cdc4;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#a9b4bb;}

  /* Chrome/Edge only render their built-in print header/footer (page title,
     URL, date, page number) when @page has a non-zero margin to put it in.
     Setting margin:0 here reliably suppresses that — so the printed
     invoice/receipt never reveals this site's URL to a customer. Padding
     is added back inside the printed content itself so nothing touches
     the paper edge. */
  @page{ margin:0; }
  @media print{
    header.top, nav.tabs, .no-print{display:none !important;}
    body{background:#fff;}
    .invoice-doc{box-shadow:none;border:none;padding:20px;}
    /* Printing an invoice or receipt from ANY tab (Invoices, Payments, etc):
       hide the whole app and show only the relevant global print area. */
    body.printing-invoice #app, body.printing-receipt #app{display:none !important;}
    body.printing-invoice #print-invoice-area{display:block !important;}
    body.printing-receipt #print-receipt-area{display:block !important;}
  }
  /* Narrow receipt layout for thermal/label printers (e.g. Zebra continuous
     labels ~75mm wide). Only shown while printing a receipt — see
     body.printing-receipt above. The named @page below tells the browser's
     print engine the physical page is 75mm wide with an open-ended (auto)
     length, which matches a continuous label roll instead of A4/Letter —
     margin stays 0 for the same header/footer-suppression reason above. */
  @page eds-receipt{ size: 75mm auto; margin: 0; }
  #print-invoice-area{ display:none; }
  #print-receipt-area{ display:none; page: eds-receipt; }
  .receipt{ width:100%; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#000; line-height:1.5; padding:3mm; box-sizing:border-box; }
  .receipt .rline{ display:flex; justify-content:space-between; gap:8px; padding:1px 0; }
  .receipt .rline > span:last-child{ text-align:right; white-space:nowrap; }
  .receipt .rline-sub{ font-size:10px; color:#333; }
  .receipt .r-center{ text-align:center; }
  .receipt .r-bold{ font-weight:700; }
  .receipt .r-dash{ border-top:1px dashed #000; margin:5px 0; }

  .user-switch-row{margin-top:0;margin-bottom:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;}
  .user-switch-row label{font-size:10px;color:#bcd3cd;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .user-switch-row select{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;
    padding:5px 8px;border-radius:6px;font-size:12.5px;width:100%;
  }
  .user-switch-row select option{color:#152420;}
  @media (max-width:860px){
    .user-switch-row{flex-direction:row;align-items:center;width:auto;margin-right:12px;}
    .user-switch-row select{width:auto;min-width:140px;}
  }

  .order-box{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;
    transition:box-shadow .18s ease;
  }
  .order-box:hover{box-shadow:0 2px 8px rgba(20,36,48,.09), 0 6px 18px rgba(20,36,48,.07);}
  .order-box .ob-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .order-box .ob-title{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--primary-dark);font-size:14px;}
  .order-box .ob-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .order-box ul.ob-items{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--line);}
  .order-box ul.ob-items li{
    display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line);
  }
  .order-box ul.ob-items li span.qty{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--primary-dark);}

  .access-denied{text-align:center;padding:60px 20px;color:var(--ink-soft);}

  .chart-bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding:10px 4px 0;}
  .chart-bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}

  .user-card .uc-access{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}

let PRODUCTS = BASE_PRODUCTS;
let productByName = {};
let componentUsage = {};

function rebuildIndexes(){
  PRODUCTS = STATE.products;
  productByName = {};
  PRODUCTS.forEach(p => productByName[p.name] = p);
  // reverse map: individual product name -> [{bundleName, qty}]
  componentUsage = {};
  PRODUCTS.filter(p => p.type === "Bundle").forEach(b => {
    b.components.forEach(c => {
      if(!componentUsage[c.name]) componentUsage[c.name] = [];
      componentUsage[c.name].push({ bundle: b.name, qty: c.qty });
    });
  });
}

function nextProductId(){
  let max = 0;
  PRODUCTS.forEach(p=>{
    const m = /^p(\d+)$/.exec(p.id||"");
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "p" + (max+1);
}

function ensureStateDefaults(){
  if(!Array.isArray(STATE.products) || STATE.products.length === 0){
    STATE.products = JSON.parse(JSON.stringify(BASE_PRODUCTS));
  }

  if(!Array.isArray(STATE.universities)) STATE.universities = [];
  if(!Array.isArray(STATE.events)) STATE.events = [];
  if(!Array.isArray(STATE.salesMembers)) STATE.salesMembers = [];
  if(!STATE.customers || typeof STATE.customers !== "object") STATE.customers = {};
  if(typeof STATE.overridePassword !== "string") STATE.overridePassword = "";

    STATE.users = [{ id: ADMIN_ID, name: "Admin", password: DEFAULT_ADMIN_PASSWORD, access: TABS.map(t=>t.id), canApprove:true }];
  }
  if(!STATE.currentUserId || !STATE.users.find(u=>u.id===STATE.currentUserId)){

/* A deleted order's invoice number can later get reused by a brand-new
   order (nextInvoiceNo() just looks for the lowest free number). Without
   this, a leftover "Delivered" flag, payment split, or timing record from
   the old, deleted order would silently attach itself to the new one.
   All three only ever make sense for an invoice number that currently has
   real sale lines, so any other key is stale and removed on every load. */
function pruneOrphanedDelivery(){
  if(!STATE.delivery) STATE.delivery = {};
  if(!STATE.paymentSplits) STATE.paymentSplits = {};
  if(!STATE.manualApprovals) STATE.manualApprovals = {};
  if(!STATE.timing) STATE.timing = {};
  const activeInvoices = new Set(STATE.sales.map(s=>s.invoiceNo));
  Object.keys(STATE.delivery).forEach(no=>{
    if(!activeInvoices.has(no)) delete STATE.delivery[no];
  });
  Object.keys(STATE.paymentSplits).forEach(no=>{
    if(!activeInvoices.has(no)) delete STATE.paymentSplits[no];
  });
  Object.keys(STATE.manualApprovals).forEach(no=>{
    if(!activeInvoices.has(no)) delete STATE.manualApprovals[no];
  });
  Object.keys(STATE.timing).forEach(no=>{
    if(!activeInvoices.has(no)) delete STATE.timing[no];
  });
}

function storageAvailable(){
  try{
    const t = "__eds_storage_test__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}

/* Applied whenever fresh data arrives from Firebase (initial load AND live
   updates from teammates). Skips re-rendering mid-keystroke so a remote
   update never yanks focus out from under someone who's typing. */
function applyRemoteState(remote){
  if(!remote || typeof remote !== "object") return;
  STATE = Object.assign({sales:[],restock:{},reorder:{},delivery:{},paymentSplits:{},manualApprovals:{},timing:{},products:[],categories:[],suppliers:[],universities:[],events:[],salesMembers:[],customers:{},users:[],currentUserId:""}, remote);
  ensureStateDefaults();
  rebuildIndexes();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
  if(!loaded){ loaded = true; }
  const active = document.activeElement;
  const isTyping = active && ["INPUT","TEXTAREA","SELECT"].includes(active.tagName);
  if(!isTyping) render();
}

async function loadState(){
  initFirebase();
  if(fbReady){
    try{
      const snap = await fbDb.ref(STORAGE_KEY).once("value");
      const remote = snap.val();
      if(remote){
        STATE = Object.assign(STATE, remote);
      } else {
        // nothing in the cloud yet — seed it from whatever's here (or defaults)
      }
      ensureStateDefaults();
      rebuildIndexes();
      loaded = true;
      // live updates from every other browser/device from now on
      if(!fbListenerAttached){
        fbListenerAttached = true;
        fbDb.ref(STORAGE_KEY).on("value", snap=>applyRemoteState(snap.val()));
      }
      return;
    }catch(e){
      console.error("Firebase load failed, falling back to local", e);
      syncMode = "cloud-error";
    }
  }
  // Fallback: local-only (no Firebase configured, or it failed to load)
  try{
    if(storageAvailable()){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        STATE = Object.assign(STATE, parsed);
      }
    } else {
      console.warn("localStorage is unavailable — data will not persist between visits.");
    }
  }catch(e){ console.error("Storage load error", e); }
  ensureStateDefaults();
  rebuildIndexes();
  loaded = true;
}

/* ============================= HELPERS ============================= */
function fmtEGP(n){
  if(n === "" || n === null || n === undefined || isNaN(n)) return "—";
  return "EGP " + Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
}
/* Both of these must stay in the LOCAL timezone, matching localDateKey() —
   toISOString() is always UTC, which silently returns "yesterday" for a
   couple of hours after local midnight in timezones ahead of UTC (e.g.
   Cairo, UTC+2/+3). That mismatch would mis-date orders placed right after
   midnight and throw off the Dashboard's Today/date-range filtering. */
function localYMD(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayISO(){ return localYMD(new Date()); }
function shiftISODate(iso, days){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+days);
  return localYMD(d);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
/* The event whose date range covers today, if any — used as the default
   selection on the Orders form so staff don't have to pick it every time. */
function currentEvent(){
  const today = todayISO();
  return STATE.events.find(e => (!e.startDate || e.startDate<=today) && (!e.endDate || e.endDate>=today)) || null;
}

function nextInvoiceNo(){
  let max = 0;
  STATE.sales.forEach(s=>{
    const m = /^INV-(\d+)$/.exec(s.invoiceNo || "");
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "INV-" + String(max+1).padStart(4,"0");
}

function lineCalc(qty, unitPrice, discountPct){
  qty = Number(qty)||0; unitPrice = Number(unitPrice)||0; discountPct = Number(discountPct)||0;
  const discountAmt = qty*unitPrice*discountPct/100;
  const lineTotal = qty*unitPrice - discountAmt;
  return {discountAmt, lineTotal};
}

function invoiceList(){
  const map = new Map();
  STATE.sales.forEach(s=>{
    if(!map.has(s.invoiceNo)) map.set(s.invoiceNo, []);
    map.get(s.invoiceNo).push(s);
  });
  return map;
}

/* Manual Sales orders sit in a Pending state until someone with approval
   rights signs off — only then do they become visible in Payments. Every
   other order (no approvalStatus, or explicitly "Approved") is unaffected. */
function isApprovedForPayment(rows){
  return rows.every(r => !r.approvalStatus || r.approvalStatus === "Approved");
}
function userCanApprove(user){
  user = user || currentUser();
  return user.id === ADMIN_ID || !!user.canApprove;
}
/* Everyone currently eligible to approve — checked live, so adding or
   removing approval rights affects orders still awaiting sign-off. */
function requiredApprovers(){
  return STATE.users.filter(u=>u.id!==ADMIN_ID && u.canApprove);
}
/* An order needs a signed-off confirmation from EVERY current approver
   before it's considered Approved; a single rejection blocks it outright. */
function manualApprovalState(no){
  const rec = STATE.manualApprovals[no] || {approvedBy:[], rejectedBy:null};
  const approvers = requiredApprovers();
  const approvedBy = approvers.filter(u=>rec.approvedBy.includes(u.id));
  const pendingOn = approvers.filter(u=>!rec.approvedBy.includes(u.id));
  return { rejectedBy: rec.rejectedBy, approvedBy, pendingOn, allApproved: approvers.length>0 && pendingOn.length===0 };
}

/* Drives the sidebar notification bell: how many Manual Sales orders are
   waiting on ME specifically to approve, plus how many of MY orders (by
   matching Sales Member name) got rejected. */
function computeNotifications(){
  const me = currentUser();
  let pendingForMe = 0, rejectedForMe = 0;
  if(!hasAccess("approvals") && !hasAccess("manualorders")) return {pendingForMe:0, rejectedForMe:0, total:0};
  allManualSalesOrders().forEach(o=>{
    if(o.approval==="Pending" && userCanApprove(me)){
      if(me.id===ADMIN_ID) pendingForMe++;
      else if(manualApprovalState(o.no).pendingOn.some(u=>u.id===me.id)) pendingForMe++;
    }
    if(o.approval==="Rejected" && o.salesMember && me.name &&
       o.salesMember.trim().toLowerCase()===me.name.trim().toLowerCase()){
      rejectedForMe++;
    }
  });
  return { pendingForMe, rejectedForMe, total: pendingForMe+rejectedForMe };
}

function invoiceSummary(rows){
  const subtotal = rows.reduce((a,r)=>a + Number(r.qty)*Number(r.unitPrice),0);
  const discount = rows.reduce((a,r)=>a + lineCalc(r.qty,r.unitPrice,r.discountPct).discountAmt,0);
  const grand = subtotal - discount;
  return {subtotal, discount, grand};
}

/* An invoice can be paid with more than one method (part cash, part card,
   part bank transfer...). STATE.paymentSplits[invoiceNo] holds the actual
   breakdown when one was recorded. Falls back to the single legacy
   paymentMethod field for older/simple invoices that predate splitting. */
function paymentBreakdown(no, rows){
  const splits = STATE.paymentSplits && STATE.paymentSplits[no];
  if(splits && splits.length){
    return splits.map(s=>({method:s.method, amount:Number(s.amount)||0}));
  }
  const h = rows && rows[0];
  if(h && h.paymentStatus==="Paid" && h.paymentMethod){
    const {grand} = invoiceSummary(rows);
    return [{method:h.paymentMethod, amount:grand}];
  }
  return [];
}
function paymentMethodDisplay(no, rows){
  const breakdown = paymentBreakdown(no, rows);
  if(breakdown.length===0) return "—";
  if(breakdown.length===1) return breakdown[0].method;
  return breakdown.map(b=>`${b.method} ${fmtEGP(b.amount)}`).join(" + ");
}

/* ============================= SERVICE LEVEL / TIMING ============================= */
function fmtDuration(ms){
  if(ms==null || isNaN(ms) || ms<0) return "—";
  const mins = ms/60000;
  if(mins < 90) return Math.round(mins) + "m";
  const hours = ms/3600000;
  if(hours < 48) return (Math.round(hours*10)/10) + "h";
  const days = ms/86400000;
  return (Math.round(days*10)/10) + "d";
}
function avgOf(list){
  return list.length ? list.reduce((a,b)=>a+b,0)/list.length : null;
}
function localDateKey(ms){
  const d = new Date(ms);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function monthLabel(ym){
  const [y,mo] = String(ym||"").split("-");
  if(!y || !mo) return ym||"—";
  const d = new Date(Number(y), Number(mo)-1, 1);
  return d.toLocaleDateString(undefined, {month:"short", year:"2-digit"});
}
/* Manual Sales orders are deliberately excluded from every SLA/timing
   metric everywhere (Order Cadence, Order→Payment, Payment→Delivery, Full
   Cycle) — they go through a separate approval workflow and shouldn't
   affect how "fast" the normal event pipeline looks. */
function isManualSalesInvoice(no){
  const s = STATE.sales.find(x=>x.invoiceNo===no);
  return !!(s && s.event === MANUAL_SALES_EVENT);
}
function timingEntries(allowedInvoices){
  return Object.entries(STATE.timing).filter(([no])=> (!allowedInvoices || allowedInvoices.has(no)) && !isManualSalesInvoice(no));
}
// Avg time between one order and the next — only counted between orders
// placed on the SAME calendar day, so the overnight gap while closed
// (last order of the day → first order of the next) never skews this.
function avgOrderCadence(allowedInvoices){
  const times = timingEntries(allowedInvoices).map(([,t])=>t.createdAt).filter(Boolean).sort((a,b)=>a-b);
  if(times.length<2) return null;
  const diffs = [];
  for(let i=1;i<times.length;i++){
    if(localDateKey(times[i]) === localDateKey(times[i-1])){
      diffs.push(times[i]-times[i-1]);
    }
  }
  return avgOf(diffs);
}
// Avg time from order creation to payment confirmation — shown on Payments.
function avgOrderToPayment(allowedInvoices){
  return avgOf(timingEntries(allowedInvoices).filter(([,t])=>t.createdAt && t.paidAt).map(([,t])=>t.paidAt-t.createdAt));
}
// Avg time from payment confirmation to delivery confirmation — shown on Delivery.
function avgPaymentToDelivery(allowedInvoices){
  return avgOf(timingEntries(allowedInvoices).filter(([,t])=>t.paidAt && t.deliveredAt).map(([,t])=>t.deliveredAt-t.paidAt));
}
/* Full-cycle SLA, per operating day: from that day's FIRST order to that
   day's LAST confirmed delivery — not a raw per-invoice average, since a
   single order's own order→delivery time can span a closed overnight gap
   that has nothing to do with how fast the business actually is. */
function dailyCycleStats(allowedInvoices){
  const orderDayStart = {};   // dateKey -> earliest createdAt that day
  const deliveryDayEnd = {};  // dateKey -> latest deliveredAt that day
  timingEntries(allowedInvoices).forEach(([,t])=>{
    if(t.createdAt){
      const k = localDateKey(t.createdAt);
      if(orderDayStart[k]==null || t.createdAt < orderDayStart[k]) orderDayStart[k] = t.createdAt;
    }
    if(t.deliveredAt){
      const k = localDateKey(t.deliveredAt);
      if(deliveryDayEnd[k]==null || t.deliveredAt > deliveryDayEnd[k]) deliveryDayEnd[k] = t.deliveredAt;
    }
  });
  return Object.keys(orderDayStart)
    .filter(k=> deliveryDayEnd[k]!=null && deliveryDayEnd[k] >= orderDayStart[k])
    .sort()
    .map(k=>({ date:k, firstOrder:orderDayStart[k], lastDelivery:deliveryDayEnd[k], cycle: deliveryDayEnd[k]-orderDayStart[k] }));
}
function avgFullCycle(allowedInvoices){
  const days = dailyCycleStats(allowedInvoices);
  return days.length ? avgOf(days.map(d=>d.cycle)) : null;
}

function stockRows(){
  return PRODUCTS.filter(p=>p.type==="Individual").map(p=>{
    const directSold = STATE.sales
      .filter(s=>s.productName===p.name && s.paymentStatus==="Paid" && s.event!==MANUAL_SALES_EVENT)
      .reduce((a,s)=>a+Number(s.qty),0);
    const bundleUses = componentUsage[p.name] || [];
    const bundleConsumed = bundleUses.reduce((total,u)=>{
      const qtySold = STATE.sales
        .filter(s=>s.productName===u.bundle && s.paymentStatus==="Paid" && s.event!==MANUAL_SALES_EVENT)
        .reduce((a,s)=>a+Number(s.qty),0);
      return total + qtySold*u.qty;
    },0);
    const totalUsed = directSold + bundleConsumed;
    const restock = Number(STATE.restock[p.name])||0;
    const reorder = Number(STATE.reorder[p.name])||0;
    const current = p.opening + restock - totalUsed;
    let status = "OK";
    if(current<=0) status="OUT OF STOCK"; else if(current<=reorder) status="LOW STOCK";
    return {...p, directSold, bundleConsumed, totalUsed, restock, reorder, current, status};
  });
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function cssEscape(s){
  return (typeof CSS !== "undefined" && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
}

/* In-page replacement for window.prompt(). Native prompt/alert/confirm are
   unreliable outside a normal desktop browser tab — many mobile browsers
   and embedded webviews silently block them (they just return null with
   no visible dialog at all), which makes password-gated actions look like
   they "do nothing". This builds the same yes/no interaction as real DOM,
   so it always works. Resolves with the entered string, or null if
   cancelled. */
function showPasswordPrompt(title, message){
  return new Promise(resolve=>{
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal-box">
        <h3>${escapeHtml(title)}</h3>
        <p class="modal-msg">${escapeHtml(message)}</p>
        <input type="password" id="modal-prompt-input" placeholder="Password" style="margin-bottom:4px;">
        <div class="modal-actions">
          <button class="btn ghost sm" id="modal-prompt-cancel">Cancel</button>
          <button class="btn primary sm" id="modal-prompt-ok">Confirm</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    const input = backdrop.querySelector("#modal-prompt-input");
    input.focus();
    function done(value){
      backdrop.remove();
      resolve(value);
    }
    backdrop.querySelector("#modal-prompt-cancel").addEventListener("click", ()=>done(null));
    backdrop.querySelector("#modal-prompt-ok").addEventListener("click", ()=>done(input.value));
    backdrop.addEventListener("click", e=>{ if(e.target===backdrop) done(null); });
    input.addEventListener("keydown", e=>{
      if(e.key==="Enter") done(input.value);
      if(e.key==="Escape") done(null);
    });
  });
}
function showAlert(title, message){
  return new Promise(resolve=>{
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal-box">
        <h3>${escapeHtml(title)}</h3>
        <p class="modal-msg">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn primary sm" id="modal-alert-ok">OK</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    function done(){ backdrop.remove(); resolve(); }
    backdrop.querySelector("#modal-alert-ok").addEventListener("click", done);
    backdrop.addEventListener("click", e=>{ if(e.target===backdrop) done(); });
    document.addEventListener("keydown", function esc(e){ if(e.key==="Escape"){ done(); document.removeEventListener("keydown", esc); } });
  });
}
/* Reliable replacement for window.confirm() — same rationale as
   showPasswordPrompt/showAlert: native confirm() is silently blocked in
   many mobile browsers and embedded webviews, which made every delete
   button in the app look like it "does nothing". Resolves true/false. */
function showConfirm(title, message, confirmLabel){
  return new Promise(resolve=>{
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal-box">
        <h3>${escapeHtml(title)}</h3>
        <p class="modal-msg">${escapeHtml(message)}</p>
        <div class="modal-actions">
          <button class="btn ghost sm" id="modal-confirm-cancel">Cancel</button>
          <button class="btn danger-ghost sm" id="modal-confirm-ok">${escapeHtml(confirmLabel||"Confirm")}</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    function done(value){ backdrop.remove(); resolve(value); }
    backdrop.querySelector("#modal-confirm-cancel").addEventListener("click", ()=>done(false));
    backdrop.querySelector("#modal-confirm-ok").addEventListener("click", ()=>done(true));
    backdrop.addEventListener("click", e=>{ if(e.target===backdrop) done(false); });
    document.addEventListener("keydown", function esc(e){ if(e.key==="Escape"){ done(false); document.removeEventListener("keydown", esc); } });
  });
}
/* Pops up asking to pick one option from a dropdown — used to ask for the
   Sales Member the moment "Manual Sales" is chosen on an order. Resolves

function showSelectPrompt(title, message, options, emptyLabel){

/* ============================= RENDER SHELL ============================= */
const MANUAL_SALES_EVENT = "Manual Sales"; // special event value: orders go through an approval cycle before Payments, and are excluded from SLA math and Stock Control deductions

const TABS = [
  {id:"dashboard", label:"Dashboard"},
  {id:"products", label:"Products"},
  {id:"orders", label:"Orders"},
  {id:"approvals", label:"Approvals"},
  {id:"manualorders", label:"Manual Orders"},
  {id:"payments", label:"Payments"},
  {id:"delivery", label:"Delivery"},
  {id:"saleslog", label:"Sales Log"},
  {id:"invoices", label:"Invoices"},
  {id:"manualsales", label:"Manual Sales"},
  {id:"stock", label:"Stock Control"},
  {id:"settings", label:"Settings"},
  {id:"users", label:"Users"},
];

/* ---- Explode one order line down to real, deliverable products. A bundle
   line becomes one item per component, named after the component product —
   never the bundle name. Components with qty 0 contribute nothing. ---- */
function explodeLine(line){
  const p = productByName[line.productName];
  if(!p) return [];
  if(p.type === "Individual") return [{ name: line.productName, qty: Number(line.qty)||0 }];
  return p.components
    .map(c => ({ name: c.name, qty: (Number(c.qty)||0) * (Number(line.qty)||0) }))
    .filter(c => c.qty > 0);
}

/* Same idea as explodeLine, but for revenue-bearing analytics (Dashboard's
   Top Products / By Category / By Supplier / Products Sold). A bundle sale
   is broken into its real components with the correct total quantity — a
   bundle is never counted as "1 product" — and the line's revenue is split
   across those components proportional to each one's own catalog price, so
   totals still add up to what was actually charged. */
function explodeLineForAnalytics(s){
  const {lineTotal} = lineCalc(s.qty, s.unitPrice, s.discountPct);
  const p = productByName[s.productName];
  if(!p || p.type === "Individual"){
    return [{ name: s.productName, qty: Number(s.qty)||0, revenue: lineTotal }];
  }
  const comps = p.components
    .map(c => ({ name: c.name, qty: (Number(c.qty)||0) * (Number(s.qty)||0) }))
    .filter(c => c.qty > 0);
  if(comps.length === 0){
    return [{ name: s.productName, qty: Number(s.qty)||0, revenue: lineTotal }];
  }
  const weights = comps.map(c => {
    const cp = productByName[c.name];
    return (cp ? cp.price : 0) * c.qty;
  });
  const totalWeight = weights.reduce((a,b)=>a+b, 0);
  return comps.map((c,i) => ({
    name: c.name,
    qty: c.qty,
    revenue: totalWeight > 0 ? lineTotal * (weights[i]/totalWeight) : lineTotal/comps.length
  }));
}

/* ---- Orders ready for delivery: only orders that are fully PAID, each
   collapsed into ONE box with a consolidated product+quantity list.
   Delivery is confirmed for the whole order at once, not per product. ---- */
function paidOrders(){
  const map = invoiceList();
  const orders = [];
  map.forEach((rows, no)=>{
    const h = rows[0];
    if(h.event === MANUAL_SALES_EVENT) return; // Manual Sales never enters the regular Delivery pipeline
    const allPaid = rows.every(r=>r.paymentStatus==="Paid");
    if(!allPaid) return;
    const itemMap = new Map();
    rows.forEach(line=>{
      explodeLine(line).forEach(it=>{
        itemMap.set(it.name, (itemMap.get(it.name)||0) + it.qty);
      });
    });
    const items = [...itemMap.entries()].map(([name,qty])=>({name,qty}));
    const {grand} = invoiceSummary(rows);
    orders.push({
      invoiceNo: no, customer: h.customer, date: h.date, items, grand,
      status: STATE.delivery[no] || "Pending"
    });
  });
  return orders;
}

/* Delivery is tracked per order, not per sale line. This resolves what to
   show for any given sale row: not yet meaningful until the whole order is
   paid, then it's Pending/Delivered like everywhere else in the app. */
function deliveryStatusForInvoice(no){
  const rows = invoiceList().get(no) || [];
  if(rows.length===0) return "—";
  const allPaid = rows.every(r=>r.paymentStatus==="Paid");
  if(!allPaid) return "Awaiting payment";
  return STATE.delivery[no] || "Pending";
}

function renderTabs(){
  const nav = document.getElementById("tabs");
  const visible = TABS.filter(t=>hasAccess(t.id));
  nav.innerHTML = visible.map(t=>`<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}">${t.label}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ activeTab=b.dataset.tab; render(); });
  });

  const notif = computeNotifications();
  const bellEl = document.getElementById("notif-bell");
  if(notif.total>0){
    const parts = [];
    if(notif.pendingForMe) parts.push(`${notif.pendingForMe} awaiting your approval`);
    if(notif.rejectedForMe) parts.push(`${notif.rejectedForMe} of your orders rejected`);
    bellEl.innerHTML = `<span class="notif-bell has-alerts" title="${escapeHtml(parts.join(" · "))}">🔔 <span>${parts.join(" · ")}</span><span class="notif-count">${notif.total}</span></span>`;
    bellEl.querySelector(".notif-bell").addEventListener("click", ()=>{
      activeTab = notif.pendingForMe ? "approvals" : "manualorders";
      if(!hasAccess(activeTab)) activeTab = TABS.find(t=>hasAccess(t.id))?.id || "dashboard";
      render();
    });
  } else {
    bellEl.innerHTML = "";
  }

  const switchRow = document.getElementById("user-switch-row");
  // Only the real Admin login can preview other users' views — everyone else is locked to their own.
  if(authedUserId === ADMIN_ID){
    switchRow.innerHTML = `
      <label for="user-switch-select">Viewing as</label>
      <select id="user-switch-select">
        ${STATE.users.map(u=>`<option value="${escapeHtml(u.id)}" ${u.id===STATE.currentUserId?"selected":""}>${escapeHtml(u.name)}</option>`).join("")}
      </select>
    `;
    document.getElementById("user-switch-select").addEventListener("change", async e=>{
      STATE.currentUserId = e.target.value;
      if(!hasAccess(activeTab)){
        const first = TABS.find(t=>hasAccess(t.id));
        activeTab = first ? first.id : "dashboard";
      }
      await saveState();
      render();
    });
  } else {
    switchRow.innerHTML = "";
  }

  const actions = document.getElementById("header-actions");
  const syncBadge = syncMode==="cloud"
    ? `<span title="Live shared data — everyone sees the same info in real time" style="font-size:11px;background:rgba(60,122,76,.35);color:#dfeee2;padding:3px 8px;border-radius:99px;font-weight:700;">🟢 Team sync on</span>`
    : syncMode==="cloud-error"
      ? `<span title="Couldn't reach the team database — working from this device's local copy" style="font-size:11px;background:rgba(168,58,44,.35);color:#f4ded9;padding:3px 8px;border-radius:99px;font-weight:700;">🟠 Sync error — local only</span>`
      : `<span title="No shared database configured — this device only" style="font-size:11px;background:rgba(255,255,255,.12);color:#bcd3cd;padding:3px 8px;border-radius:99px;font-weight:700;">💾 Local only</span>`;
  actions.innerHTML = `${syncBadge}<span style="font-size:12px;color:#bcd3cd;">${escapeHtml(currentUser().name)}</span><button class="btn ghost sm" id="logout-btn" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff;">Log out</button>`;
  document.getElementById("logout-btn").addEventListener("click", ()=>{
    authedUserId = null;
    render();
  });
}

function renderLogin(app){
  document.getElementById("app-header").style.display = "none";
  app.classList.add("no-pad");
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <img class="login-logo" src="${EDS_LOGO_DATA_URI}" alt="EDS logo">
        <h2>EDS Event Console</h2>
        <p class="login-sub">Sign in to continue.</p>
        <div id="login-error"></div>
        <div class="field"><label class="field-label">Name</label><input id="login-name" placeholder="Your name" autocomplete="username"></div>
        <div class="field"><label class="field-label">Password</label><input id="login-password" type="password" placeholder="Password" autocomplete="current-password"></div>
        <button class="btn primary" id="login-btn" style="width:100%;margin-top:6px;">Log in</button>
      </div>
    </div>
  `;
  const nameInput = document.getElementById("login-name");
  const passInput = document.getElementById("login-password");
  const errBox = document.getElementById("login-error");
  async function attempt(){
    const name = nameInput.value.trim().toLowerCase();
    const pass = passInput.value;
    const match = STATE.users.find(u=> u.name.trim().toLowerCase()===name && (u.password||"")===pass);
    if(!match){
      errBox.innerHTML = `<div class="login-error">Name or password is incorrect.</div>`;
      return;
    }
    authedUserId = match.id;
    STATE.currentUserId = match.id;
    activeTab = TABS.find(t=>hasAccess(t.id)) ? (hasAccess("dashboard")?"dashboard":TABS.find(t=>hasAccess(t.id)).id) : "dashboard";
    document.getElementById("app-header").style.display = "block";
    await saveState();
    render();
  }
  document.getElementById("login-btn").addEventListener("click", attempt);
  passInput.addEventListener("keydown", e=>{ if(e.key==="Enter") attempt(); });
  nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter") passInput.focus(); });
}

function render(){
  const app = document.getElementById("app");
  if(!loaded){ document.getElementById("app-header").style.display="none"; app.innerHTML = `<div class="empty-state">Loading console…</div>`; return; }
  if(!authedUserId){ renderLogin(app); return; }

  document.getElementById("app-header").style.display = "block";
  document.getElementById("header-logo").src = EDS_LOGO_DATA_URI;
  app.classList.remove("no-pad");
  renderTabs();
  if(!hasAccess(activeTab)){
    app.innerHTML = `<div class="access-denied"><div class="glyph" style="font-size:26px;">🔒</div><p>${escapeHtml(currentUser().name)} doesn't have access to this section.</p></div>`;
    return;
  }
  if(activeTab==="dashboard") return renderDashboard(app);
  if(activeTab==="products") return renderProducts(app);
  if(activeTab==="orders") return renderNewSale(app);
  if(activeTab==="approvals") return renderApprovals(app);
  if(activeTab==="manualorders") return renderManualOrders(app);
  if(activeTab==="payments") return renderPayments(app);
  if(activeTab==="delivery") return renderDelivery(app);
  if(activeTab==="saleslog") return renderSalesLog(app);
  if(activeTab==="invoices") return renderInvoices(app);
  if(activeTab==="manualsales") return renderManualSalesDashboard(app);
  if(activeTab==="stock") return renderStock(app);
  if(activeTab==="settings") return renderSettings(app);
  if(activeTab==="users") return renderUsers(app);
}

function greetingForNow(){
  const h = new Date().getHours();
  if(h < 12) return "Good Morning";
  if(h < 17) return "Good Afternoon";
  return "Good Evening";
}

let dashboardCarouselTimer = null;

function defaultMTDFilter(){
  const t = todayISO();
  return { from: t.slice(0,8)+"01", to: t, event:"" };
}
let dashboardFilter = defaultMTDFilter();


function renderDashboard(app){
  if(dashboardCarouselTimer){ clearInterval(dashboardCarouselTimer); dashboardCarouselTimer=null; }
  const allInvMap = invoiceList();

  // ---- date + event filter: restrict to invoices matching both ----
  const {from, to, event} = dashboardFilter;
  const invMap = new Map();
  allInvMap.forEach((rows,no)=>{
    const d = rows[0].date || "";
    if(from && d < from) return;
    if(to && d > to) return;
    if(event && (rows[0].event||"") !== event) return;
    invMap.set(no, rows);
  });
  const allowedInvoices = (from || to || event) ? new Set(invMap.keys()) : null;
  const filteredSales = allowedInvoices ? STATE.sales.filter(s=>allowedInvoices.has(s.invoiceNo)) : STATE.sales;

  const totalInvoices = invMap.size;
  let revenue = 0, outstanding = 0, paidInvoiceCount = 0;
  const methodTotals = {};
  invMap.forEach((rows,no)=>{
    const {grand} = invoiceSummary(rows);
    const allPaid = rows.every(r=>r.paymentStatus==="Paid");
    if(allPaid){
      revenue += grand; paidInvoiceCount++;
      const breakdown = paymentBreakdown(no, rows);
      if(breakdown.length){
        breakdown.forEach(b=>{ methodTotals[b.method] = (methodTotals[b.method]||0) + b.amount; });
      } else {
        methodTotals["Unspecified"] = (methodTotals["Unspecified"]||0) + grand;
      }
    } else {
      outstanding += grand;
    }
  });
  const avgOrderValue = paidInvoiceCount ? revenue/paidInvoiceCount : 0;

  const customerAgg = {};
  const salesRepAgg = {};
  invMap.forEach((rows,no)=>{
    if(!rows.every(r=>r.paymentStatus==="Paid")) return;
    const {grand} = invoiceSummary(rows);
    const h = rows[0];
    const cust = h.customer || "—";
    customerAgg[cust] = (customerAgg[cust]||0) + grand;
    if(h.salesMember){
      salesRepAgg[h.salesMember] = (salesRepAgg[h.salesMember]||0) + grand;
    }
  });
  const topCustomerEntry = Object.entries(customerAgg).sort((a,b)=>b[1]-a[1])[0];
  const topSalesRepEntry = Object.entries(salesRepAgg).sort((a,b)=>b[1]-a[1])[0];

  // Stock is a current-state snapshot — not meaningful to date-filter.
  const stock = stockRows();
  const outCount = stock.filter(s=>s.status==="OUT OF STOCK").length;
  const lowCount = stock.filter(s=>s.status==="LOW STOCK").length;

  const allOrders = paidOrders();
  const orders = allowedInvoices ? allOrders.filter(o=>allowedInvoices.has(o.invoiceNo)) : allOrders;
  const ordersPending = orders.filter(o=>o.status==="Pending").length;
  const ordersDelivered = orders.filter(o=>o.status==="Delivered").length;
  const deliveryRate = orders.length ? Math.round(100*ordersDelivered/orders.length) : 0;

  const productAgg = {};
  const categoryAgg = {};
  const supplierAgg = {};
  filteredSales.filter(s=>s.paymentStatus==="Paid").forEach(s=>{
    explodeLineForAnalytics(s).forEach(item=>{
      if(!productAgg[item.name]) productAgg[item.name] = {qty:0, revenue:0};
      productAgg[item.name].qty += item.qty;
      productAgg[item.name].revenue += item.revenue;

      const cp = productByName[item.name];
      const cat = (cp && cp.category) ? cp.category : "Uncategorized";
      const sup = (cp && cp.supplier) ? cp.supplier : "Unspecified";
      if(!categoryAgg[cat]) categoryAgg[cat] = {qty:0, revenue:0};
      categoryAgg[cat].qty += item.qty;
      categoryAgg[cat].revenue += item.revenue;
      if(!supplierAgg[sup]) supplierAgg[sup] = {qty:0, revenue:0};
      supplierAgg[sup].qty += item.qty;
      supplierAgg[sup].revenue += item.revenue;
    });
  });
  const topProducts = Object.entries(productAgg).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,5);
  const categoryRows = Object.entries(categoryAgg).sort((a,b)=>b[1].revenue-a[1].revenue);
  const supplierRows = Object.entries(supplierAgg).sort((a,b)=>b[1].revenue-a[1].revenue);
  const distinctProductsSold = Object.keys(productAgg).length;
  const totalQtySold = Object.values(productAgg).reduce((a,p)=>a+p.qty,0);

  const dateTotals = {};
  invMap.forEach(rows=>{
    const allPaid = rows.every(r=>r.paymentStatus==="Paid");
    if(!allPaid) return;
    const {grand} = invoiceSummary(rows);
    const d = rows[0].date || "—";
    dateTotals[d] = (dateTotals[d]||0) + grand;
  });
  const trend = Object.entries(dateTotals).sort((a,b)=> a[0]<b[0]?-1:1).slice(-10);
  const trendMax = Math.max(1, ...trend.map(t=>t[1]));

  const recent = [...invMap.entries()].slice(-5).reverse();

  const svcCadence = avgOrderCadence(allowedInvoices);
  const svcOrderToPayment = avgOrderToPayment(allowedInvoices);
  const svcPaymentToDelivery = avgPaymentToDelivery(allowedInvoices);
  const svcDays = dailyCycleStats(allowedInvoices);
  const svcFullCycle = avgFullCycle(allowedInvoices);

  const todayStr = todayISO();
  const monthStartStr = todayStr.slice(0,8)+"01";
  const isPreset = (f,t) => dashboardFilter.from===f && dashboardFilter.to===t;
  const presetActive = {
    today: isPreset(todayStr, todayStr),
    mtd: isPreset(monthStartStr, todayStr),
    d7: isPreset(shiftISODate(todayStr,-6), todayStr),
    d30: isPreset(shiftISODate(todayStr,-29), todayStr),
    all: !dashboardFilter.from && !dashboardFilter.to,
  };
  const rangeLabel = [(from||to) ? `${from||"…"} → ${to||"…"}` : "All time", event || null].filter(Boolean).join(" · ");

  const heroSlides = [
    { icon:"👋", text:`${greetingForNow()}, ${escapeHtml(currentUser().name)}.` },
    { icon:"🦷", text:`Hi, I'm Hamdy, your EDS Assistant.` },
    { icon:"📋", text:`This is a brief on ${escapeHtml(rangeLabel)}'s achievements.` },
  ];
  if(totalInvoices>0){
    heroSlides.push({ icon:"💰", text:`We've brought in ${fmtEGP(revenue)} in revenue across ${paidInvoiceCount} paid invoice${paidInvoiceCount===1?"":"s"}.` });
    heroSlides.push({ icon:"🧾", text:`${totalInvoices} invoice${totalInvoices===1?"":"s"} created so far, with ${fmtEGP(outstanding)} still outstanding.` });
    heroSlides.push({ icon:"⚖️", text:`Average order value stands at ${fmtEGP(avgOrderValue)}.` });
    if(topProducts.length) heroSlides.push({ icon:"🏆", text:`Our top product is ${escapeHtml(topProducts[0][0])}, generating ${fmtEGP(topProducts[0][1].revenue)}.` });
    if(topCustomerEntry) heroSlides.push({ icon:"👤", text:`Our top customer is ${escapeHtml(topCustomerEntry[0])}, with ${fmtEGP(topCustomerEntry[1])} in orders.` });
    if(categoryRows.length) heroSlides.push({ icon:"🗂️", text:`The leading category is ${escapeHtml(categoryRows[0][0])}.` });
    if(supplierRows.length) heroSlides.push({ icon:"🚚", text:`Our top supplier is ${escapeHtml(supplierRows[0][0])}.` });
    if(topSalesRepEntry) heroSlides.push({ icon:"🧑‍💼", text:`Top sales rep is ${escapeHtml(topSalesRepEntry[0])}, with ${fmtEGP(topSalesRepEntry[1])} closed.` });
  } else {
    heroSlides.push({ icon:"💤", text:`No paid orders recorded for ${escapeHtml(rangeLabel)}.` });
  }
  heroSlides.push({ icon:"🎉", text:"That's everything for now — keep up the great work, team!" });

  app.innerHTML = `
    <section style="margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <h2 class="section-title" style="margin:0;">Dashboard</h2>
        <span class="badge tint">${escapeHtml(rangeLabel)}</span>
      </div>

      <div class="news-hero" style="margin-bottom:18px;">
        <div class="hero-avatar-wrap"><div class="hero-avatar">${DENTIST_AVATAR_SVG}</div></div>
        <div class="hero-slide-wrap">
          <div class="hero-slide-label">Hamdy · EDS Assistant</div>
          <div id="hero-slide"></div>
          <div class="hero-dots" id="hero-dots"></div>
        </div>
      </div>

      <div class="toolbar" style="margin-bottom:0;">
        <div class="field"><label class="field-label">From</label><input type="date" id="dash-from" value="${escapeHtml(from)}"></div>
        <div class="field"><label class="field-label">To</label><input type="date" id="dash-to" value="${escapeHtml(to)}"></div>
        <div class="field">
          <label class="field-label">Event</label>
          <select id="dash-event">
            <option value="" ${!event?"selected":""}>All events</option>
            ${STATE.events.map(ev=>`<option value="${escapeHtml(ev.name)}" ${event===ev.name?"selected":""}>${escapeHtml(ev.name)}</option>`).join("")}
          </select>
        </div>
        <div class="pill-toggle" style="align-self:end;">
          <button data-preset="today" class="${presetActive.today?'active':''}">Today</button>
          <button data-preset="mtd" class="${presetActive.mtd?'active':''}">MTD</button>
          <button data-preset="d7" class="${presetActive.d7?'active':''}">7d</button>
          <button data-preset="d30" class="${presetActive.d30?'active':''}">30d</button>
          <button data-preset="all" class="${presetActive.all?'active':''}">All</button>
        </div>
      </div>
    </section>

    <section style="margin-bottom:26px;">
      <div class="grid cols-4">
        <div class="card stat"><div class="label">Invoices</div><div class="value">${totalInvoices}</div><div class="note">unique invoice numbers</div></div>
        <div class="card stat"><div class="label">Revenue (Paid)</div><div class="value">${fmtEGP(revenue)}</div><div class="note">${paidInvoiceCount} fully paid invoices</div></div>
        <div class="card stat"><div class="label">Outstanding</div><div class="value warn">${fmtEGP(outstanding)}</div><div class="note">unpaid / partially unpaid</div></div>
        <div class="card stat"><div class="label">Avg Order Value</div><div class="value">${fmtEGP(avgOrderValue)}</div><div class="note">per paid invoice</div></div>
      </div>
      <div class="grid cols-4" style="margin-top:14px;">
        <div class="card stat"><div class="label">Orders Awaiting Delivery</div><div class="value ${ordersPending>0?'warn':''}">${ordersPending}</div><div class="note">paid, not yet delivered</div></div>

          ${recent.length? recent.map(([no,rows])=>{
            const {grand} = invoiceSummary(rows);
            const paid = rows.every(r=>r.paymentStatus==="Paid");
            return `<tr><td class="mono">${escapeHtml(no)}</td><td>${escapeHtml(rows[0].customer)}</td><td class="mono">${escapeHtml(rows[0].date)}</td><td><span class="badge ${paid?'ok':'warn'}">${paid?'Paid':'Unpaid'}</span></td><td class="num">${fmtEGP(grand)}</td></tr>`;

          </tbody>
        </table>
      </div>
    </section>
  `;

  document.getElementById("dash-from").addEventListener("change", e=>{ dashboardFilter.from = e.target.value; renderDashboard(app); });
  document.getElementById("dash-to").addEventListener("change", e=>{ dashboardFilter.to = e.target.value; renderDashboard(app); });
  document.getElementById("dash-event").addEventListener("change", e=>{ dashboardFilter.event = e.target.value; renderDashboard(app); });
  app.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click", ()=>{
    const preset = b.dataset.preset;
    const keepEvent = dashboardFilter.event;
    if(preset==="today") dashboardFilter = {from:todayStr, to:todayStr, event:keepEvent};
    else if(preset==="mtd") dashboardFilter = {from:monthStartStr, to:todayStr, event:keepEvent};
    else if(preset==="d7") dashboardFilter = {from:shiftISODate(todayStr,-6), to:todayStr, event:keepEvent};
    else if(preset==="d30") dashboardFilter = {from:shiftISODate(todayStr,-29), to:todayStr, event:keepEvent};
    else dashboardFilter = {from:"", to:"", event:keepEvent};
    renderDashboard(app);
  }));

  let heroIdx = 0;
  const heroSlideEl = document.getElementById("hero-slide");
  const heroDots = document.getElementById("hero-dots");
  heroDots.innerHTML = heroSlides.map((_,i)=>`<span data-dot="${i}" class="${i===0?'active':''}"></span>`).join("");
  function drawHero(){
    if(!document.body.contains(heroSlideEl)){ clearInterval(dashboardCarouselTimer); dashboardCarouselTimer=null; return; }
    const s = heroSlides[heroIdx];
    heroSlideEl.innerHTML = `<div class="hero-slide"><div class="hs-icon">${s.icon}</div><div class="hs-text">${s.text}</div></div>`;
    heroDots.querySelectorAll("span").forEach((d,i)=>d.classList.toggle("active", i===heroIdx));
  }
  heroDots.querySelectorAll("[data-dot]").forEach(d=>d.addEventListener("click", ()=>{
    heroIdx = Number(d.dataset.dot); drawHero();
  }));
  drawHero();
  dashboardCarouselTimer = setInterval(()=>{ heroIdx = (heroIdx+1) % heroSlides.length; drawHero(); }, 3800);
}

function wireProductForms(app){
  // --- Add product ---
  const bindNP = (id,key,isNum)=>document.getElementById(id).addEventListener("input", e=>{
    newProductForm[key] = e.target.value;
  });
  bindNP("np-name","name"); bindNP("np-price","price"); bindNP("np-opening","opening"); bindNP("np-max","maxPerCustomer");
  document.getElementById("np-category").addEventListener("change", e=>{ newProductForm.category = e.target.value; });
  document.getElementById("np-supplier").addEventListener("change", e=>{ newProductForm.supplier = e.target.value; });
  document.getElementById("np-save").addEventListener("click", async ()=>{
    const name = newProductForm.name.trim();
    const price = Number(newProductForm.price);
    if(!name){ showAlert("Notice", "Give the product a name."); return; }
    if(isNaN(price) || price < 0){ showAlert("Notice", "Enter a valid price (0 or more)."); return; }
    if(productByName[name]){ showAlert("Notice", "A product with that name already exists."); return; }
    STATE.products.push({
      id: nextProductId(), name, type:"Individual", price,
      opening: Number(newProductForm.opening)||0,
      maxPerCustomer: newProductForm.maxPerCustomer!=="" ? Number(newProductForm.maxPerCustomer) : null,
      category: newProductForm.category || "", supplier: newProductForm.supplier || "",
      active:"Yes", components:[]
    });
    rebuildIndexes();
    await saveState();
    newProductForm = freshProductForm();
    renderProducts(app);
  });

  // --- Add bundle ---
  const bindNB = (id,key)=>document.getElementById(id).addEventListener("input", e=>{ newBundleForm[key]=e.target.value; });
  bindNB("nb-name","name"); bindNB("nb-price","price"); bindNB("nb-max","maxPerCustomer");
  document.getElementById("nb-category").addEventListener("change", e=>{ newBundleForm.category = e.target.value; });
  document.getElementById("nb-supplier").addEventListener("change", e=>{ newBundleForm.supplier = e.target.value; });

  const compWrap = document.getElementById("nb-components");
  const individualOptions = (selected)=> PRODUCTS.filter(p=>p.type==="Individual").map(p=>
    `<option value="${escapeHtml(p.name)}" ${p.name===selected?"selected":""}>${escapeHtml(p.name)}</option>`
  ).join("");
  compWrap.innerHTML = newBundleForm.components.map(c=>`
    <div class="lineitem-row" style="grid-template-columns:2.4fr .9fr 32px;" data-comp="${c.rowId}">
      <select class="nb-comp-product"><option value="">Select product…</option>${individualOptions(c.productName)}</select>
      <input type="number" min="0" step="1" class="nb-comp-qty" value="${c.qty}" title="Quantity per bundle — can be 0">
      <button class="remove-x" data-remove-comp="${c.rowId}" title="Remove component">&times;</button>
    </div>
  `).join("");
  compWrap.querySelectorAll("[data-comp]").forEach(row=>{
    const rowId = row.dataset.comp;
    const c = newBundleForm.components.find(x=>x.rowId===rowId);
    row.querySelector(".nb-comp-product").addEventListener("change", e=>{ c.productName=e.target.value; });
    row.querySelector(".nb-comp-qty").addEventListener("input", e=>{ c.qty=e.target.value; });
    const rm = row.querySelector("[data-remove-comp]");
    rm.addEventListener("click", ()=>{
      newBundleForm.components = newBundleForm.components.filter(x=>x.rowId!==rowId);
      if(newBundleForm.components.length===0) newBundleForm.components.push(freshBundleComponentRow());
      renderProducts(app);
    });
  });
  document.getElementById("nb-add-component").addEventListener("click", ()=>{
    newBundleForm.components.push(freshBundleComponentRow());
    renderProducts(app);
  });

  document.getElementById("nb-save").addEventListener("click", async ()=>{
    const name = newBundleForm.name.trim();
    const price = Number(newBundleForm.price);
    const comps = newBundleForm.components
      .filter(c=>c.productName)
      .map(c=>({ name:c.productName, qty: Number(c.qty)||0 })); // 0 is a valid, intentional quantity
    if(!name){ showAlert("Notice", "Give the bundle a name."); return; }
    if(isNaN(price) || price < 0){ showAlert("Notice", "Enter a valid price (0 or more)."); return; }
    if(productByName[name]){ showAlert("Notice", "A product with that name already exists."); return; }
    if(comps.length===0){ showAlert("Notice", "Add at least one component (its quantity can be 0)."); return; }
    STATE.products.push({
      id: nextProductId(), name, type:"Bundle", price, opening:0,
      maxPerCustomer: newBundleForm.maxPerCustomer!=="" ? Number(newBundleForm.maxPerCustomer) : null,
      category: newBundleForm.category || "", supplier: newBundleForm.supplier || "",
      active:"Yes", components: comps
    });
    rebuildIndexes();
    await saveState();
    newBundleForm = freshBundleForm();
    renderProducts(app);
  });

  // --- Delete product/bundle ---
  app.querySelectorAll("[data-del-product]").forEach(b=>b.addEventListener("click", async ()=>{
    const id = b.dataset.delProduct;
    const p = STATE.products.find(x=>x.id===id);
    if(!p) return;
    if(!(await showConfirm("Remove product", `Remove "${p.name}" from the catalog? This won't change past orders, but it will disappear from new-order and bundle-builder pickers.`))) return;
    STATE.products = STATE.products.filter(x=>x.id!==id);
    rebuildIndexes();
    await saveState();
    renderProducts(app);
  }));
}

/* ============================= NEW SALE ============================= */
let newSaleForm = null;
function freshLine(){ return {id:uid(), productName:"", qty:1, discountPct:0}; }
function freshNewSale(){
  const ev = currentEvent();
  return {
    invoiceNo: nextInvoiceNo(),
    date: todayISO(),
    customer: "",
    userId: "",
    event: ev ? ev.name : "",
    salesMember: "",
    notes: "",
    lines: [freshLine()]
  };
}

function productOptions(selected){
  const groupInd = PRODUCTS.filter(p=>p.type==="Individual");
  const groupBun = PRODUCTS.filter(p=>p.type==="Bundle");
  const opt = (p)=>`<option value="${escapeHtml(p.name)}" ${p.name===selected?"selected":""}>${escapeHtml(p.name)} — ${fmtEGP(p.price)}</option>`;
  return `<option value="">Select product…</option>
    <optgroup label="Individual">${groupInd.map(opt).join("")}</optgroup>
    <optgroup label="Bundles">${groupBun.map(opt).join("")}</optgroup>`;
}

            </select>
          </div>
          ${f.event===MANUAL_SALES_EVENT ? `
            <div class="field">
              <label class="field-label">Sales Member</label>
              <select id="f-salesmember">
                <option value="">${STATE.salesMembers.length?"Select sales member…":"Add sales members in Settings"}</option>
                ${STATE.salesMembers.map(m=>`<option value="${escapeHtml(m)}" ${f.salesMember===m?"selected":""}>${escapeHtml(m)}</option>`).join("")}
              </select>
            </div>
          ` : ""}
        </div>
        ${f.event===MANUAL_SALES_EVENT ? `<p style="margin:8px 0 0;font-size:12px;color:var(--warn);">This order will need approval before it moves to Payments.</p>` : ""}
        <div class="field"><label class="field-label">Notes</label><textarea id="f-notes" rows="2" placeholder="Optional notes">${escapeHtml(f.notes)}</textarea></div>

      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <h3 style="margin:0;font-size:13.5px;">Line items</h3>
          <button class="btn ghost sm" id="add-line">+ Add line</button>
        </div>
        <div class="lineitem-row" style="border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;">
          <div class="li-label">Product</div><div class="li-label">Qty</div><div class="li-label">Disc %</div><div class="li-label">Unit Price</div><div class="li-label">Disc Amt</div><div class="li-label">Line Total</div><div></div>
        </div>

      </div>

      <div class="card" style="max-width:340px;margin-left:auto;">
        <div class="idoc-totals" style="width:100%;margin:0;">
          <div class="trow"><span>Subtotal</span><span class="mono" id="totals-subtotal">${fmtEGP(subtotal)}</span></div>
          <div class="trow"><span>Total discount</span><span class="mono" id="totals-discount">−${fmtEGP(discount)}</span></div>
          <div class="trow grand"><span>Grand total</span><span class="mono" id="totals-grand">${fmtEGP(grand)}</span></div>

      <div style="margin-top:16px;display:flex;gap:10px;">
        <button class="btn primary" id="save-invoice">Save order</button>
        <button class="btn ghost" id="reset-invoice">Reset form</button>
      </div>

  const rowsEl = document.getElementById("line-rows");
