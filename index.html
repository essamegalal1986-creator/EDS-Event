function ExportDataTab({ orders, deliveries, catalog, restocks, spins, subscriptions, eventName }) {
  const [exporting, setExporting] = useState(false);

  const handleExport = () => {
    setExporting(true);
    try {
      const wb = XLSX.utils.book_new();

      const ordersSheet = orders.slice().sort((a, b) => a.seq - b.seq).map((o) => {
        const del = deliveries[o.id];
        return {
          "Order ID": o.id,
          "Date": o.date,
          "Created By": o.createdBy || "",
          "User ID": o.userId,
          "User Type": o.userType,
          "New/Old User": o.attendeeStatus || "",
          "University": o.university || "",
          "Customer": o.customer,
          "Items (as entered)": o.items.map((it) => `${it.name} x${it.qty}`).join("; "),
          "Items (products, bundles expanded)": expandOrderItems(o.items, catalog).map((it) => `${it.name} x${it.qty}`).join("; "),
          "Subtotal (before discount)": o.subtotal != null ? o.subtotal : o.total,
          "Discount %": o.discountPercent || 0,
          "Discount Amount": o.discountAmount || 0,
          "Total": o.total,
          "Payment Status": o.paymentStatus,
          "Payment Method": o.payment || "",
          "Paid By": o.paidBy || "",
          "Paid At": o.paidAt ? new Date(o.paidAt).toLocaleString() : "",
          "Delivery Status": del ? "Delivered" : "Pending",
          "Delivered By": del ? del.deliveredBy : "",
          "Delivered At": del ? new Date(del.deliveredAt).toLocaleString() : "",
        };
      });
      const wsOrders = XLSX.utils.json_to_sheet(ordersSheet);
      XLSX.utils.book_append_sheet(wb, wsOrders, "Orders");

      const catalogSheet = catalog.map((p) => ({
        "Product ID": p.id,
        "Name": p.name,
        "Type": p.type,
        "Price": p.price,
        "Max Per Customer (event-wide)": p.maxPerCustomer == null ? "Unlimited" : p.maxPerCustomer,
        "Starting Stock": p.type === "individual" ? p.stock : "",
        "Bundle Contents": isBundleLike(p.type) ? (p.components || []).map((c) => `${c.name} x${c.qty}`).join("; ") : "",
      }));
      const wsCatalog = XLSX.utils.json_to_sheet(catalogSheet);
      XLSX.utils.book_append_sheet(wb, wsCatalog, "Products");

      const stockSheet = computeStock(catalog, orders, restocks).map((r) => ({
        "Product": r.name, "Starting Stock": r.stock, "Restocked": r.restocked, "Total Stock": r.totalStock,
        "Sold Directly": r.direct, "Used in Bundles": r.bundleUsed, "Total Consumed": r.consumed,
        "Remaining": r.remaining, "Status": r.status,
      }));
      const wsStock = XLSX.utils.json_to_sheet(stockSheet);
      XLSX.utils.book_append_sheet(wb, wsStock, "Stock");

      const restockSheet = restocks.slice().sort((a, b) => a.addedAt - b.addedAt).map((r) => ({
        "Date": r.date, "Product": r.productName, "Quantity Added": r.qty, "Added By": r.addedBy,
        "Added At": new Date(r.addedAt).toLocaleString(),
      }));
      const wsRestock = XLSX.utils.json_to_sheet(restockSheet);
      XLSX.utils.book_append_sheet(wb, wsRestock, "Restock Log");

      const spinSheet = Object.values(spins).sort((a, b) => b.confirmedAt - a.confirmedAt).map((s) => ({
        "Source": s.source === "subscription" ? "Subscription" : "Order",
        "Order ID / Subscription ID": s.sourceId || s.orderId || "",
        "User ID": s.userId || "", "Customer": s.customerName,
        "Order Total": s.totalSpend != null ? s.totalSpend : "",
        "Confirmed By": s.confirmedBy, "Confirmed At": new Date(s.confirmedAt).toLocaleString(),
      }));
      const wsSpin = XLSX.utils.json_to_sheet(spinSheet);
      XLSX.utils.book_append_sheet(wb, wsSpin, "Spin the Wheel");

      const subsSheet = subscriptions.slice().sort((a, b) => a.subscribedAt - b.subscribedAt).map((s) => ({
        "User ID": s.userId, "Name": s.name, "User Type": s.userType, "New/Old": s.attendeeStatus,
        "Phone": s.phone, "University": s.university || "", "Subscribed By": s.subscribedBy,
        "Subscribed At": new Date(s.subscribedAt).toLocaleString(),
      }));
      const wsSubs = XLSX.utils.json_to_sheet(subsSheet);
      XLSX.utils.book_append_sheet(wb, wsSubs, "Subscriptions");

      const fname = `${(eventName || "Event").replace(/[^a-z0-9]+/gi, "_")}_Sales_Data.xlsx`;
      XLSX.writeFile(wb, fname);
    } finally {
      setExporting(false);
    }
  };

  return (
    <Card style={{ maxWidth: 480, margin: "0 auto", textAlign: "center" }}>
      <FileSpreadsheet size={30} color="#7A5A02" style={{ marginBottom: 10 }} />
      <SectionTitle icon={null}>Export all data</SectionTitle>
      <p style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", lineHeight: 1.6 }}>
        Downloads an Excel file with every order (payment and delivery status included), the product catalog, current stock levels, Spin the Wheel records, and platform subscribers — {orders.length} orders, {subscriptions.length} subscribers.
      </p>
      <button onClick={handleExport} disabled={exporting} style={{ ...btnPrimary, display: "inline-flex", alignItems: "center", gap: 8, opacity: exporting ? 0.6 : 1 }}>
        <Download size={16} /> {exporting ? "Preparing…" : "Download Excel file"}
      </button>
    </Card>
  );
}

function EditableCell({ value, onSave, width = 80, type = "number", allowEmpty = false, emptyPlaceholder = "∞" }) {
  const [draft, setDraft] = useState(value == null ? "" : value);
  const [savedFlash, setSavedFlash] = useState(false);
  useEffect(() => { setDraft(value == null ? "" : value); }, [value]);

  const commit = () => {
    let parsed;
    if (allowEmpty && String(draft).trim() === "") {
      parsed = null;
    } else {
      parsed = type === "number" ? (parseFloat(draft) || 0) : draft;
    }
    if (parsed !== value) {
      onSave(parsed);
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 1200);
    }
  };

  return (
    <div style={{ position: "relative", display: "inline-block" }}>
      <input
        type={type}
        value={draft}
        placeholder={allowEmpty ? emptyPlaceholder : undefined}
        onChange={(e) => setDraft(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
        style={{ ...inputStyle, width, padding: "5px 8px", borderColor: savedFlash ? "#1F7A4D" : undefined }}
      />
      {savedFlash && <CheckCircle2 size={13} color="#1F7A4D" style={{ position: "absolute", right: -18, top: 9 }} />}
    </div>
  );
}

function SpinWheelTab({ orders, subscriptions, spins, onSpinConfirmed, currentUser }) {
  const [threshold, setThreshold] = useState(5000);
  const [thresholdLoaded, setThresholdLoaded] = useState(false);
  const [savingThreshold, setSavingThreshold] = useState(false);
  const [spinLimit, setSpinLimit] = useState(0);
  const [spinLimitLoaded, setSpinLimitLoaded] = useState(false);
  const [savingSpinLimit, setSavingSpinLimit] = useState(false);
  const [confirmingId, setConfirmingId] = useState(null);
  const [searchUserId, setSearchUserId] = useState("");

  useEffect(() => {
    getShared("spinThreshold", 5000).then((v) => { setThreshold(v); setThresholdLoaded(true); });
    getShared("spinLimit", 0).then((v) => { setSpinLimit(v); setSpinLimitLoaded(true); });
  }, []);

  const saveThreshold = async (v) => {
    setThreshold(v);
    setSavingThreshold(true);
    await setShared("spinThreshold", v);
    setSavingThreshold(false);
  };

  const saveSpinLimit = async (v) => {
    setSpinLimit(v);
    setSavingSpinLimit(true);
    await setShared("spinLimit", v);
    setSavingSpinLimit(false);
  };

  // How many spins each user (by User ID) has already had confirmed —
  // counts BOTH order-based and subscription-based spins together.
  const spinsByUser = useMemo(() => {
    const map = {};
    Object.values(spins).forEach((s) => {
      const key = (s.userId || "").trim().toLowerCase();
      if (!key) return;
      map[key] = (map[key] || 0) + 1;
    });
    return map;
  }, [spins]);

  const spinCountForUser = (userId) => spinsByUser[(userId || "").trim().toLowerCase()] || 0;
  const userLimitReached = (userId) => spinLimit > 0 && spinCountForUser(userId) >= spinLimit;

  // Every individual PAID order above the threshold is its own spin opportunity —
  // a customer with two qualifying orders gets two spins, up to the per-user limit.
  const eligibleOrders = useMemo(
    () => orders.filter((o) => o.paymentStatus === "Paid" && o.total > threshold).sort((a, b) => b.seq - a.seq),
    [orders, threshold]
  );

  const filteredOrders = useMemo(() => {
    const q = searchUserId.trim().toLowerCase();
    if (!q) return eligibleOrders;
    return eligibleOrders.filter((o) => (o.userId || "").trim().toLowerCase() === q);
  }, [eligibleOrders, searchUserId]);

  // A User ID that has already received a subscription-based spin (via ANY of
  // their subscription records) can never be shown as pending again — this is
  // what stops re-adding the same person as a subscriber from granting a
  // second free spin.
  const usersWithSubscriptionSpin = useMemo(() => {
    const set = new Set();
    Object.values(spins).forEach((s) => {
      if (s.source === "subscription" && s.userId) set.add(s.userId.trim().toLowerCase());
    });
    return set;
  }, [spins]);

  // Subscribers who haven't used their one free "subscribed" spin yet — deduped
  // by User ID, so even if the same person has multiple subscription records,
  // only one pending row (and one possible spin) ever shows for them.
  const pendingSubscriptionSpins = useMemo(() => {
    const seenUsers = new Set();
    return subscriptions
      .filter((s) => {
        const key = (s.userId || "").trim().toLowerCase();
        if (!key) return false;
        if (usersWithSubscriptionSpin.has(key)) return false;
        if (seenUsers.has(key)) return false;
        seenUsers.add(key);
        return true;
      })
      .sort((a, b) => b.subscribedAt - a.subscribedAt);
  }, [subscriptions, usersWithSubscriptionSpin]);
  const filteredSubscriptions = useMemo(() => {
    const q = searchUserId.trim().toLowerCase();
    if (!q) return pendingSubscriptionSpins;
    return pendingSubscriptionSpins.filter((s) => (s.userId || "").trim().toLowerCase() === q);
  }, [pendingSubscriptionSpins, searchUserId]);

  const matchCount = filteredOrders.length;
  const searchedUserSpinCount = searchUserId.trim() ? spinCountForUser(searchUserId) : null;

  // Full history of confirmed spins (both sources), filtered to the searched User ID if any.
  const spinHistory = useMemo(() => {
    const all = Object.values(spins).sort((a, b) => b.confirmedAt - a.confirmedAt);
    const q = searchUserId.trim().toLowerCase();
    if (!q) return all;
    return all.filter((s) => (s.userId || "").trim().toLowerCase() === q);
  }, [spins, searchUserId]);

  const handleConfirmOrder = async (order) => {
    if (userLimitReached(order.userId)) return;
    setConfirmingId(order.id);
    const spin = {
      sourceId: order.id,
      source: "order",
      customerName: order.customer,
      userId: order.userId,
      totalSpend: order.total,
      confirmedBy: currentUser.name,
      confirmedAt: Date.now(),
    };
    const ok = await setShared(`spin:${order.id}`, spin);
    setConfirmingId(null);
    if (ok) onSpinConfirmed(spin);
  };

  const handleConfirmSubscription = async (sub) => {
    if (userLimitReached(sub.userId)) return;
    setConfirmingId(sub.id);
    const spin = {
      sourceId: sub.id,
      source: "subscription",
      customerName: sub.name,
      userId: sub.userId,
      totalSpend: null,
      confirmedBy: currentUser.name,
      confirmedAt: Date.now(),
    };
    const ok = await setShared(`spin:${sub.id}`, spin);
    setConfirmingId(null);
    if (ok) onSpinConfirmed(spin);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card>
        <SectionTitle icon={Gift}>Spin the Wheel — eligibility</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", marginBottom: 12 }}>
          Every individual paid order above the threshold earns one spin, and every new platform subscription earns one spin — up to the per-user limit below (which counts both together).
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <label style={labelStyle}>Eligibility threshold (per order)</label>
            <input type="number" value={threshold} disabled={!thresholdLoaded}
              onChange={(e) => saveThreshold(parseFloat(e.target.value) || 0)}
              style={{ ...inputStyle, width: 140 }} />
            {savingThreshold && <span style={{ fontSize: 12, color: "#8A8D86" }}>Saving…</span>}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <label style={labelStyle}>Spin limit per user (0 = unlimited)</label>
            <input type="number" min="0" value={spinLimit} disabled={!spinLimitLoaded}
              onChange={(e) => saveSpinLimit(parseInt(e.target.value) || 0)}
              style={{ ...inputStyle, width: 140 }} />
            {savingSpinLimit && <span style={{ fontSize: 12, color: "#8A8D86" }}>Saving…</span>}
          </div>
        </div>
      </Card>

      <Card>
        <SectionTitle icon={Search}>Search by User ID</SectionTitle>
        <input value={searchUserId} onChange={(e) => setSearchUserId(e.target.value)} placeholder="U-101" style={{ ...inputStyle, maxWidth: 260 }} />
        {searchUserId.trim() && (
          <div style={{ marginTop: 8, fontFamily: "Inter", fontSize: 13, color: "#172033" }}>
            <div><strong>{matchCount}</strong> qualifying order{matchCount === 1 ? "" : "s"} above {fmtMoney(threshold)} for User ID <strong>{searchUserId.trim()}</strong></div>
            {spinLimit > 0 && (
              <div style={{ marginTop: 4 }}>
                <Badge tone={userLimitReached(searchUserId) ? "danger" : "neutral"}>{searchedUserSpinCount} / {spinLimit} spins used</Badge>
              </div>
            )}
          </div>
        )}
      </Card>

      <Card>
        <SectionTitle icon={Gift}>{searchUserId.trim() ? "Matching orders" : "All eligible orders"} ({filteredOrders.length})</SectionTitle>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "Inter", fontSize: 13 }}>
            <thead>
              <tr style={{ textAlign: "left", color: "#8A8D86", fontSize: 11, fontWeight: 700 }}>
                <th style={{ padding: "6px 8px" }}>ORDER ID</th><th>DATE</th><th>USER ID</th><th>CUSTOMER</th><th>TOTAL</th><th>SPIN STATUS</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filteredOrders.length === 0 && (
                <tr><td colSpan={7} style={{ padding: 12, color: "#8A8D86" }}>No qualifying orders{searchUserId.trim() ? " for that User ID" : ""} yet.</td></tr>
              )}
              {filteredOrders.map((o) => {
                const spin = spins[o.id];
                return (
                  <tr key={o.id} style={{ borderTop: "1px solid #EEF0EE" }}>
                    <td style={{ padding: "8px", fontFamily: "JetBrains Mono", fontWeight: 700, fontSize: 12 }}>{o.id}</td>
                    <td style={{ padding: "8px" }}>{o.date}</td>
                    <td style={{ padding: "8px" }}>{o.userId}</td>
                    <td style={{ padding: "8px", color: "#172033", fontWeight: 600 }}>{o.customer}</td>
                    <td style={{ padding: "8px", fontWeight: 700 }}>{fmtMoney(o.total)}</td>
                    <td style={{ padding: "8px" }}>
                      {spin ? (
                        <Badge tone="success">Spun — {spin.confirmedBy}, {fmtTime(spin.confirmedAt)}</Badge>
                      ) : (
                        <Badge tone="warning">Not yet spun</Badge>
                      )}
                    </td>
                    <td style={{ padding: "8px" }}>
                      {!spin && (
                        userLimitReached(o.userId) ? (
                          <span style={{ fontSize: 12, color: "#B4231D", fontFamily: "Inter" }}>User's limit reached</span>
                        ) : (
                          <button onClick={() => handleConfirmOrder(o)} disabled={confirmingId === o.id} style={{ ...btnPrimary, padding: "6px 12px", fontSize: 12.5, opacity: confirmingId === o.id ? 0.6 : 1 }}>
                            {confirmingId === o.id ? "Saving…" : "Confirm spin done"}
                          </button>
                        )
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      <Card>
        <SectionTitle icon={Gift}>{searchUserId.trim() ? "Matching subscription spins" : "Subscription spins pending"} ({filteredSubscriptions.length})</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#5B5E56", marginBottom: 10 }}>
          Every new subscriber earns one spin, whether or not they've bought anything.
        </div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "Inter", fontSize: 13 }}>
            <thead>
              <tr style={{ textAlign: "left", color: "#8A8D86", fontSize: 11, fontWeight: 700 }}>
                <th style={{ padding: "6px 8px" }}>USER ID</th><th>NAME</th><th>TYPE</th><th>PHONE</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filteredSubscriptions.length === 0 && (
                <tr><td colSpan={5} style={{ padding: 12, color: "#8A8D86" }}>No pending subscription spins{searchUserId.trim() ? " for that User ID" : ""}.</td></tr>
              )}
              {filteredSubscriptions.map((s) => (
                <tr key={s.id} style={{ borderTop: "1px solid #EEF0EE" }}>
                  <td style={{ padding: "8px" }}>{s.userId}</td>
                  <td style={{ padding: "8px", color: "#172033", fontWeight: 600 }}>{s.name}</td>
                  <td style={{ padding: "8px" }}>{s.userType}</td>
                  <td style={{ padding: "8px" }}>{s.phone}</td>
                  <td style={{ padding: "8px" }}>
                    {userLimitReached(s.userId) ? (
                      <span style={{ fontSize: 12, color: "#B4231D", fontFamily: "Inter" }}>User's limit reached</span>
                    ) : (
                      <button onClick={() => handleConfirmSubscription(s)} disabled={confirmingId === s.id} style={{ ...btnPrimary, padding: "6px 12px", fontSize: 12.5, opacity: confirmingId === s.id ? 0.6 : 1 }}>
                        {confirmingId === s.id ? "Saving…" : "Confirm spin done"}
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      <Card>
        <SectionTitle icon={ClipboardList}>{searchUserId.trim() ? "Spin history for this User ID" : "Full spin history"} ({spinHistory.length})</SectionTitle>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "Inter", fontSize: 13 }}>
            <thead>
              <tr style={{ textAlign: "left", color: "#8A8D86", fontSize: 11, fontWeight: 700 }}>
                <th style={{ padding: "6px 8px" }}>USER ID</th><th>NAME</th><th>SOURCE</th><th>ORDER/SUB ID</th><th>AMOUNT</th><th>CONFIRMED BY</th><th>CONFIRMED AT</th>
              </tr>
            </thead>
            <tbody>
              {spinHistory.length === 0 && (
                <tr><td colSpan={7} style={{ padding: 12, color: "#8A8D86" }}>No spins recorded{searchUserId.trim() ? " for that User ID" : " yet"}.</td></tr>
              )}
              {spinHistory.map((s, i) => (
                <tr key={s.sourceId || s.orderId || i} style={{ borderTop: "1px solid #EEF0EE" }}>
                  <td style={{ padding: "8px" }}>{s.userId}</td>
                  <td style={{ padding: "8px", color: "#172033", fontWeight: 600 }}>{s.customerName}</td>
                  <td style={{ padding: "8px" }}><Badge tone={s.source === "subscription" ? "accent" : "neutral"}>{s.source === "subscription" ? "Subscription" : "Order"}</Badge></td>
                  <td style={{ padding: "8px", fontFamily: "JetBrains Mono", fontSize: 12 }}>{s.sourceId || s.orderId}</td>
                  <td style={{ padding: "8px" }}>{s.totalSpend != null ? fmtMoney(s.totalSpend) : "—"}</td>
                  <td style={{ padding: "8px" }}>{s.confirmedBy}</td>
                  <td style={{ padding: "8px", color: "#8A8D86" }}>{fmtTime(s.confirmedAt)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function ProductsTab({ catalog, onCatalogChange, orders, restocks, onRestockAdded, currentUser }) {
  const [name, setName] = useState("");
  const [type, setType] = useState("individual");
  const [price, setPrice] = useState("");
  const [stock, setStock] = useState("");
  const [maxPerCustomer, setMaxPerCustomer] = useState("");
  const [components, setComponents] = useState([]);
  const [compName, setCompName] = useState("");
  const [compQty, setCompQty] = useState(1);
  const [saving, setSaving] = useState(false);
  const [formError, setFormError] = useState("");
  const [syncError, setSyncError] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [restockProduct, setRestockProduct] = useState("");
  const [restockQty, setRestockQty] = useState("");
  const [restockDate, setRestockDate] = useState(new Date().toISOString().slice(0, 10));
  const [restockError, setRestockError] = useState("");
  const [restockSaving, setRestockSaving] = useState(false);
  const [restockLogOpen, setRestockLogOpen] = useState(false);
  const [loadingStarter, setLoadingStarter] = useState(false);
  const [starterMessage, setStarterMessage] = useState("");
  const [starterPreview, setStarterPreview] = useState(null); // array of products pending confirmation, or null
  const [savingStarterList, setSavingStarterList] = useState(false);
  const [starterListSavedMessage, setStarterListSavedMessage] = useState("");
  const [savingAll, setSavingAll] = useState(false);
  const [starterListStatus, setStarterListStatus] = useState(null); // { count, isCustom } | null while loading
  const [bulkText, setBulkText] = useState("");
  const [bulkPreview, setBulkPreview] = useState(null); // { toAdd, skipped, failed } | null
  const [bulkAdding, setBulkAdding] = useState(false);
  const [bulkMessage, setBulkMessage] = useState("");

  useEffect(() => {
    getShared("starterCatalog", null).then((saved) => {
      if (saved && saved.length) setStarterListStatus({ count: saved.length, isCustom: true });
      else setStarterListStatus({ count: DEFAULT_CATALOG.length, isCustom: false });
    });
  }, []);
  const [savedAllMessage, setSavedAllMessage] = useState("");

  const individualOptions = catalog.filter((p) => p.type === "individual");
  const stockRows = useMemo(() => computeStock(catalog, orders, restocks), [catalog, orders, restocks]);

  // Step 1: fetch the saved starter list and show exactly what would be added —
  // nothing is written to the catalog yet.
  const handlePreviewStarterLoad = async () => {
    setLoadingStarter(true);
    setStarterMessage("");
    setStarterPreview(null);
    const starterList = await getShared("starterCatalog", DEFAULT_CATALOG);
    const existingNames = new Set(catalog.map((p) => p.name.trim().toLowerCase()));
    const toAdd = (starterList || []).filter((p) => !existingNames.has(p.name.trim().toLowerCase()));
    setLoadingStarter(false);
    if (toAdd.length === 0) {
      setStarterMessage("All starter products are already in your catalog — nothing to add.");
      return;
    }
    setStarterPreview(toAdd);
  };

  // Step 2: only runs after the person reviews the preview list and clicks Confirm.
  // This only ever ADDS the previewed items — everything already in your catalog,
  // including anything you added yourself, is left exactly as-is.
  const handleConfirmStarterLoad = async () => {
    if (!starterPreview) return;
    setLoadingStarter(true);
    const toAdd = starterPreview.map((p) => ({ ...p, id: genId("P") }));
    const next = [...catalog, ...toAdd];
    onCatalogChange(next);
    const ok = await setShared("catalog", next);
    setLoadingStarter(false);
    setStarterPreview(null);
    setStarterMessage(ok ? `Added ${toAdd.length} product${toAdd.length === 1 ? "" : "s"}.` : "Added locally, but couldn't sync — check your connection and tap Refresh.");
  };

  const handleSaveAsStarterList = async () => {
    setSavingStarterList(true);
    setStarterListSavedMessage("");
    const snapshot = catalog; // exactly what's currently in your catalog, including every product and bundle you've added
    const ok = await setShared("starterCatalog", snapshot);
    setSavingStarterList(false);
    if (ok) setStarterListStatus({ count: snapshot.length, isCustom: true });
    setStarterListSavedMessage(ok
      ? `Saved all ${snapshot.length} product${snapshot.length === 1 ? "" : "s"} (including anything you added) as the starter list.`
      : "Couldn't save — check your connection and try again.");
  };

  // Step 1: parse the pasted text and show exactly what would happen — nothing
  // is written to the catalog yet.
  const handlePreviewBulkImport = () => {
    setBulkMessage("");
    setBulkPreview(null);
    if (!bulkText.trim()) { setBulkMessage("Paste a list first — one product per line, name and price separated by a tab (as copied from a spreadsheet)."); return; }
    const { parsed, failed } = parseBulkProductList(bulkText);
    const existingNames = new Set(catalog.map((p) => p.name.trim().toLowerCase()));
    const toAdd = [];
    const skipped = [];
    const seenInBatch = new Set();
    parsed.forEach((p) => {
      const key = p.name.trim().toLowerCase();
      if (existingNames.has(key) || seenInBatch.has(key)) { skipped.push(p.name); return; }
      seenInBatch.add(key);
      toAdd.push(p);
    });
    setBulkPreview({ toAdd, skipped, failed });
  };

  // Step 2: only runs after reviewing the preview and clicking Confirm.
  const handleConfirmBulkImport = async () => {
    if (!bulkPreview || bulkPreview.toAdd.length === 0) return;
    setBulkAdding(true);
    const newProducts = bulkPreview.toAdd.map((p) => ({
      id: genId("P"), name: p.name, type: "individual", price: p.price, stock: 0, maxPerCustomer: null,
    }));
    const next = [...catalog, ...newProducts];
    onCatalogChange(next);
    const ok = await setShared("catalog", next);
    setBulkAdding(false);
    setBulkPreview(null);
    setBulkText("");
    setBulkMessage(ok
      ? `Added ${newProducts.length} product${newProducts.length === 1 ? "" : "s"}. They're set as Individual with 0 starting stock — set real stock and any per-customer limit on the Products table below.`
      : "Added locally, but couldn't sync — check your connection and tap Refresh.");
  };

  const handleAddRestock = async () => {
    setRestockError("");
    if (!restockProduct) { setRestockError("Choose a product."); return; }
    const qty = parseInt(restockQty);
    if (!qty || qty <= 0) { setRestockError("Enter a quantity greater than 0."); return; }
    setRestockSaving(true);
    const restock = {
      id: genId("RS"),
      productName: restockProduct,
      qty,
      date: restockDate || new Date().toISOString().slice(0, 10),
      addedBy: currentUser.name,
      addedAt: Date.now(),
    };
    const ok = await setShared(`restock:${restock.id}`, restock);
    setRestockSaving(false);
    if (!ok) { setRestockError("Couldn't save — check your connection and try again."); return; }
    onRestockAdded(restock);
    setRestockQty("");
  };


  const saveCatalog = async (next) => {
    onCatalogChange(next); // optimistic — show it immediately, don't wait on the network
    setSaving(true);
    const ok = await setShared("catalog", next);
    setSaving(false);
    setSyncError(ok ? "" : "Saved on this device, but couldn't sync to the shared file. Check your connection, then tap Refresh at the top.");
    return ok;
  };

  const handleSaveAllChanges = async () => {
    setSavingAll(true);
    setSavedAllMessage("");
    const ok = await setShared("catalog", catalog);
    setSavingAll(false);
    setSavedAllMessage(ok ? "All changes saved." : "Couldn't save — check your connection and try again.");
  };

  const addComponent = () => {
    if (!compName || compQty < 1) return;
    setComponents((prev) => [...prev, { name: compName, qty: compQty }]);
    setCompName(""); setCompQty(1);
  };

  const handleAddProduct = () => {
    setFormError("");
    if (!name.trim()) { setFormError("Enter a product name."); return; }
    if (type !== "spinwin" && (!price || parseFloat(price) <= 0)) { setFormError("Enter a price greater than 0."); return; }
    if (type === "spinwin" && price !== "" && parseFloat(price) < 0) { setFormError("Price can't be negative."); return; }
    if (isBundleLike(type) && components.length === 0) { setFormError(`Add at least one component to the ${type === "spinwin" ? "Spin & Win item" : "bundle"}.`); return; }
    const product = {
      id: genId("P"),
      name: name.trim(),
      type,
      price: parseFloat(price) || 0,
      maxPerCustomer: maxPerCustomer.trim() === "" ? null : (parseInt(maxPerCustomer) || 0),
      ...(type === "individual" ? { stock: parseInt(stock) || 0 } : { components }),
    };
    saveCatalog([...catalog, product]);
    setName(""); setPrice(""); setStock(""); setMaxPerCustomer(""); setComponents([]);
  };

  const updateField = (id, field, value) => {
    saveCatalog(catalog.map((p) => (p.id === id ? { ...p, [field]: value } : p)));
  };
  const removeProduct = (id) => {
    saveCatalog(catalog.filter((p) => p.id !== id));
    setConfirmDeleteId(null);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card style={{ background: "#E4F5EC", border: "1px solid #B9E3CB" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <div>
            <SectionTitle icon={CheckCircle2}>Save changes</SectionTitle>
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#5B5E56" }}>
              Edits save automatically as you make them — click this any time to confirm everything's synced.
            </div>
          </div>
          <button onClick={handleSaveAllChanges} disabled={savingAll} style={{ ...btnPrimary, opacity: savingAll ? 0.6 : 1 }}>
            {savingAll ? "Saving…" : "Save all changes"}
          </button>
        </div>
        {savedAllMessage && <div style={{ marginTop: 8, fontSize: 13, color: "#1F7A4D", fontFamily: "Inter", fontWeight: 600 }}>{savedAllMessage}</div>}
      </Card>

      <Card style={{ background: "#FBEAC8", border: "1px solid #EFB93A" }}>
        <SectionTitle icon={PackagePlus}>Starter product list</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", marginBottom: 6 }}>
          Shows you exactly what would be added before anything changes. It only adds products that aren't already in your catalog by name — nothing already there is ever removed or overwritten.
        </div>
        <div style={{ fontFamily: "Inter", fontSize: 12, marginBottom: 10 }}>
          {starterListStatus === null ? (
            <span style={{ color: "#8A8D86" }}>Checking saved starter list…</span>
          ) : starterListStatus.isCustom ? (
            <span style={{ color: "#1F7A4D", fontWeight: 600 }}>✓ Custom starter list saved — {starterListStatus.count} product{starterListStatus.count === 1 ? "" : "s"}</span>
          ) : (
            <span style={{ color: "#A15C00" }}>No custom starter list saved yet — using the built-in default ({starterListStatus.count} products). Save yours below any time.</span>
          )}
        </div>
        {!starterPreview ? (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={handlePreviewStarterLoad} disabled={loadingStarter} style={{ ...btnPrimary, opacity: loadingStarter ? 0.6 : 1 }}>
              {loadingStarter ? "Checking…" : "Check starter list"}
            </button>
            <button onClick={handleSaveAsStarterList} disabled={savingStarterList} style={{ ...btnSecondary, opacity: savingStarterList ? 0.6 : 1 }}>
              {savingStarterList ? "Saving…" : "Save current catalog as starter list"}
            </button>
          </div>
        ) : (
          <div>
            <label style={labelStyle}>These {starterPreview.length} product{starterPreview.length === 1 ? "" : "s"} will be added:</label>
            <div style={{ border: "1px solid #E1E4E2", borderRadius: 8, background: "#fff", maxHeight: 220, overflowY: "auto", marginBottom: 10 }}>
              {starterPreview.map((p, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "7px 10px", fontSize: 12.5, fontFamily: "Inter", borderTop: i ? "1px solid #F5F6F4" : "none" }}>
                  <span style={{ color: "#172033" }}>{p.name} <span style={{ color: "#8A8D86" }}>({p.type})</span></span>
                  <span style={{ fontWeight: 600, color: "#172033" }}>{fmtMoney(p.price)}</span>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={handleConfirmStarterLoad} disabled={loadingStarter} style={{ ...btnPrimary, opacity: loadingStarter ? 0.6 : 1 }}>
                {loadingStarter ? "Adding…" : `Confirm — add these ${starterPreview.length}`}
              </button>
              <button onClick={() => setStarterPreview(null)} style={btnSecondary}>Cancel</button>
            </div>
          </div>
        )}
        {starterMessage && <div style={{ marginTop: 8, fontSize: 13, color: "#172033", fontFamily: "Inter" }}>{starterMessage}</div>}
        {starterListSavedMessage && <div style={{ marginTop: 8, fontSize: 13, color: "#172033", fontFamily: "Inter" }}>{starterListSavedMessage}</div>}
      </Card>

      <Card>
        <SectionTitle icon={PackagePlus}>Bulk add products</SectionTitle>
        <div style={{ fontFamily: "Inter", fontSize: 13, color: "#5B5E56", marginBottom: 10 }}>
          Paste a list — one product per line, name and price separated by a tab (exactly how it copies out of Excel or a spreadsheet). Added as Individual items with 0 starting stock; skips anything already in your catalog by name.
        </div>
        {!bulkPreview ? (
          <div>
            <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)}
              placeholder={"Product Name\\t150\nAnother Product\\t275"}
              rows={6} style={{ ...inputStyle, fontFamily: "monospace", fontSize: 12.5, resize: "vertical" }} />
            <button onClick={handlePreviewBulkImport} style={{ ...btnPrimary, marginTop: 10 }}>Preview import</button>
          </div>
        ) : (
          <div>
            {bulkPreview.toAdd.length > 0 && (
              <>
                <label style={labelStyle}>These {bulkPreview.toAdd.length} product{bulkPreview.toAdd.length === 1 ? "" : "s"} will be added:</label>
                <div style={{ border: "1px solid #E1E4E2", borderRadius: 8, background: "#fff", maxHeight: 240, overflowY: "auto", marginBottom: 10 }}>
                  {bulkPreview.toAdd.map((p, i) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "7px 10px", fontSize: 12.5, fontFamily: "Inter", borderTop: i ? "1px solid #F5F6F4" : "none" }}>
                      <span style={{ color: "#172033" }}>{p.name}</span>
                      <span style={{ fontWeight: 600, color: "#172033" }}>{fmtMoney(p.price)}</span>
                    </div>
                  ))}
                </div>
              </>
            )}
            {bulkPreview.skipped.length > 0 && (
              <div style={{ fontSize: 12.5, color: "#A15C00", fontFamily: "Inter", marginBottom: 8 }}>
                Skipping {bulkPreview.skipped.length} already in your catalog: {bulkPreview.skipped.join(", ")}
              </div>
            )}
            {bulkPreview.failed.length > 0 && (
              <div style={{ fontSize: 12.5, color: "#B4231D", fontFamily: "Inter", marginBottom: 8 }}>
                Couldn't read {bulkPreview.failed.length} line{bulkPreview.failed.length === 1 ? "" : "s"} (missing a name or price): {bulkPreview.failed.join(" | ")}
              </div>
            )}
            <div style={{ display: "flex", gap: 8 }}>
              {bulkPreview.toAdd.length > 0 && (
                <button onClick={handleConfirmBulkImport} disabled={bulkAdding} style={{ ...btnPrimary, opacity: bulkAdding ? 0.6 : 1 }}>
                  {bulkAdding ? "Adding…" : `Confirm — add these ${bulkPreview.toAdd.length}`}
                </button>
              )}
              <button onClick={() => setBulkPreview(null)} style={btnSecondary}>Cancel</button>
            </div>
          </div>
        )}
        {bulkMessage && <div style={{ marginTop: 8, fontSize: 13, color: "#172033", fontFamily: "Inter" }}>{bulkMessage}</div>}
      </Card>

      <Card>
        <SectionTitle icon={PackagePlus}>Add a product or bundle</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr", gap: 10 }} className="responsive-grid-4">
          <div><label style={labelStyle}>Name</label><input value={name} onChange={(e) => setName(e.target.value)} style={inputStyle} placeholder="Event Hoodie" /></div>
          <div><label style={labelStyle}>Type</label>
            <select value={type} onChange={(e) => setType(e.target.value)} style={inputStyle}>
              <option value="individual">Individual</option><option value="bundle">Bundle</option><option value="spinwin">Spin & Win</option>
            </select>
          </div>
          <div><label style={labelStyle}>Price</label><input type="number" value={price} onChange={(e) => setPrice(e.target.value)} style={inputStyle} /></div>
          {type === "individual" ? (
            <div><label style={labelStyle}>Starting stock</label><input type="number" value={stock} onChange={(e) => setStock(e.target.value)} style={inputStyle} /></div>
          ) : <div />}
          <div><label style={labelStyle}>Max per customer (blank = ∞, 0 = not allowed)</label><input type="number" min="0" value={maxPerCustomer} onChange={(e) => setMaxPerCustomer(e.target.value)} style={inputStyle} placeholder="∞" /></div>
        </div>

        {isBundleLike(type) && (
          <div style={{ marginTop: 12 }}>
            <label style={labelStyle}>Components</label>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <select value={compName} onChange={(e) => setCompName(e.target.value)} style={{ ...inputStyle, flex: 1 }}>
                <option value="">Select an individual item…</option>
                {individualOptions.map((p) => <option key={p.id} value={p.name}>{p.name}</option>)}
              </select>
              <input type="number" min="1" value={compQty} onChange={(e) => setCompQty(parseInt(e.target.value) || 1)} style={{ ...inputStyle, width: 70 }} />
              <button onClick={addComponent} style={btnSecondary}><Plus size={14} /></button>
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {components.map((c, i) => (

          <div><label style={labelStyle}>Date</label><input type="date" value={restockDate} onChange={(e) => setRestockDate(e.target.value)} style={inputStyle} /></div>
          <button onClick={handleAddRestock} disabled={restockSaving} style={{ ...btnPrimary, opacity: restockSaving ? 0.6 : 1 }}>{restockSaving ? "Saving…" : "Add stock"}</button>
