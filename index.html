    return `
    <div class="lineitem-row" data-line="${l.id}">
      <select class="li-product">${productOptions(l.productName)}</select>
      <input type="number" min="1" class="li-qty" value="${l.qty}">
      <input type="number" min="0" max="100" class="li-discount" value="${l.discountPct}">
      <input type="text" class="mono li-unitprice" value="${fmtEGP(unitPrice)}" disabled>
      <input type="text" class="mono li-discamt" value="${fmtEGP(discountAmt)}" disabled>
      <input type="text" class="mono li-linetotal" value="${fmtEGP(lineTotal)}" disabled>
      <button class="remove-x" data-remove="${l.id}" title="Remove line">&times;</button>
    </div>`;
  }).join("");

  // field bindings
  const bind = (id,key)=>document.getElementById(id).addEventListener("input", e=>{ f[key]=e.target.value; });
  bind("f-invoiceNo","invoiceNo"); bind("f-date","date"); bind("f-customer","customer");
  bind("f-notes","notes");
  document.getElementById("f-event").addEventListener("change", async e=>{
    f.event = e.target.value;
    if(f.event === MANUAL_SALES_EVENT){
      const chosen = await showSelectPrompt(
        "Manual Sales order",
        "Which sales member is this order for? It will need approval before it moves to Payments.",
        STATE.salesMembers,
        STATE.salesMembers.length ? "Select sales member…" : "No sales members set up — add one in Settings"
      );
      f.salesMember = chosen || "";
    } else {
      f.salesMember = "";
    }
    render();
  });
  const smSel = document.getElementById("f-salesmember");
  if(smSel) smSel.addEventListener("change", e=>{ f.salesMember = e.target.value; });

  let newCustomerDraft = { role:"Other", university:"" };
  function refreshUserIdHint(){
    const hintEl = document.getElementById("userid-hint");
    const id = f.userId.trim();
    if(!id){ hintEl.innerHTML = ""; return; }
    const match = lookupCustomer(id);
    if(match){
      const roleText = match.role || "Other";
      const uniText = (roleText==="Student" && match.university) ? `, ${match.university}` : "";
      hintEl.innerHTML = `<span style="color:var(--ok);">&#10003; ${escapeHtml(match.name)} — ${escapeHtml(roleText)}${escapeHtml(uniText)}</span>`;
      return;
    }
    hintEl.innerHTML = `
      <div style="margin-top:4px;padding:8px;border:1px dashed var(--line);border-radius:7px;background:var(--surface-2);">
        <div style="color:var(--warn);font-weight:600;margin-bottom:6px;">New — not in directory</div>
        <div class="grid cols-2" style="gap:6px;">
          <select id="new-cust-role" style="font-size:11.5px;padding:5px 6px;">
            ${CUSTOMER_ROLES.map(r=>`<option value="${r}" ${newCustomerDraft.role===r?"selected":""}>${r}</option>`).join("")}
          </select>
          ${newCustomerDraft.role==="Student" ? `
            <select id="new-cust-uni" style="font-size:11.5px;padding:5px 6px;">
              <option value="">${STATE.universities.length?"Select university…":"No universities yet"}</option>
              ${STATE.universities.map(u=>`<option value="${escapeHtml(u)}" ${newCustomerDraft.university===u?"selected":""}>${escapeHtml(u)}</option>`).join("")}
            </select>
          ` : `<div></div>`}
        </div>
        <button class="btn ghost sm" id="save-new-customer" style="margin-top:6px;">Save to customer directory</button>
      </div>
    `;
    document.getElementById("new-cust-role").addEventListener("change", e=>{
      newCustomerDraft.role = e.target.value;
      if(newCustomerDraft.role!=="Student") newCustomerDraft.university = "";
      refreshUserIdHint();
    });
    const uniSel = document.getElementById("new-cust-uni");
    if(uniSel) uniSel.addEventListener("change", e=>{ newCustomerDraft.university = e.target.value; });
    document.getElementById("save-new-customer").addEventListener("click", async ()=>{
      const name = f.customer.trim();
      if(!name){ showAlert("Notice", "Enter the customer's name first."); return; }
      STATE.customers[id] = {
        name, phone:"",
        role: newCustomerDraft.role||"Other",
        university: newCustomerDraft.role==="Student" ? (newCustomerDraft.university||"") : ""
      };
      await saveState();
      newCustomerDraft = { role:"Other", university:"" };
      refreshUserIdHint();
    });
  }
  document.getElementById("f-userId").addEventListener("input", e=>{
    f.userId = e.target.value;
    const match = lookupCustomer(e.target.value);
    if(match){
      f.customer = match.name;
      const custInput = document.getElementById("f-customer");
      if(custInput) custInput.value = match.name;
    }
    refreshUserIdHint();
  });
  refreshUserIdHint();

  function lineDerived(line){
    const p = productByName[line.productName];
    const unitPrice = p?p.price:0;
    const {discountAmt, lineTotal} = lineCalc(line.qty, unitPrice, line.discountPct);
    return {unitPrice, discountAmt, lineTotal};
  }
  function patchRow(row, line){
    const {unitPrice, discountAmt, lineTotal} = lineDerived(line);
    row.querySelector(".li-unitprice").value = fmtEGP(unitPrice);
    row.querySelector(".li-discamt").value = fmtEGP(discountAmt);
    row.querySelector(".li-linetotal").value = fmtEGP(lineTotal);
    const p = productByName[line.productName];
    const qtyInput = row.querySelector(".li-qty");
    if(p && p.maxPerCustomer!=null){
      const prior = priorQtyForCustomerProduct(f.userId, f.customer, line.productName);
      const total = prior + (Number(line.qty)||0);
      if(total > p.maxPerCustomer){
        qtyInput.style.borderColor = "var(--danger)";
        qtyInput.style.background = "var(--danger-tint)";
        qtyInput.title = `Limit ${p.maxPerCustomer} per customer — already ordered ${prior} before this, plus ${line.qty} now = ${total} total. Will ask for the override password when saving.`;
      } else {
        qtyInput.style.borderColor = "";
        qtyInput.style.background = "";
        qtyInput.title = "";
      }
    } else {
      qtyInput.style.borderColor = "";
      qtyInput.style.background = "";
      qtyInput.title = "";
    }
  }
  function patchTotals(){
    const {subtotal, discount, grand} = invoiceSummary(f.lines.map(l=>{
      const p = productByName[l.productName];
      return {qty:l.qty, unitPrice:p?p.price:0, discountPct:l.discountPct};
    }));
    document.getElementById("totals-subtotal").textContent = fmtEGP(subtotal);
    document.getElementById("totals-discount").textContent = "−" + fmtEGP(discount);
    document.getElementById("totals-grand").textContent = fmtEGP(grand);
  }

  document.getElementById("add-line").addEventListener("click", ()=>{ f.lines.push(freshLine()); render(); });

  rowsEl.querySelectorAll(".lineitem-row").forEach(row=>{
    const id = row.dataset.line;
    const line = f.lines.find(l=>l.id===id);
    row.querySelector(".li-product").addEventListener("change", e=>{ line.productName=e.target.value; render(); });
    row.querySelector(".li-qty").addEventListener("input", e=>{ line.qty=e.target.value; patchRow(row,line); patchTotals(); });
    row.querySelector(".li-discount").addEventListener("input", e=>{ line.discountPct=e.target.value; patchRow(row,line); patchTotals(); });
    const rm = row.querySelector("[data-remove]");
    if(rm) rm.addEventListener("click", ()=>{
      f.lines = f.lines.filter(l=>l.id!==id);
      if(f.lines.length===0) f.lines.push(freshLine());
      render();
    });
    patchRow(row, line);
  });

  document.getElementById("reset-invoice").addEventListener("click", ()=>{ newSaleForm=freshNewSale(); render(); });

  document.getElementById("save-invoice").addEventListener("click", async ()=>{
    const validLines = f.lines.filter(l=>l.productName && Number(l.qty)>0);
    if(!f.invoiceNo || !f.customer || validLines.length===0){
      showAlert("Notice", "Please provide an invoice number, customer, and at least one product line.");
      return;
    }
    const isManualSales = f.event === MANUAL_SALES_EVENT;
    if(isManualSales && !f.salesMember){
      await showAlert("Sales member required", "Manual Sales orders need a sales member selected before they can be saved.");
      return;
    }
    const qtyInThisOrderByProduct = {};
    validLines.forEach(l=>{ qtyInThisOrderByProduct[l.productName] = (qtyInThisOrderByProduct[l.productName]||0) + Number(l.qty); });
    const limitBreaches = [];
    Object.keys(qtyInThisOrderByProduct).forEach(pname=>{
      const p = productByName[pname];
      if(!p || p.maxPerCustomer==null) return;
      const prior = priorQtyForCustomerProduct(f.userId, f.customer, pname);
      const thisOrderQty = qtyInThisOrderByProduct[pname];
      const total = prior + thisOrderQty;
      if(total > p.maxPerCustomer){
        limitBreaches.push({name:pname, limit:p.maxPerCustomer, prior, thisOrderQty, total});
      }
    });
    if(limitBreaches.length){
      const list = limitBreaches.map(b=>
        `${b.name}\n   Limit: ${b.limit} per customer\n   Already ordered before this: ${b.prior}\n   This order: ${b.thisOrderQty}\n   New total: ${b.total}`
      ).join("\n\n");
      if(!STATE.overridePassword){
        await showAlert("Order limit exceeded", `This order exceeds the per-customer limit on:\n\n${list}\n\nNo override password is set yet — set one in Settings → Order limits before this can be saved.`);
        return;
      }
      const pass = await showPasswordPrompt("Order limit exceeded", `This order exceeds the per-customer limit on:\n\n${list}\n\nEnter the override password to save it anyway:`);
      if(pass===null) return;
      if(pass !== STATE.overridePassword){
        await showAlert("Incorrect password", "Order not saved.");
        return;
      }
    }
    validLines.forEach(l=>{
      const p = productByName[l.productName];
      STATE.sales.push({
        id: uid(),
        invoiceNo: f.invoiceNo,
        date: f.date || todayISO(),
        customer: f.customer,
        userId: f.userId,
        event: f.event || "",
        salesMember: isManualSales ? f.salesMember : "",
        approvalStatus: isManualSales ? "Pending" : "Approved",
        paymentStatus: "Unpaid",
        paymentMethod: "",
        notes: f.notes,
        productName: l.productName,
        qty: Number(l.qty),
        unitPrice: p.price,
        discountPct: Number(l.discountPct)||0,
      });
    });
    if(!isManualSales){
      if(!STATE.timing[f.invoiceNo]) STATE.timing[f.invoiceNo] = {};
      if(!STATE.timing[f.invoiceNo].createdAt) STATE.timing[f.invoiceNo].createdAt = Date.now();
    } else {
      STATE.manualApprovals[f.invoiceNo] = { approvedBy: [], rejectedBy: null };
    }
    await saveState();
    const savedNo = f.invoiceNo;
    newSaleForm = freshNewSale();
    if(isManualSales){
      activeTab = "approvals";
      render();
      const approvers = requiredApprovers();
      const names = approvers.length ? approvers.map(u=>u.name).join(", ") : "no one yet — set approval rights in Users";
      await showAlert("Submitted for approval", `Order ${savedNo} needs confirmation from: ${names}.\n\nIt will only move to Manual Orders once every one of them has approved it — a single rejection blocks it.`);
    } else {
      activeTab = "payments";
      render();
    }
  });
}

/* ============================= APPROVALS ============================= */
let approvalsFilter = { status:"Pending", q:"" };
function renderApprovals(app){
  const canApprove = userCanApprove();
  const me = currentUser();
  const all = allManualSalesOrders();
  let orders = all;
  if(approvalsFilter.status!=="All"){
    orders = orders.filter(o=>o.approval===approvalsFilter.status);
  }
  if(approvalsFilter.q){
    const q = approvalsFilter.q.toLowerCase();
    orders = orders.filter(o=> o.no.toLowerCase().includes(q) || o.customer.toLowerCase().includes(q) || o.salesMember.toLowerCase().includes(q));
  }

  app.innerHTML = `
    <section>
      <h2 class="section-title">Approvals</h2>
      <p class="section-desc">A Manual Sales order needs <strong>every current approver</strong> to confirm before it's Accepted and moves to <strong>Manual Orders</strong> — a single rejection blocks it outright.${canApprove ? "" : " You have view-only access — ask an approver to action pending ones."}</p>
      <div class="grid cols-3" style="margin-bottom:18px;">
        <div class="card stat"><div class="label">Pending</div><div class="value ${all.filter(o=>o.approval==='Pending').length?'warn':''}">${all.filter(o=>o.approval==='Pending').length}</div></div>
        <div class="card stat"><div class="label">Accepted</div><div class="value">${all.filter(o=>o.approval==='Approved').length}</div></div>
        <div class="card stat"><div class="label">Rejected</div><div class="value">${all.filter(o=>o.approval==='Rejected').length}</div></div>
      </div>
      <div class="toolbar">
        <div class="field"><label class="field-label">Search</label><input id="appr-search" placeholder="Invoice, customer, sales member…" value="${escapeHtml(approvalsFilter.q)}"></div>
        <div class="pill-toggle" style="align-self:end;">
          ${["Pending","Approved","Rejected","All"].map(s=>`<button data-status="${s}" class="${approvalsFilter.status===s?'active':''}">${s==="Approved"?"Accepted":s}</button>`).join("")}
        </div>
      </div>
      <div id="appr-boxes"></div>
    </section>
  `;
  document.getElementById("appr-search").addEventListener("input", e=>{ approvalsFilter.q=e.target.value; renderApprovals(app); });
  app.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click", ()=>{ approvalsFilter.status=b.dataset.status; renderApprovals(app); }));

  const wrap = document.getElementById("appr-boxes");
  wrap.innerHTML = orders.length ? orders.map(o=>{
    const statusBadge = o.approval==="Pending" ? `<span class="badge warn">Pending</span>`
      : o.approval==="Rejected" ? `<span class="badge danger">Rejected</span>`
      : `<span class="badge ok">Accepted</span>`;
    const prog = o.approval==="Pending" ? manualApprovalState(o.no) : null;
    const alreadyConfirmed = prog && prog.approvedBy.some(u=>u.id===me.id);
    return `
    <div class="order-box" data-order="${escapeHtml(o.no)}">
      <div class="ob-head">
        <div>
          <div class="ob-title">${escapeHtml(o.no)}</div>
          <div class="ob-sub">${escapeHtml(o.customer)} &middot; ${escapeHtml(o.date)} &middot; ${fmtEGP(o.grand)}</div>
          <div class="ob-sub">Sales member: <strong>${escapeHtml(o.salesMember)}</strong></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          ${statusBadge}
          ${o.approval==="Pending" && canApprove && !alreadyConfirmed ? `
            <div style="display:flex;gap:8px;">
              <button class="btn danger-ghost sm" data-reject="${escapeHtml(o.no)}">Reject</button>
              <button class="btn primary sm" data-approve="${escapeHtml(o.no)}">Approve</button>
            </div>
          ` : (o.approval==="Pending" && canApprove && alreadyConfirmed ? `<span class="badge tint">You approved ✓</span>` : "") }
        </div>
      </div>
      <ul class="ob-items">
        ${o.rows.map(r=>`<li><span>${escapeHtml(r.productName)}</span><span class="qty">&times; ${r.qty}</span></li>`).join("")}
      </ul>
      ${prog ? `
        <div style="border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-size:12px;color:var(--ink-soft);">
          ${prog.approvedBy.length ? `<div>&#10003; Approved by: ${prog.approvedBy.map(u=>escapeHtml(u.name)).join(", ")}</div>` : ""}
          ${prog.pendingOn.length ? `<div>Waiting on: ${prog.pendingOn.map(u=>escapeHtml(u.name)).join(", ")}</div>` : ""}
        </div>
      ` : ""}
    </div>`;
  }).join("") : `<div class="empty-state"><div class="glyph">🧾</div>No manual orders match this filter.</div>`;

  if(canApprove){
    wrap.querySelectorAll("[data-approve]").forEach(b=>b.addEventListener("click", async ()=>{
      const no = b.dataset.approve;
      if(!STATE.manualApprovals[no]) STATE.manualApprovals[no] = {approvedBy:[], rejectedBy:null};
      const rec = STATE.manualApprovals[no];
      if(!rec.approvedBy.includes(me.id)) rec.approvedBy.push(me.id);
      // Admin isn't part of the required consensus, but if Admin approves it
      // counts as confirming for everyone — the order finalizes immediately.
      const finalize = me.id === ADMIN_ID || manualApprovalState(no).allApproved;
      if(finalize){
        const rows = invoiceList().get(no) || [];
        rows.forEach(r=> r.approvalStatus = "Approved");
      }
      await saveState();
      renderApprovals(app);
    }));
    wrap.querySelectorAll("[data-reject]").forEach(b=>b.addEventListener("click", async ()=>{
      const no = b.dataset.reject;
      if(!(await showConfirm("Reject order", `Reject order ${no}? It will be kept for the record but won't move to payment.`))) return;
      if(!STATE.manualApprovals[no]) STATE.manualApprovals[no] = {approvedBy:[], rejectedBy:null};
      STATE.manualApprovals[no].rejectedBy = me.id;
      const rows = invoiceList().get(no) || [];
      rows.forEach(r=> r.approvalStatus = "Rejected");
      await saveState();
      renderApprovals(app);
    }));
  }
}

/* ============================= MANUAL ORDERS ============================= */
let manualOrdersFilter = { status:"All", q:"" };
let manualPayDraft = {}; // invoiceNo -> [{id, method, amount}], in-progress split payment entry
function getManualPayDraft(no, grand){
  if(!manualPayDraft[no]) manualPayDraft[no] = [{id:uid(), method:"Cash", amount: Math.round(grand*100)/100}];
  return manualPayDraft[no];
}
function allManualSalesOrders(){
  const map = invoiceList();
  const orders = [];
  map.forEach((rows,no)=>{
    const h = rows[0];
    if(h.event !== MANUAL_SALES_EVENT) return;
    const {grand} = invoiceSummary(rows);
    const approval = h.approvalStatus || "Pending";
    const paid = rows.every(r=>r.paymentStatus==="Paid");
    const delivered = STATE.delivery[no] === "Delivered";
    orders.push({ no, rows, grand, customer:h.customer, date:h.date, salesMember:h.salesMember||"—", approval, paid, delivered });
  });
  return orders.sort((a,b)=> a.no < b.no ? 1 : -1);
}
function renderManualOrders(app){

  // approval itself happens on the separate Approvals page.
  let orders = allManualSalesOrders().filter(o=>o.approval==="Approved");

  else if(manualOrdersFilter.status==="AwaitingDelivery") orders = orders.filter(o=>o.paid && !o.delivered);

      </div>
      <div class="toolbar">

        <div class="pill-toggle" style="align-self:end;">

let paymentFilter = { q:"" };

function getPaymentDraft(no, grand){

}

}

/* ============================= CUSTOMER DIRECTORY ============================= */
const CUSTOMER_ROLES = ["Doctor","Student","Store","Other"];
function normalizeRole(v){
  const s = String(v||"").trim().toLowerCase();
  if(!s) return "Other";
  if(s.startsWith("doc")) return "Doctor";
  if(s.startsWith("stud")) return "Student";
  if(s.startsWith("store")||s.startsWith("pharm")||s.startsWith("shop")||s.startsWith("clinic")) return "Store";
  const exact = CUSTOMER_ROLES.find(r=>r.toLowerCase()===s);
  return exact || "Other";
}
function lookupCustomer(userId){
  if(!userId) return null;
  const key = String(userId).trim();
  if(!key) return null;
  return STATE.customers[key] || STATE.customers[key.toLowerCase()] || null;
}

/* Sums how much of a product this customer has already ordered across every
   past invoice — matched by User ID when given (most reliable), otherwise
   by customer name. Used so the max-qty/customer limit accounts for their
   full order history, not just the line currently being added. */
function priorQtyForCustomerProduct(userId, customerName, productName){
  const uid = String(userId||"").trim();
  const name = String(customerName||"").trim().toLowerCase();
  return STATE.sales
    .filter(s=>{
      if(s.productName !== productName) return false;
      if(uid) return String(s.userId||"").trim() === uid;
      if(!name) return false;
      return String(s.customer||"").trim().toLowerCase() === name;
    })
    .reduce((a,s)=>a+(Number(s.qty)||0), 0);
}
function findHeaderKey(rowObj, candidates){
  const keys = Object.keys(rowObj);
  for(const cand of candidates){
    const found = keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,"")===cand);
    if(found) return found;
  }
  return null;
}
function readWorkbookFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:"array"});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, {defval:""}));
      }catch(err){ reject(err); }
    };
    reader.onerror = ()=>reject(new Error("Couldn't read the file."));
    reader.readAsArrayBuffer(file);
  });
}
async function importCustomersFromExcel(file){
  if(!window.XLSX) throw new Error("Excel support didn't load — check your internet connection and try again.");
  const rows = await readWorkbookFile(file);
  if(!rows.length) throw new Error("That file looks empty.");
  const idKey = findHeaderKey(rows[0], ["userid","id","uid","customerid"]);
  const nameKey = findHeaderKey(rows[0], ["name","customername","username","fullname"]);
  const phoneKey = findHeaderKey(rows[0], ["phone","phonenumber","mobile","tel","telephone"]);
  const roleKey = findHeaderKey(rows[0], ["role","type","usertype","customertype","doctorstudent"]);
  const uniKey = findHeaderKey(rows[0], ["university","college","universityname","school"]);
  if(!idKey || !nameKey){
    throw new Error("Couldn't find a User ID column and a Name column. Expected headers like \"User ID\" and \"Name\".");
  }
  let added = 0, updated = 0, newUnis = 0;
  rows.forEach(r=>{
    const id = String(r[idKey]||"").trim();
    const name = String(r[nameKey]||"").trim();
    if(!id || !name) return;
    const phone = phoneKey ? String(r[phoneKey]||"").trim() : "";
    const role = roleKey ? normalizeRole(r[roleKey]) : "Other";
    const university = (role==="Student" && uniKey) ? String(r[uniKey]||"").trim() : "";
    if(university && !STATE.universities.some(u=>u.toLowerCase()===university.toLowerCase())){
      STATE.universities.push(university);
      newUnis++;
    }
    if(STATE.customers[id]) updated++; else added++;
    STATE.customers[id] = { name, phone, role, university };
  });
  await saveState();
  return {added, updated, total: added+updated, newUnis};
}

function exportSalesLogExcel(rows){
  if(!rows.length){ showAlert("Notice", "Nothing to export for this filter."); return; }
  const data = rows.map(s=>{
    const {discountAmt, lineTotal} = lineCalc(s.qty, s.unitPrice, s.discountPct);
    const breakdown = paymentBreakdown(s.invoiceNo, invoiceList().get(s.invoiceNo));
    return {
      "Invoice": s.invoiceNo,
      "Date": s.date,
      "Customer": s.customer,
      "User ID": s.userId,
      "Product": s.productName,
      "Qty": s.qty,
      "Unit Price": s.unitPrice,
      "Discount %": s.discountPct,
      "Discount Amount": Math.round(discountAmt*100)/100,
      "Line Total": Math.round(lineTotal*100)/100,
      "Payment Status": s.paymentStatus,
      "Payment Method": paymentMethodDisplay(s.invoiceNo, invoiceList().get(s.invoiceNo)),
      "Payment Breakdown": breakdown.map(b=>`${b.method}: ${b.amount}`).join("; "),
      "Delivery Status": deliveryStatusForInvoice(s.invoiceNo),
      "Notes": s.notes || ""
    };
  });
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  if(window.XLSX){
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sales Log");
    XLSX.writeFile(wb, `eds-sales-log-${stamp}.xlsx`);
  } else {
    // Offline fallback: plain CSV, which Excel opens natively too.
    const headers = Object.keys(data[0]);
    const escCsv = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const csv = [headers.map(escCsv).join(",")]
      .concat(data.map(row=>headers.map(h=>escCsv(row[h])).join(",")))
      .join("\r\n");
    const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `eds-sales-log-${stamp}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }
}

let saleLogFilter = { status:"All", q:"", event:"" };

    if(saleLogFilter.event && (s.event||"")!==saleLogFilter.event) return false;
    if(saleLogFilter.q){
      const q = saleLogFilter.q.toLowerCase();
      if(!(s.invoiceNo.toLowerCase().includes(q) || s.customer.toLowerCase().includes(q) || s.productName.toLowerCase().includes(q))) return false;
    }
    return true;
  }).slice().reverse();

  app.innerHTML = `
    <section>
      <h2 class="section-title">Sales log</h2>
      <p class="section-desc">Read-only audit trail of every order line. Edit payment in <strong>Payments</strong>, delivery in <strong>Delivery</strong>.</p>

        <div class="field"><label class="field-label">Payment status</label>
          <select id="log-status">

            <option value="" ${!saleLogFilter.event?"selected":""}>All events</option>

            ${STATE.events.map(ev=>`<option value="${escapeHtml(ev.name)}" ${saleLogFilter.event===ev.name?"selected":""}>${escapeHtml(ev.name)}</option>`).join("")}
          </select>
        </div>
        <button class="btn ghost" id="log-export" style="align-self:end;">Export to Excel</button>
        <button class="btn danger-ghost" id="log-delete-all" style="align-self:end;" ${rows.length===0?"disabled":""}>Delete all (${rows.length})</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Invoice</th><th>Date</th><th>Customer</th><th>Product</th><th class="num">Qty</th>
            <th class="num">Unit Price</th><th class="num">Line Total</th><th>Payment</th><th>Method</th><th>Delivery</th><th></th>
          </tr></thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
    </section>
  `;
  const body = document.getElementById("log-body");
  if(rows.length===0){
    body.innerHTML = `<tr><td colspan="11"><div class="empty-state"><div class="glyph">📄</div>No sales match this filter.</div></td></tr>`;
  } else {
    body.innerHTML = rows.map(s=>{
      const {lineTotal} = lineCalc(s.qty,s.unitPrice,s.discountPct);
      const delStatus = deliveryStatusForInvoice(s.invoiceNo);
      const delBadge = delStatus==="Delivered" ? "ok" : (delStatus==="Pending" ? "warn" : "muted");
      return `<tr>
        <td class="mono">${escapeHtml(s.invoiceNo)}</td>
        <td class="mono">${escapeHtml(s.date)}</td>
        <td>${escapeHtml(s.customer)}</td>
        <td>${escapeHtml(s.productName)}</td>
        <td class="num">${s.qty}</td>
        <td class="num">${fmtEGP(s.unitPrice)}</td>
        <td class="num">${fmtEGP(lineTotal)}</td>
        <td><span class="badge ${s.paymentStatus==='Paid'?'ok':'warn'}">${s.paymentStatus}</span></td>
        <td>${escapeHtml(paymentMethodDisplay(s.invoiceNo, invoiceList().get(s.invoiceNo)))}</td>
        <td><span class="badge ${delBadge}">${escapeHtml(delStatus)}</span></td>
        <td><button class="btn danger-ghost sm" data-del="${s.id}">Delete</button></td>
      </tr>`;
    }).join("");
  }

  document.getElementById("log-search").addEventListener("input", e=>{ saleLogFilter.q=e.target.value; renderSalesLog(app); });
  document.getElementById("log-status").addEventListener("change", e=>{ saleLogFilter.status=e.target.value; renderSalesLog(app); });
  document.getElementById("log-event").addEventListener("change", e=>{ saleLogFilter.event=e.target.value; renderSalesLog(app); });
  document.getElementById("log-export").addEventListener("click", ()=>exportSalesLogExcel(rows));
  document.getElementById("log-delete-all").addEventListener("click", async ()=>{
    if(rows.length===0) return;
    const label = [saleLogFilter.event||null, saleLogFilter.status!=="All"?saleLogFilter.status:null, saleLogFilter.q?`"${saleLogFilter.q}"`:null].filter(Boolean).join(" · ") || "all sales";
    if(!(await showConfirm("Delete all filtered rows", `Delete all ${rows.length} line item${rows.length===1?"":"s"} matching the current filter (${label})? This can't be undone.`, "Delete all"))) return;
    const idsToDelete = new Set(rows.map(r=>r.id));
    STATE.sales = STATE.sales.filter(x=>!idsToDelete.has(x.id));
    pruneOrphanedDelivery();
    await saveState();
    renderSalesLog(app);
  });
  body.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", async ()=>{

    STATE.sales = STATE.sales.filter(x=>x.id!==b.dataset.del);
    pruneOrphanedDelivery();
    await saveState(); renderSalesLog(app);
  }));
}

      list = list.filter(no=>{
        const rows = map.get(no) || [];

    }

  }
  app.innerHTML = `

      </div>
      <div id="invoice-doc"></div>
    </section>
  `;
  const sel = document.getElementById("invoice-select");
  const target = document.getElementById("invoice-doc");
  const openBtn = document.getElementById("open-invoice");
  const downloadBtn = document.getElementById("download-invoice");
  const printBtn = document.getElementById("print-invoice");
  const printReceiptDeliveryBtn = document.getElementById("print-receipt-delivery");
  const printReceiptCustomerBtn = document.getElementById("print-receipt-customer");

    const enabled = !!(no && map.get(no) && map.get(no).length);
    openBtn.disabled = !enabled; downloadBtn.disabled = !enabled; printBtn.disabled = !enabled;
    printReceiptDeliveryBtn.disabled = !enabled; printReceiptCustomerBtn.disabled = !enabled;
    if(!no){ target.innerHTML = `<div class="empty-state"><div class="glyph">🧾</div>Pick an invoice number above to view it.</div>`; return; }
    const rows = map.get(no) || [];
    if(rows.length===0){ target.innerHTML = `<div class="empty-state">No such invoice.</div>`; return; }
    target.innerHTML = invoiceDocMarkup(no, rows);
  }
  document.getElementById("invoice-userid-search").addEventListener("input", e=>{
    invoiceSearchUserId = e.target.value;
    populateSelect(selectedNo);
  });
  sel.addEventListener("change", e=>draw(e.target.value));
  printBtn.addEventListener("click", ()=>{ if(selectedNo) printInvoice(selectedNo); });
  printReceiptDeliveryBtn.addEventListener("click", ()=>{ if(selectedNo) printReceiptFor(selectedNo, "Delivery Copy"); });
  printReceiptCustomerBtn.addEventListener("click", ()=>{ if(selectedNo) printReceiptFor(selectedNo, "Customer Copy"); });
  downloadBtn.addEventListener("click", ()=>{
    if(!selectedNo) return;
    const html = buildInvoiceStandaloneHTML(selectedNo, map.get(selectedNo)||[]);
    downloadBlobHTML(`${selectedNo}.html`, html);
  });
  openBtn.addEventListener("click", ()=>{
    if(!selectedNo) return;
    const html = buildInvoiceStandaloneHTML(selectedNo, map.get(selectedNo)||[]);
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(()=>URL.revokeObjectURL(url), 15000);
  });
  populateSelect();
}

/* ============================= MANUAL SALES DASHBOARD ============================= */
function approvedManualSalesOrders(){
  const map = invoiceList();
  const orders = [];
  map.forEach((rows,no)=>{
    const h = rows[0];
    if(h.event !== MANUAL_SALES_EVENT) return;
    if(h.approvalStatus !== "Approved") return;
    orders.push({no, rows, h});
  });
  return orders;
}
let manualSalesFilter = { from:"", to:"", supplier:"", salesMember:"" };
function renderManualSalesDashboard(app){
  let orders = approvedManualSalesOrders();
  const {from, to, supplier, salesMember} = manualSalesFilter;
  if(from) orders = orders.filter(o=> (o.h.date||"") >= from);
  if(to) orders = orders.filter(o=> (o.h.date||"") <= to);
  if(salesMember) orders = orders.filter(o=> (o.h.salesMember||"") === salesMember);
  if(supplier) orders = orders.filter(o=> o.rows.some(r=>{
    const p = productByName[r.productName];
    return p && p.supplier === supplier;
  }));

  const customerAgg = {};
  const memberAgg = {};
  const monthAgg = {};
  const productAgg = {};
  const categoryAgg = {};
  const supplierAgg = {};
  let totalQty = 0;

  orders.forEach(({no, rows, h})=>{
    const {grand} = invoiceSummary(rows);
    const cust = h.customer || "—";
    const member = h.salesMember || "Unassigned";
    const d = h.date || "";
    const m = d.length>=7 ? d.slice(0,7) : "—";

    if(!customerAgg[cust]) customerAgg[cust] = {orders:0, revenue:0};
    customerAgg[cust].orders += 1;
    customerAgg[cust].revenue += grand;

    if(!memberAgg[member]) memberAgg[member] = {orders:0, revenue:0, qty:0};
    memberAgg[member].orders += 1;
    memberAgg[member].revenue += grand;

    if(!monthAgg[m]) monthAgg[m] = 0;
    monthAgg[m] += grand;

    rows.forEach(r=>{
      explodeLine(r).forEach(item=>{ totalQty += item.qty; memberAgg[member].qty += item.qty; });
      explodeLineForAnalytics(r).forEach(item=>{
        if(!productAgg[item.name]) productAgg[item.name] = {qty:0, revenue:0};
        productAgg[item.name].qty += item.qty;
        productAgg[item.name].revenue += item.revenue;
        const p = productByName[item.name];
        const cat = (p && p.category) ? p.category : "Uncategorized";
        const sup = (p && p.supplier) ? p.supplier : "Unspecified";
        if(!categoryAgg[cat]) categoryAgg[cat] = {qty:0, revenue:0};
        categoryAgg[cat].qty += item.qty;
        categoryAgg[cat].revenue += item.revenue;
        if(!supplierAgg[sup]) supplierAgg[sup] = {qty:0, revenue:0};
        supplierAgg[sup].qty += item.qty;
        supplierAgg[sup].revenue += item.revenue;
      });
    });
  });

  const topCustomers = Object.entries(customerAgg).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,5);
  const memberRows = Object.entries(memberAgg).sort((a,b)=>b[1].revenue-a[1].revenue);
  const trend = Object.entries(monthAgg).sort((a,b)=> a[0]<b[0]?-1:1).slice(-12);
  const trendMax = Math.max(1, ...trend.map(t=>t[1]));
  const totalRevenue = orders.reduce((a,{rows})=>a+invoiceSummary(rows).grand, 0);
  const avgOrderValue = orders.length ? totalRevenue/orders.length : 0;
  const topProducts = Object.entries(productAgg).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,5);
  const categoryRows = Object.entries(categoryAgg).sort((a,b)=>b[1].revenue-a[1].revenue);
  const supplierRows = Object.entries(supplierAgg).sort((a,b)=>b[1].revenue-a[1].revenue);

  app.innerHTML = `

      <h2 class="section-title">Manual Sales</h2>
      <p class="section-desc">Approved Manual Sales orders only — kept separate from the main Dashboard's service-level metrics.</p>
      <div class="toolbar">
        <div class="field"><label class="field-label">From</label><input type="date" id="ms-from" value="${escapeHtml(from)}"></div>
        <div class="field"><label class="field-label">To</label><input type="date" id="ms-to" value="${escapeHtml(to)}"></div>
        <div class="field">
          <label class="field-label">Supplier</label>
          <select id="ms-supplier">
            <option value="">All suppliers</option>
            ${STATE.suppliers.map(s=>`<option value="${escapeHtml(s)}" ${supplier===s?"selected":""}>${escapeHtml(s)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Sales member</label>
          <select id="ms-salesmember">
            <option value="">All sales members</option>
            ${STATE.salesMembers.map(m=>`<option value="${escapeHtml(m)}" ${salesMember===m?"selected":""}>${escapeHtml(m)}</option>`).join("")}
          </select>
        </div>
        <button class="btn ghost sm" id="ms-clear" style="align-self:end;">Clear filters</button>
      </div>
    </section>

    <section style="margin-bottom:26px;">
      <div class="grid cols-4">
        <div class="card stat"><div class="label">Orders</div><div class="value">${orders.length}</div></div>
        <div class="card stat"><div class="label">Total Quantity</div><div class="value">${totalQty}</div></div>
        <div class="card stat"><div class="label">Revenue</div><div class="value">${fmtEGP(totalRevenue)}</div></div>
        <div class="card stat"><div class="label">Avg Order Value</div><div class="value">${fmtEGP(avgOrderValue)}</div></div>
      </div>
    </section>

    <section class="grid cols-2" style="margin-bottom:26px;align-items:start;">
      <div>
        <h2 class="section-title">Top 5 customers</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Customer</th><th class="num">Orders</th><th class="num">Revenue</th></tr></thead>
            <tbody>
            ${topCustomers.length ? topCustomers.map(([name,agg])=>`
              <tr><td>${escapeHtml(name)}</td><td class="num mono">${agg.orders}</td><td class="num mono">${fmtEGP(agg.revenue)}</td></tr>
            `).join("") : `<tr><td colspan="3"><div class="empty-state"><div class="glyph">👤</div>No approved manual sales match this filter.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 12px;font-size:13.5px;">Revenue trend (by month)</h3>
        ${trend.length ? `
          <div class="chart-bars">
            ${trend.map(([m,v])=>`
              <div class="bar-col">
                <div class="bar-value">${Math.round(v)>=1000?Math.round(v/1000)+"k":Math.round(v)}</div>
                <div class="bar" style="height:${Math.max(4, Math.round(100*v/trendMax))}%;"></div>
                <div class="bar-label">${escapeHtml(monthLabel(m))}</div>
              </div>
            `).join("")}
          </div>
        ` : `<div class="empty-state"><div class="glyph">📈</div>No approved manual sales match this filter.</div>`}
      </div>
    </section>

    <section style="margin-bottom:26px;">
      <h2 class="section-title">Sales member achievement</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Sales Member</th><th class="num">Orders</th><th class="num">Units Sold</th><th class="num">Revenue</th></tr></thead>
          <tbody>
          ${memberRows.length ? memberRows.map(([name,agg])=>`
            <tr><td>${escapeHtml(name)}</td><td class="num mono">${agg.orders}</td><td class="num mono">${agg.qty}</td><td class="num mono">${fmtEGP(agg.revenue)}</td></tr>
          `).join("") : `<tr><td colspan="4"><div class="empty-state"><div class="glyph">🧑‍💼</div>No approved manual sales yet.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </section>

    <section style="margin-bottom:26px;">
      <h2 class="section-title">Top products</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Product</th><th class="num">Units Sold</th><th class="num">Revenue</th></tr></thead>
          <tbody>
          ${topProducts.length ? topProducts.map(([name,agg],i)=>`
            <tr><td class="mono">${i+1}</td><td>${escapeHtml(name)}</td><td class="num mono">${agg.qty}</td><td class="num mono">${fmtEGP(agg.revenue)}</td></tr>
          `).join("") : `<tr><td colspan="4"><div class="empty-state"><div class="glyph">📦</div>No approved manual sales match this filter.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </section>

    <section class="grid cols-2" style="margin-bottom:26px;align-items:start;">
      <div>
        <h2 class="section-title">By category</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Category</th><th class="num">Units Sold</th><th class="num">Revenue</th></tr></thead>
            <tbody>
            ${categoryRows.length ? categoryRows.map(([name,agg])=>`
              <tr><td>${escapeHtml(name)}</td><td class="num mono">${agg.qty}</td><td class="num mono">${fmtEGP(agg.revenue)}</td></tr>
            `).join("") : `<tr><td colspan="3"><div class="empty-state"><div class="glyph">🏷️</div>No approved manual sales match this filter.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
      <div>
        <h2 class="section-title">By supplier</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Supplier</th><th class="num">Units Sold</th><th class="num">Revenue</th></tr></thead>
            <tbody>
            ${supplierRows.length ? supplierRows.map(([name,agg])=>`
              <tr><td>${escapeHtml(name)}</td><td class="num mono">${agg.qty}</td><td class="num mono">${fmtEGP(agg.revenue)}</td></tr>
            `).join("") : `<tr><td colspan="3"><div class="empty-state"><div class="glyph">🚚</div>No approved manual sales match this filter.</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  `;

  document.getElementById("ms-from").addEventListener("change", e=>{ manualSalesFilter.from=e.target.value; renderManualSalesDashboard(app); });
  document.getElementById("ms-to").addEventListener("change", e=>{ manualSalesFilter.to=e.target.value; renderManualSalesDashboard(app); });
  document.getElementById("ms-supplier").addEventListener("change", e=>{ manualSalesFilter.supplier=e.target.value; renderManualSalesDashboard(app); });
  document.getElementById("ms-salesmember").addEventListener("change", e=>{ manualSalesFilter.salesMember=e.target.value; renderManualSalesDashboard(app); });
  document.getElementById("ms-clear").addEventListener("click", ()=>{ manualSalesFilter = {from:"",to:"",supplier:"",salesMember:""}; renderManualSalesDashboard(app); });
}

/* ============================= STOCK CONTROL ============================= */
function renderStock(app){
  const rows = stockRows();
  const out = rows.filter(r=>r.status==="OUT OF STOCK").length;
  const low = rows.filter(r=>r.status==="LOW STOCK").length;
  const ok = rows.filter(r=>r.status==="OK").length;

  app.innerHTML = `
    <section style="margin-bottom:22px;">
      <h2 class="section-title">Stock control</h2>
      <p class="section-desc">Current stock = Opening + Restock − (Direct sold + Bundle-consumed), counting only <strong>Paid</strong> sales. Edit Restock / Reorder Level inline.</p>
      <div class="grid cols-3">
        <div class="card stat"><div class="label">OK</div><div class="value">${ok}</div></div>
        <div class="card stat"><div class="label">Low stock</div><div class="value warn">${low}</div></div>
        <div class="card stat"><div class="label">Out of stock</div><div class="value danger">${out}</div></div>
      </div>
    </section>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th>Product</th><th class="num">Opening</th><th class="num">Restock</th>
          <th class="num">Direct Sold</th><th class="num">Bundle Used</th><th class="num">Total Used</th>
          <th class="num">Current</th><th class="num">Reorder Lvl</th><th>Status</th>
        </tr></thead>
        <tbody id="stock-body"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById("stock-body");
  body.innerHTML = rows.map(r=>{
    const badge = r.status==="OK"?"ok":(r.status==="LOW STOCK"?"warn":"danger");
    return `<tr>
      <td class="mono">${escapeHtml(r.id)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td class="num mono">${r.opening}</td>
      <td class="num"><input type="number" class="mono" style="width:76px;" data-restock="${escapeHtml(r.name)}" value="${r.restock}"></td>
      <td class="num mono">${r.directSold}</td>
      <td class="num mono">${r.bundleConsumed}</td>
      <td class="num mono">${r.totalUsed}</td>
      <td class="num mono" style="font-weight:700;">${r.current}</td>
      <td class="num"><input type="number" class="mono" style="width:70px;" data-reorder="${escapeHtml(r.name)}" value="${r.reorder}"></td>
      <td><span class="badge ${badge}">${r.status}</span></td>
    </tr>`;
  }).join("");
  body.querySelectorAll("[data-restock]").forEach(inp=>inp.addEventListener("change", async e=>{
    STATE.restock[e.target.dataset.restock] = Number(e.target.value)||0;
    await saveState(); renderStock(app);
  }));
  body.querySelectorAll("[data-reorder]").forEach(inp=>inp.addEventListener("change", async e=>{
    STATE.reorder[e.target.dataset.reorder] = Number(e.target.value)||0;
    await saveState(); renderStock(app);
  }));
}

        <button class="btn primary sm" id="save-override-password">Save</button>
        <span style="margin-left:10px;font-size:12px;color:${STATE.overridePassword?'var(--ok)':'var(--warn)'};">${STATE.overridePassword?'✓ Password set':'⚠ No password set'}</span>
      </div>
    </section>

    <section>

      <h2 class="section-title">Customer directory</h2>
      <p class="section-desc">Maps User ID &rarr; Name, plus whether they're a Doctor, Student, Store, or Other — and their university if they're a student. Once loaded, typing a matching User ID on the Orders page fills all of this in automatically.</p>
      <div class="grid cols-2" style="align-items:start;margin-bottom:20px;">
        <div class="card">
          <h3 style="margin:0 0 4px;font-size:13.5px;">Import from Excel</h3>
          <p style="margin:0 0 12px;color:var(--ink-soft);font-size:12px;">Needs a "User ID" column and a "Name" column. "Phone", "Role" (Doctor/Student/Store/Other), and "University" columns are optional — university is only kept for rows marked Student. Re-importing updates existing IDs and adds new ones — nothing is deleted.</p>
          <label class="btn ghost" for="cust-file" style="cursor:pointer;display:inline-block;">Choose Excel file…
            <input type="file" id="cust-file" accept=".xlsx,.xls" style="display:none;">
          </label>
          <div id="cust-import-msg" style="margin-top:10px;font-size:12.5px;"></div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:13.5px;">Add customer manually</h3>
          <div class="grid cols-2">
            <div class="field"><label class="field-label">User ID</label><input id="nc-userid" placeholder="e.g. u-104" value="${escapeHtml(newCustomerForm.userId)}"></div>
            <div class="field"><label class="field-label">Name</label><input id="nc-name" placeholder="Customer name" value="${escapeHtml(newCustomerForm.name)}"></div>
          </div>
          <div class="grid cols-2">
            <div class="field"><label class="field-label">Phone (optional)</label><input id="nc-phone" placeholder="Phone number" value="${escapeHtml(newCustomerForm.phone)}"></div>
            <div class="field"><label class="field-label">Type</label>
              <select id="nc-role">
                ${CUSTOMER_ROLES.map(r=>`<option value="${r}" ${newCustomerForm.role===r?"selected":""}>${r}</option>`).join("")}
              </select>
            </div>
          </div>
          ${newCustomerForm.role==="Student" ? `
            <div class="field"><label class="field-label">University</label>
              <select id="nc-university">
                <option value="">${STATE.universities.length?"Select university…":"Add universities above"}</option>
                ${STATE.universities.map(u=>`<option value="${escapeHtml(u)}" ${newCustomerForm.university===u?"selected":""}>${escapeHtml(u)}</option>`).join("")}
              </select>
            </div>
          ` : ""}
          <button class="btn primary sm" id="nc-save">Add / update customer</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="field"><label class="field-label">Search</label><input id="cust-search" placeholder="User ID or name…" value="${escapeHtml(customerSearch)}"></div>
        <div style="align-self:end;color:var(--ink-soft);font-size:12.5px;">${customerRows.length} of ${Object.keys(STATE.customers).length} customers</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>User ID</th><th>Name</th><th>Phone</th><th>Type</th><th>University</th><th></th></tr></thead>
          <tbody>
          ${customerRows.length ? customerRows.map(c=>`
            <tr>
              <td class="mono">${escapeHtml(c.id)}</td>
              <td>${escapeHtml(c.name)}</td>
              <td class="mono">${escapeHtml(c.phone)||"—"}</td>
              <td><span class="badge ${c.role==='Doctor'?'tint':c.role==='Student'?'accent':c.role==='Store'?'ok':'muted'}">${escapeHtml(c.role)}</span></td>
              <td>${c.role==='Student' ? (escapeHtml(c.university)||"—") : "—"}</td>
              <td><button class="btn danger-ghost sm" data-del-customer="${escapeHtml(c.id)}">Delete</button></td>
            </tr>
          `).join("") : `<tr><td colspan="6"><div class="empty-state"><div class="glyph">👤</div>No customers in the directory yet.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </section>
  `;

  document.getElementById("new-event-name").addEventListener("input", e=>{ newEventForm.name = e.target.value; });
  document.getElementById("new-event-start").addEventListener("input", e=>{ newEventForm.startDate = e.target.value; });
  document.getElementById("new-event-end").addEventListener("input", e=>{ newEventForm.endDate = e.target.value; });
  document.getElementById("add-event-btn").addEventListener("click", async ()=>{
    const name = newEventForm.name.trim();
    if(!name){ showAlert("Notice", "Give the event a name."); return; }
    if(newEventForm.startDate && newEventForm.endDate && newEventForm.startDate > newEventForm.endDate){
      showAlert("Notice", "Start date must be before the end date."); return;
    }
    STATE.events.push({ id: uid(), name, startDate: newEventForm.startDate||"", endDate: newEventForm.endDate||"" });
    newEventForm = { name:"", startDate:"", endDate:"" };
    await saveState();
    renderSettings(app);
  });
  app.querySelectorAll("[data-del-event]").forEach(b=>b.addEventListener("click", async ()=>{
    if(!(await showConfirm("Remove event", "Remove this event? Past orders keep showing its name, but it won't be selectable for new ones."))) return;
    STATE.events = STATE.events.filter(x=>x.id!==b.dataset.delEvent);
    await saveState();
    renderSettings(app);
  }));

  document.getElementById("new-salesmember-name").addEventListener("input", e=>{ newSalesMemberName = e.target.value; });
  document.getElementById("add-salesmember-btn").addEventListener("click", async ()=>{
    const name = newSalesMemberName.trim();
    if(!name){ return; }
    if(STATE.salesMembers.some(m=>m.toLowerCase()===name.toLowerCase())){ showAlert("Notice", "That sales member already exists."); return; }
    STATE.salesMembers.push(name);
    newSalesMemberName = "";
    await saveState();
    renderSettings(app);
  });
  app.querySelectorAll("[data-del-salesmember]").forEach(b=>b.addEventListener("click", async ()=>{
    if(!(await showConfirm("Remove sales member", `Remove "${b.dataset.delSalesmember}"? Past orders keep showing their name.`))) return;
    STATE.salesMembers = STATE.salesMembers.filter(x=>x!==b.dataset.delSalesmember);
    await saveState();
    renderSettings(app);
  }));

  document.getElementById("save-override-password").addEventListener("click", async ()=>{
    const val = document.getElementById("override-password").value;
    if(!val){ showAlert("Notice", "Enter a password first."); return; }
    STATE.overridePassword = val;
    await saveState();
    showAlert("Notice", "Override password saved.");
    renderSettings(app);
  });

  document.getElementById("cust-file").addEventListener("change", async e=>{
    const file = e.target.files[0];
    const msg = document.getElementById("cust-import-msg");
    if(!file) return;
    msg.innerHTML = `<span style="color:var(--ink-soft);">Reading file…</span>`;
    try{
      const {added, updated, total} = await importCustomersFromExcel(file);
      msg.innerHTML = `<span style="color:var(--ok);">Imported ${total} — ${added} new, ${updated} updated.</span>`;
      renderSettings(app);
    }catch(err){
      msg.innerHTML = `<span style="color:var(--danger);">${escapeHtml(err.message||String(err))}</span>`;
    }
    e.target.value = "";
  });

  document.getElementById("nc-userid").addEventListener("input", e=>{ newCustomerForm.userId = e.target.value; });
  document.getElementById("nc-name").addEventListener("input", e=>{ newCustomerForm.name = e.target.value; });
  document.getElementById("nc-phone").addEventListener("input", e=>{ newCustomerForm.phone = e.target.value; });
  document.getElementById("nc-role").addEventListener("change", e=>{
    newCustomerForm.role = e.target.value;
    if(newCustomerForm.role!=="Student") newCustomerForm.university = "";
    renderSettings(app);
  });
  const ncUni = document.getElementById("nc-university");
  if(ncUni) ncUni.addEventListener("change", e=>{ newCustomerForm.university = e.target.value; });
  document.getElementById("nc-save").addEventListener("click", async ()=>{
    const id = newCustomerForm.userId.trim();
    const name = newCustomerForm.name.trim();
    if(!id || !name){ showAlert("Notice", "User ID and Name are both required."); return; }
    STATE.customers[id] = {
      name, phone: newCustomerForm.phone.trim(),
      role: newCustomerForm.role || "Other",
      university: newCustomerForm.role==="Student" ? (newCustomerForm.university||"") : ""
    };
    newCustomerForm = { userId:"", name:"", phone:"", role:"Other", university:"" };
    await saveState();
    renderSettings(app);
  });
  document.getElementById("cust-search").addEventListener("input", e=>{ customerSearch = e.target.value; renderSettings(app); });
  app.querySelectorAll("[data-del-customer]").forEach(b=>b.addEventListener("click", async ()=>{
    const id = b.dataset.delCustomer;
    if(!(await showConfirm("Remove customer", `Remove "${id}" from the customer directory?`))) return;
    delete STATE.customers[id];
    await saveState();
    renderSettings(app);
  }));

  document.getElementById("new-cat-name").addEventListener("input", e=>{ newCategoryName = e.target.value; });
  document.getElementById("new-sup-name").addEventListener("input", e=>{ newSupplierName = e.target.value; });
  document.getElementById("new-uni-name").addEventListener("input", e=>{ newUniversityName = e.target.value; });

  document.getElementById("add-cat-btn").addEventListener("click", async ()=>{
    const name = newCategoryName.trim();
    if(!name){ return; }
    if(STATE.categories.some(c=>c.toLowerCase()===name.toLowerCase())){ showAlert("Notice", "That category already exists."); return; }
    STATE.categories.push(name);
    newCategoryName = "";
    await saveState();
    renderSettings(app);
  });
  document.getElementById("add-sup-btn").addEventListener("click", async ()=>{
    const name = newSupplierName.trim();
    if(!name){ return; }
    if(STATE.suppliers.some(s=>s.toLowerCase()===name.toLowerCase())){ showAlert("Notice", "That supplier already exists."); return; }
    STATE.suppliers.push(name);
    newSupplierName = "";
    await saveState();
    renderSettings(app);
  });
  document.getElementById("add-uni-btn").addEventListener("click", async ()=>{
    const name = newUniversityName.trim();
    if(!name){ return; }
    if(STATE.universities.some(u=>u.toLowerCase()===name.toLowerCase())){ showAlert("Notice", "That university already exists."); return; }
    STATE.universities.push(name);
    newUniversityName = "";
    await saveState();
    renderSettings(app);
  });
  app.querySelectorAll("[data-del-uni]").forEach(b=>b.addEventListener("click", async ()=>{
    const u = b.dataset.delUni;
    if(uniUsage[u] && !(await showConfirm("Remove university", `"${u}" is used by ${uniUsage[u]} student(s). Remove it from the list anyway? Those customers keep showing "${u}" until you edit them.`))) return;
    STATE.universities = STATE.universities.filter(x=>x!==u);
    await saveState();
    renderSettings(app);
  }));

  app.querySelectorAll("[data-del-cat]").forEach(b=>b.addEventListener("click", async ()=>{
    const c = b.dataset.delCat;
    if(catUsage[c] && !(await showConfirm("Remove category", `"${c}" is used by ${catUsage[c]} product(s). Remove it from the list anyway? Those products keep showing "${c}" until you edit them.`))) return;
    STATE.categories = STATE.categories.filter(x=>x!==c);
    await saveState();
    renderSettings(app);
  }));
  app.querySelectorAll("[data-del-sup]").forEach(b=>b.addEventListener("click", async ()=>{
    const s = b.dataset.delSup;
    if(supUsage[s] && !(await showConfirm("Remove supplier", `"${s}" is used by ${supUsage[s]} product(s). Remove it from the list anyway? Those products keep showing "${s}" until you edit them.`))) return;
    STATE.suppliers = STATE.suppliers.filter(x=>x!==s);
    await saveState();
    renderSettings(app);
  }));
}

/* ============================= USERS ============================= */
let newUserForm = null;
let editingAccessUserId = null;
function freshUserForm(){
  const access = {};
  TABS.forEach(t=>access[t.id] = (t.id==="dashboard"||t.id==="orders")); // sensible default
  return { name:"", password:"", access, canApprove:false };
}
function renderUsers(app){
  if(!newUserForm) newUserForm = freshUserForm();
  app.innerHTML = `
    <section style="margin-bottom:26px;">
      <h2 class="section-title">Users &amp; access</h2>
      <p class="section-desc">Create a user with a name, password, and exactly which sections they can see. They'll log in with those on the login screen. Only the real Admin login can preview other users' views via "Viewing as".</p>
      <div id="user-list"></div>
    </section>
    <section style="margin-bottom:26px;">
      <div class="card" style="max-width:520px;">
        <h3 style="margin:0 0 12px;font-size:13.5px;">Add user</h3>
        <div class="grid cols-2">
          <div class="field"><label class="field-label">Name</label><input id="nu-name" placeholder="e.g. Delivery Team" value="${escapeHtml(newUserForm.name)}"></div>
          <div class="field"><label class="field-label">Password</label><input id="nu-password" type="text" placeholder="Login password" value="${escapeHtml(newUserForm.password)}"></div>
        </div>
        <label class="field-label">Can see</label>
        <div class="checkbox-grid" id="nu-access">
          ${TABS.map(t=>`
            <label><input type="checkbox" data-access="${t.id}" ${newUserForm.access[t.id]?"checked":""}> ${t.label}</label>
          `).join("")}
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin:10px 0 14px;">
          <input type="checkbox" id="nu-can-approve" ${newUserForm.canApprove?"checked":""} style="width:auto;">
          Can approve Manual Sales orders
        </label>
        <button class="btn primary" id="nu-save">Add user</button>
      </div>
    </section>
    <section>
      <div class="card" style="max-width:520px;">
        <h3 style="margin:0 0 4px;font-size:13.5px;">Backup &amp; restore</h3>
        <p style="margin:0 0 12px;color:var(--ink-soft);font-size:12px;">Everything (orders, payments, delivery status, catalog, users) is saved in this browser's local storage, tied to this device and browser only — it won't show up if you open the site on a different computer or browser. Download a backup regularly and use Restore to move data between devices or recover it if storage is ever cleared.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn ghost" id="backup-download">Download backup (.json)</button>
          <label class="btn ghost" for="backup-file" style="cursor:pointer;">Restore from backup
            <input type="file" id="backup-file" accept="application/json" style="display:none;">
          </label>
        </div>
        <div id="backup-msg" style="margin-top:10px;font-size:12.5px;"></div>
      </div>
    </section>
  `;

  document.getElementById("user-list").innerHTML = STATE.users.map(u=>`
    <div class="user-card">
      <div class="uc-head">
        <div>
          <strong>${escapeHtml(u.name)}</strong>
          ${u.id===ADMIN_ID?'<span class="badge tint" style="margin-left:6px;">full access</span>':''}
          ${u.id!==ADMIN_ID && u.canApprove ? '<span class="badge ok" style="margin-left:6px;">can approve</span>' : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn ghost sm" data-set-password="${escapeHtml(u.id)}">Set password</button>
          ${u.id!==ADMIN_ID ? `<button class="btn ghost sm" data-toggle-approve="${escapeHtml(u.id)}">${u.canApprove?"Revoke approval rights":"Grant approval rights"}</button>` : ""}
          ${u.id!==ADMIN_ID ? `<button class="btn ghost sm" data-edit-access="${escapeHtml(u.id)}">${editingAccessUserId===u.id?"Cancel":"Edit access"}</button>` : ""}
          ${u.id!==ADMIN_ID ? `<button class="btn danger-ghost sm" data-del-user="${escapeHtml(u.id)}">Delete</button>` : ""}
        </div>
      </div>
      ${u.id!==ADMIN_ID && editingAccessUserId===u.id ? `
        <div style="border-top:1px solid var(--line);padding-top:10px;margin-top:8px;">
          <div class="checkbox-grid" data-edit-access-grid="${escapeHtml(u.id)}">
            ${TABS.map(t=>`
              <label><input type="checkbox" data-edit-access-item="${t.id}" ${u.access.includes(t.id)?"checked":""}> ${t.label}</label>
            `).join("")}
          </div>
          <button class="btn primary sm" data-save-access="${escapeHtml(u.id)}">Save access</button>
        </div>
      ` : `
        <div class="uc-access">
          ${u.id===ADMIN_ID
            ? `<span class="badge muted">everything</span>`
            : (u.access.length ? u.access.map(a=>{
                const t = TABS.find(x=>x.id===a);
                return `<span class="badge tint">${escapeHtml(t?t.label:a)}</span>`;
              }).join("") : `<span class="badge muted">no access yet</span>`)
          }
        </div>
      `}
    </div>
  `).join("");

  document.getElementById("nu-name").addEventListener("input", e=>{ newUserForm.name = e.target.value; });
  document.getElementById("nu-password").addEventListener("input", e=>{ newUserForm.password = e.target.value; });
  document.querySelectorAll("#nu-access [data-access]").forEach(cb=>{
    cb.addEventListener("change", e=>{ newUserForm.access[e.target.dataset.access] = e.target.checked; });
  });
  document.getElementById("nu-can-approve").addEventListener("change", e=>{ newUserForm.canApprove = e.target.checked; });
  document.getElementById("nu-save").addEventListener("click", async ()=>{
    const name = newUserForm.name.trim();
    const password = newUserForm.password;
    if(!name){ showAlert("Notice", "Give the user a name."); return; }
    if(!password){ showAlert("Notice", "Set a password for this user."); return; }
    if(STATE.users.find(u=>u.name.trim().toLowerCase()===name.toLowerCase())){ showAlert("Notice", "A user with that name already exists."); return; }
    const access = Object.entries(newUserForm.access).filter(([,v])=>v).map(([k])=>k);
    STATE.users.push({ id: uid(), name, password, access, canApprove: !!newUserForm.canApprove });
    await saveState();
    newUserForm = freshUserForm();
    renderUsers(app);
  });
  document.querySelectorAll("[data-toggle-approve]").forEach(b=>b.addEventListener("click", async ()=>{
    const u = STATE.users.find(x=>x.id===b.dataset.toggleApprove);
    if(!u) return;
    u.canApprove = !u.canApprove;
    await saveState();
    renderUsers(app);
  }));
  document.querySelectorAll("[data-edit-access]").forEach(b=>b.addEventListener("click", ()=>{
    editingAccessUserId = (editingAccessUserId===b.dataset.editAccess) ? null : b.dataset.editAccess;
    renderUsers(app);
  }));
  document.querySelectorAll("[data-save-access]").forEach(b=>b.addEventListener("click", async ()=>{
    const u = STATE.users.find(x=>x.id===b.dataset.saveAccess);
    if(!u) return;
    const grid = document.querySelector(`[data-edit-access-grid="${cssEscape(u.id)}"]`);
    const checked = [...grid.querySelectorAll("[data-edit-access-item]")].filter(cb=>cb.checked).map(cb=>cb.dataset.editAccessItem);
    u.access = checked;
    editingAccessUserId = null;
    await saveState();
    renderUsers(app);
  }));
  document.querySelectorAll("[data-del-user]").forEach(b=>b.addEventListener("click", async ()=>{
    const id = b.dataset.delUser;
    const u = STATE.users.find(x=>x.id===id);
    if(!(await showConfirm("Remove user", `Remove user "${u?u.name:""}"?`))) return;
    STATE.users = STATE.users.filter(x=>x.id!==id);
    if(STATE.currentUserId===id) STATE.currentUserId = ADMIN_ID;
    await saveState();
    renderUsers(app);
  }));
  document.querySelectorAll("[data-set-password]").forEach(b=>b.addEventListener("click", async ()=>{
    const id = b.dataset.setPassword;
    const u = STATE.users.find(x=>x.id===id);
    if(!u) return;
    const next = await showPasswordPrompt("Set password", `New password for "${u.name}":`);
    if(next===null) return;
    if(!next){ await showAlert("Missing password", "Password can't be empty."); return; }
    u.password = next;
    await saveState();
    await showAlert("Done", "Password updated.");
  }));

  const backupMsg = document.getElementById("backup-msg");
  document.getElementById("backup-download").addEventListener("click", ()=>{
    const payload = JSON.stringify(STATE, null, 2);
    const blob = new Blob([payload], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    a.href = url; a.download = `eds-console-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    backupMsg.innerHTML = `<span style="color:var(--ok);">Backup downloaded.</span>`;
  });
  document.getElementById("backup-file").addEventListener("change", async e=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.sales) || !Array.isArray(parsed.users)){
        throw new Error("This file doesn't look like an EDS Console backup.");
      }
      if(!(await showConfirm("Restore backup", "Replace all current data with this backup? This can't be undone."))) { e.target.value=""; return; }
      STATE = Object.assign({sales:[],restock:{},reorder:{},delivery:{},paymentSplits:{},manualApprovals:{},timing:{},products:[],categories:[],suppliers:[],universities:[],events:[],salesMembers:[],customers:{},users:[],currentUserId:""}, parsed);
      if(!Array.isArray(STATE.products) || STATE.products.length===0) STATE.products = JSON.parse(JSON.stringify(BASE_PRODUCTS));
      if(!Array.isArray(STATE.users) || STATE.users.length===0) STATE.users = [{id:ADMIN_ID,name:"Admin",password:DEFAULT_ADMIN_PASSWORD,access:TABS.map(t=>t.id)}];
      rebuildIndexes();
      await saveState();
      backupMsg.innerHTML = `<span style="color:var(--ok);">Backup restored — ${STATE.sales.length} sale lines loaded.</span>`;
      renderUsers(app);
    }catch(err){
      backupMsg.innerHTML = `<span style="color:var(--danger);">Couldn't restore: ${escapeHtml(err.message||String(err))}</span>`;
    }
    e.target.value = "";
  });
}

window.addEventListener("afterprint", ()=>{
  document.body.classList.remove("printing-receipt");
  document.body.classList.remove("printing-invoice");
});

/* ============================= INIT ============================= */
(async function init(){
  render();
  await loadState();
  render();
})();
</script>
</body>
</html>
