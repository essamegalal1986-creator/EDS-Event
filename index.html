<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EDS Event Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ec;
    --surface:#ffffff;
    --surface-2:#f4f6f2;
    --ink:#152420;
    --ink-soft:#4b5b54;
    --line:#d7ddd4;
    --primary:#0f5c52;
    --primary-dark:#0a3f38;
    --primary-tint:#e3ede9;
    --accent:#c07a2b;
    --accent-tint:#f6e8d4;
    --danger:#a83a2c;
    --danger-tint:#f4ded9;
    --warn:#b8811f;
    --warn-tint:#f6ecd4;
    --ok:#3c7a4c;
    --ok-tint:#dfeee2;
    --radius:10px;
    --shadow:0 1px 2px rgba(21,36,32,.06), 0 4px 14px rgba(21,36,32,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans',-apple-system,sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

  header.top{
    background:var(--primary-dark);
    color:#fff;
    padding:22px 20px 0;
    margin-bottom:22px;
  }
  header.top .inner{max-width:1180px;margin:0 auto;}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand .mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;
    background:var(--accent);color:#2a1a05;
    padding:3px 8px;border-radius:4px;font-weight:600;
  }
  .brand h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .brand .sub{color:#bcd3cd;font-size:12.5px;margin-top:2px;}
  nav.tabs{display:flex;gap:2px;margin-top:18px;overflow-x:auto;}
  nav.tabs button{
    background:transparent;border:none;color:#bcd3cd;
    padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;
    border-bottom:3px solid transparent;white-space:nowrap;
    font-family:inherit;
  }
  nav.tabs button:hover{color:#fff;}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--accent);}

  h2.section-title{
    font-size:17px;font-weight:800;margin:0 0 4px;color:var(--primary-dark);
  }
  p.section-desc{color:var(--ink-soft);margin:0 0 18px;font-size:13px;}

  .grid{display:grid;gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-top:6px;color:var(--primary-dark);}
  .stat .value.danger{color:var(--danger);}
  .stat .value.warn{color:var(--warn);}
  .stat .note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  table{border-collapse:collapse;width:100%;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;
    background:var(--surface-2);
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);}
  .table-wrap table{border:none;}
  .table-wrap thead th{border-top:none;}

  .badge{
    display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;
    letter-spacing:.02em;
  }
  .badge.ok{background:var(--ok-tint);color:var(--ok);}
  .badge.warn{background:var(--warn-tint);color:var(--warn);}
  .badge.danger{background:var(--danger-tint);color:var(--danger);}
  .badge.tint{background:var(--primary-tint);color:var(--primary-dark);}
  .badge.accent{background:var(--accent-tint);color:#7a4c17;}
  .badge.muted{background:var(--surface-2);color:var(--ink-soft);}

  button.btn{
    font-family:inherit;font-weight:700;font-size:12.5px;border-radius:7px;
    padding:9px 14px;border:1px solid transparent;cursor:pointer;
  }
  button.btn.primary{background:var(--primary);color:#fff;}
  button.btn.primary:hover{background:var(--primary-dark);}
  button.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  button.btn.ghost:hover{background:var(--surface-2);}
  button.btn.danger-ghost{background:transparent;border-color:var(--danger-tint);color:var(--danger);}
  button.btn.danger-ghost:hover{background:var(--danger-tint);}
  button.btn.sm{padding:5px 10px;font-size:11.5px;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}

  label.field-label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
  input,select,textarea{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--ink);width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:12px;}

  .lineitem-row{display:grid;grid-template-columns:2.4fr .7fr .8fr .9fr .9fr .9fr 32px;gap:8px;align-items:end;margin-bottom:8px;}
  .lineitem-row .li-label{font-size:10px;color:var(--ink-soft);margin-bottom:3px;font-weight:700;text-transform:uppercase;}
  @media (max-width:820px){.lineitem-row{grid-template-columns:1fr 1fr;} }

  .remove-x{
    background:var(--danger-tint);color:var(--danger);border:none;border-radius:6px;
    width:32px;height:34px;cursor:pointer;font-weight:800;
  }

  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:26px;margin-bottom:6px;}

  .invoice-doc{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:32px;max-width:760px;margin:0 auto;box-shadow:var(--shadow);
  }
  .invoice-doc .idoc-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--primary-dark);padding-bottom:16px;margin-bottom:20px;
  }
  .invoice-doc .idoc-head h3{margin:0;font-size:20px;color:var(--primary-dark);letter-spacing:-.01em;}
  .invoice-doc .idoc-head .num{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--accent);font-weight:700;}
  .idoc-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
  .idoc-meta div div.k{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.06em;font-weight:700;}
  .idoc-meta div div.v{font-size:14px;margin-top:2px;}
  .idoc-totals{margin-top:14px;width:280px;margin-left:auto;}
  .idoc-totals div.trow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;}
  .idoc-totals div.trow.grand{border-top:2px solid var(--primary-dark);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px;color:var(--primary-dark);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px;}
  .toolbar .field{margin-bottom:0;min-width:160px;}

  .pill-toggle{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;}
  .pill-toggle button{border:none;background:#fff;padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .pill-toggle button.active{background:var(--primary);color:#fff;}

  .catalog-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:14px 16px;}
  .catalog-card h4{margin:0 0 4px;font-size:13.5px;}
  .catalog-card .price{font-family:'IBM Plex Mono',monospace;color:var(--primary-dark);font-weight:700;font-size:14px;}
  .catalog-card .comp{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#c3cdc4;border-radius:8px;}

  @media print{
    header.top, nav.tabs, .no-print{display:none !important;}
    body{background:#fff;}
    .invoice-doc{box-shadow:none;border:none;padding:0;}
  }
</style>
</head>

let STATE = {

  restock: {},      // productName -> number

};
let loaded = false;
let activeTab = "dashboard";

const STORAGE_KEY = "eds_console_state_v1";

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      STATE = Object.assign(STATE, parsed);
    }
  }catch(e){ /* no saved state yet */ }
  loaded = true;
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
  }catch(e){ console.error("Storage error", e); }

/* ============================= HELPERS ============================= */
function fmtEGP(n){
  if(n === "" || n === null || n === undefined || isNaN(n)) return "—";
  return "EGP " + Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function nextInvoiceNo(){
  let max = 0;
  STATE.sales.forEach(s=>{
    const m = /^INV-(\d+)$/.exec(s.invoiceNo || "");
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "INV-" + String(max+1).padStart(4,"0");
}

function lineCalc(qty, unitPrice, discountPct){
  qty = Number(qty)||0; unitPrice = Number(unitPrice)||0; discountPct = Number(discountPct)||0;
  const discountAmt = qty*unitPrice*discountPct/100;
  const lineTotal = qty*unitPrice - discountAmt;
  return {discountAmt, lineTotal};
}

function invoiceList(){
  const map = new Map();
  STATE.sales.forEach(s=>{
    if(!map.has(s.invoiceNo)) map.set(s.invoiceNo, []);
    map.get(s.invoiceNo).push(s);
  });
  return map;
}

function invoiceSummary(rows){
  const subtotal = rows.reduce((a,r)=>a + Number(r.qty)*Number(r.unitPrice),0);
  const discount = rows.reduce((a,r)=>a + lineCalc(r.qty,r.unitPrice,r.discountPct).discountAmt,0);
  const grand = subtotal - discount;
  return {subtotal, discount, grand};
}

function stockRows(){
  return PRODUCTS.filter(p=>p.type==="Individual").map(p=>{
    const directSold = STATE.sales
      .filter(s=>s.productName===p.name && s.paymentStatus==="Paid")
      .reduce((a,s)=>a+Number(s.qty),0);
    const bundleUses = componentUsage[p.name] || [];
    const bundleConsumed = bundleUses.reduce((total,u)=>{
      const qtySold = STATE.sales
        .filter(s=>s.productName===u.bundle && s.paymentStatus==="Paid")
        .reduce((a,s)=>a+Number(s.qty),0);
      return total + qtySold*u.qty;
    },0);
    const totalUsed = directSold + bundleConsumed;
    const restock = Number(STATE.restock[p.name])||0;
    const reorder = Number(STATE.reorder[p.name])||0;
    const current = p.opening + restock - totalUsed;
    let status = "OK";
    if(current<=0) status="OUT OF STOCK"; else if(current<=reorder) status="LOW STOCK";
    return {...p, directSold, bundleConsumed, totalUsed, restock, reorder, current, status};
  });
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(app){
  const invMap = invoiceList();
  const totalInvoices = invMap.size;
  let revenue = 0, outstanding = 0;
  invMap.forEach(rows=>{
    const {grand} = invoiceSummary(rows);
    const allPaid = rows.every(r=>r.paymentStatus==="Paid");
    if(allPaid) revenue += grand; else outstanding += grand;
  });
  const stock = stockRows();
  const outCount = stock.filter(s=>s.status==="OUT OF STOCK").length;
  const lowCount = stock.filter(s=>s.status==="LOW STOCK").length;

  const recent = [...invMap.entries()].slice(-5).reverse();

  app.innerHTML = `

        <div class="card stat"><div class="label">Outstanding</div><div class="value warn">${fmtEGP(outstanding)}</div><div class="note">unpaid / partially unpaid</div></div>
        <div class="card stat"><div class="label">Stock Alerts</div><div class="value ${outCount>0?'danger':(lowCount>0?'warn':'')}">${outCount+lowCount}</div><div class="note">${outCount} out · ${lowCount} low</div></div>
      </div>
    </section>
    <section>
      <h2 class="section-title">Recent invoices</h2>
      <p class="section-desc">Most recently created invoices.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Status</th><th class="num">Grand Total</th></tr></thead>
          <tbody>
          ${recent.length? recent.map(([no,rows])=>{

          </tbody>
        </table>
      </div>

  `;
}

    },0);
  });
}

      if(!(s.invoiceNo.toLowerCase().includes(q) || s.customer.toLowerCase().includes(q) || s.productName.toLowerCase().includes(q))) return false;
    }

  }).slice().reverse();

          </tr></thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
    </section>
  `;
  const body = document.getElementById("log-body");
  if(rows.length===0){
    body.innerHTML = `<tr><td colspan="10"><div class="empty-state"><div class="glyph">📄</div>No sales match this filter.</div></td></tr>`;
  } else {
    body.innerHTML = rows.map(s=>{

        <td class="mono">${escapeHtml(s.invoiceNo)}</td>

  body.querySelectorAll("[data-toggle-pay]").forEach(b=>b.addEventListener("click", async ()=>{
    const s = STATE.sales.find(x=>x.id===b.dataset.togglePay);

    await saveState(); renderSalesLog(app);

  body.querySelectorAll("[data-toggle-del]").forEach(b=>b.addEventListener("click", async ()=>{

        <div class="idoc-totals">
          <div class="trow"><span>Subtotal</span><span class="mono">${fmtEGP(subtotal)}</span></div>
          <div class="trow"><span>Total discount</span><span class="mono">−${fmtEGP(discount)}</span></div>
          <div class="trow grand"><span>Grand total</span><span class="mono">${fmtEGP(grand)}</span></div>
        </div>
        ${h.notes?`<div style="margin-top:20px;font-size:12.5px;color:var(--ink-soft);"><strong>Notes:</strong> ${escapeHtml(h.notes)}</div>`:""}
      </div>
    `;
  }
  sel.addEventListener("change", e=>draw(e.target.value));
  document.getElementById("print-invoice").addEventListener("click", ()=>window.print());
  draw("");
}

/* ============================= STOCK CONTROL ============================= */
function renderStock(app){
  const rows = stockRows();
  const out = rows.filter(r=>r.status==="OUT OF STOCK").length;
  const low = rows.filter(r=>r.status==="LOW STOCK").length;
  const ok = rows.filter(r=>r.status==="OK").length;

  app.innerHTML = `
    <section style="margin-bottom:22px;">
      <h2 class="section-title">Stock control</h2>
      <p class="section-desc">Current stock = Opening + Restock − (Direct sold + Bundle-consumed), counting only <strong>Paid</strong> sales. Edit Restock / Reorder Level inline.</p>
      <div class="grid cols-3">
        <div class="card stat"><div class="label">OK</div><div class="value">${ok}</div></div>
        <div class="card stat"><div class="label">Low stock</div><div class="value warn">${low}</div></div>
        <div class="card stat"><div class="label">Out of stock</div><div class="value danger">${out}</div></div>
      </div>
    </section>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>ID</th><th>Product</th><th class="num">Opening</th><th class="num">Restock</th>
          <th class="num">Direct Sold</th><th class="num">Bundle Used</th><th class="num">Total Used</th>
          <th class="num">Current</th><th class="num">Reorder Lvl</th><th>Status</th>
        </tr></thead>
        <tbody id="stock-body"></tbody>
      </table>
    </div>
  `;
  const body = document.getElementById("stock-body");
  body.innerHTML = rows.map(r=>{
    const badge = r.status==="OK"?"ok":(r.status==="LOW STOCK"?"warn":"danger");
    return `<tr>
      <td class="mono">${escapeHtml(r.id)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td class="num mono">${r.opening}</td>
      <td class="num"><input type="number" class="mono" style="width:76px;" data-restock="${escapeHtml(r.name)}" value="${r.restock}"></td>
      <td class="num mono">${r.directSold}</td>
      <td class="num mono">${r.bundleConsumed}</td>
      <td class="num mono">${r.totalUsed}</td>
      <td class="num mono" style="font-weight:700;">${r.current}</td>
      <td class="num"><input type="number" class="mono" style="width:70px;" data-reorder="${escapeHtml(r.name)}" value="${r.reorder}"></td>
      <td><span class="badge ${badge}">${r.status}</span></td>
    </tr>`;
  }).join("");
  body.querySelectorAll("[data-restock]").forEach(inp=>inp.addEventListener("change", async e=>{
    STATE.restock[e.target.dataset.restock] = Number(e.target.value)||0;
    await saveState(); renderStock(app);
  }));
  body.querySelectorAll("[data-reorder]").forEach(inp=>inp.addEventListener("change", async e=>{
    STATE.reorder[e.target.dataset.reorder] = Number(e.target.value)||0;
    await saveState(); renderStock(app);
  }));
}

/* ============================= INIT ============================= */
(async function init(){
  render();
  await loadState();
  render();
})();
</script>
</body>
</html>
